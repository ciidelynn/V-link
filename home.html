<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Idol Ecosystem - Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .app-icon { transition: transform 0.2s; }
        .app-icon:active { transform: scale(0.92); }
    </style>
</head>
<body class="bg-slate-950 min-h-screen text-white flex justify-center items-center p-4">

    <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-[2.5rem] shadow-2xl overflow-hidden p-8 flex flex-col min-h-[700px]">
        
        <div class="flex justify-between items-center text-xs text-slate-400 mb-8">
            <span id="realtimeClock" class="font-medium">Loading...</span>
            <span id="roleBadge" class="bg-pink-900/30 text-pink-400 px-2 py-0.5 rounded-full uppercase font-bold">Admin</span>
        </div>

        <div class="mb-10">
            <h1 class="text-2xl font-bold">สวัสดี, <span id="userDisplay" class="text-pink-400">...</span></h1>
            <p class="text-xs text-slate-400 mt-1">ยินดีต้อนรับสู่ Virtual Idol Ecosystem</p>
        </div>

        <div class="grid grid-cols-3 gap-y-8 gap-x-4">
            <!-- S-link -->
            <div class="app-icon flex flex-col items-center cursor-pointer" onclick="openApp('s-link.html')">
                <div class="w-16 h-16 bg-gradient-to-tr from-amber-500 via-pink-500 to-purple-600 rounded-2xl flex items-center justify-center">
                    <svg class="w-8 h-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><rect width="20" height="20" x="2" y="2" rx="5" ry="5" stroke-width="2"/><path d="M16 11.37A4 4 0 1112.63 8 4 4 0 0116 11.37z"/></svg>
                </div>
                <span class="text-xs mt-2 text-slate-300">S-link</span>
            </div>

            <!-- X-ling -->
            <div class="app-icon flex flex-col items-center cursor-pointer" onclick="openApp('x-ling.html')">
                <div class="w-16 h-16 bg-black border border-slate-700 rounded-2xl flex items-center justify-center text-xl font-black">𝕏</div>
                <span class="text-xs mt-2 text-slate-300">X-ling</span>
            </div>

            <!-- U-link -->
            <div class="app-icon flex flex-col items-center cursor-pointer" onclick="openApp('u-link.html')">
                <div class="w-16 h-16 bg-red-600 rounded-2xl flex items-center justify-center">
                    <svg class="w-8 h-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/></svg>
                </div>
                <span class="text-xs mt-2 text-slate-300">U-link</span>
            </div>

            <!-- Store -->
            <div class="app-icon flex flex-col items-center cursor-pointer" onclick="openApp('store.html')">
                <div class="w-16 h-16 bg-emerald-600 rounded-2xl flex items-center justify-center">
                    <svg class="w-8 h-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
                </div>
                <span class="text-xs mt-2 text-slate-300">Store</span>
            </div>

            <!-- Bank -->
            <div class="app-icon flex flex-col items-center cursor-pointer" onclick="openApp('virtual-bank.html')">
                <div class="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center">
                    <svg class="w-8 h-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1"/></svg>
                </div>
                <span class="text-xs mt-2 text-slate-300">Bank</span>
            </div>

            <!-- Profile -->
            <div class="app-icon flex flex-col items-center cursor-pointer" onclick="openApp('profile.html')">
                <div class="w-16 h-16 bg-orange-500 rounded-2xl flex items-center justify-center">
                    <svg class="w-8 h-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                </div>
                <span class="text-xs mt-2 text-slate-300">Profile</span>
            </div>

            <!-- Admin Portal -->
            <div id="adminAppIcon" class="hidden app-icon flex-col items-center cursor-pointer" onclick="openApp('admin.html')">
                <div class="w-16 h-16 bg-pink-600 rounded-2xl flex items-center justify-center">
                    <svg class="w-8 h-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
                </div>
                <span class="text-xs mt-2 text-pink-300 font-bold">Admin</span>
            </div>

            <!-- Agency -->
            <div id="agencyAppIcon" class="hidden app-icon flex-col items-center cursor-pointer" onclick="openApp('agency.html')">
                <div class="w-16 h-16 bg-purple-600 rounded-2xl flex items-center justify-center">
                    <svg class="w-8 h-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
                </div>
                <span class="text-xs mt-2 text-purple-300 font-bold">Agency</span>
            </div>
        </div>

        <div class="mt-auto pt-8 text-center"><button onclick="localStorage.clear(); window.location.href='index.html';" class="text-xs text-rose-400">ออกจากระบบ</button></div>
    </div>

    <script>
        const role = localStorage.getItem('userRole');
        const email = localStorage.getItem('userEmail');
        document.getElementById('userDisplay').innerText = email ? email.split('@')[0] : "ผู้ใช้";
        
        if (role === 'admin') {
            document.getElementById('adminAppIcon').classList.remove('hidden');
            document.getElementById('agencyAppIcon').classList.remove('hidden');
        } else if (role === 'agency') {
            document.getElementById('agencyAppIcon').classList.remove('hidden');
        }
        function openApp(url) { window.location.href = url; }
    </script>
</body>
</html>
