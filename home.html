<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Idol Ecosystem - Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .app-icon { transition: transform 0.2s, filter 0.2s; }
        .app-icon:active { transform: scale(0.92); }
    </style>
</head>
<body class="bg-slate-950 min-h-screen text-white flex justify-center items-center p-4">

    <!-- Smartphone Frame Container -->
    <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-[2.5rem] shadow-2xl overflow-hidden p-8 flex flex-col min-h-[700px]">
        
        <!-- Header -->
        <div class="flex justify-between items-center text-xs text-slate-400 mb-8">
            <span id="realtimeClock" class="font-medium">Loading...</span>
            <div class="flex items-center space-x-1.5">
                <span id="statusDot" class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span id="roleBadge" class="text-[10px] uppercase font-semibold text-emerald-400">User</span>
            </div>
        </div>

        <div class="mb-10">
            <h1 class="text-2xl font-bold">สวัสดี, <span id="userDisplay" class="text-pink-400">ผู้ใช้</span></h1>
            <p class="text-xs text-slate-400 mt-1">ยินดีต้อนรับสู่ Virtual Idol Ecosystem</p>
        </div>

        <!-- App Grid -->
        <div class="grid grid-cols-3 gap-y-8 gap-x-4">
            
            <!-- S-link -->
            <div class="app-icon flex flex-col items-center cursor-pointer group" onclick="openApp('s-link.html')">
                <div class="w-16 h-16 bg-gradient-to-tr from-amber-500 via-pink-500 to-purple-600 rounded-2xl flex items-center justify-center shadow-lg shadow-pink-500/20">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><rect width="20" height="20" x="2" y="2" rx="5" ry="5" stroke-width="2"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11.37A4 4 0 1112.63 8 4 4 0 0116 11.37z"/></svg>
                </div>
                <span class="text-xs mt-2 text-slate-300">S-link</span>
            </div>

            <!-- อื่นๆ -->
            <div class="app-icon flex flex-col items-center cursor-pointer" onclick="openApp('x-ling.html')">
                <div class="w-16 h-16 bg-black border border-slate-700 rounded-2xl flex items-center justify-center text-xl font-black">𝕏</div>
                <span class="text-xs mt-2 text-slate-300">X-ling</span>
            </div>

            <div class="app-icon flex flex-col items-center cursor-pointer" onclick="openApp('u-link.html')">
                <div class="w-16 h-16 bg-red-600 rounded-2xl flex items-center justify-center"><svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" /></svg></div>
                <span class="text-xs mt-2 text-slate-300">U-link</span>
            </div>

            <div class="app-icon flex flex-col items-center cursor-pointer" onclick="openApp('store.html')">
                <div class="w-16 h-16 bg-emerald-600 rounded-2xl flex items-center justify-center"><svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" /></svg></div>
                <span class="text-xs mt-2 text-slate-300">Store</span>
            </div>

            <div class="app-icon flex flex-col items-center cursor-pointer" onclick="openApp('virtual-bank.html')">
                <div class="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center"><svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1" /></svg></div>
                <span class="text-xs mt-2 text-slate-300">Bank</span>
            </div>

            <div class="app-icon flex flex-col items-center cursor-pointer" onclick="openApp('profile.html')">
                <div class="w-16 h-16 bg-orange-500 rounded-2xl flex items-center justify-center"><svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0z" /></svg></div>
                <span class="text-xs mt-2 text-slate-300">Profile</span>
            </div>

            <!-- เมนู Agency (จะแสดงก็ต่อเมื่อเป็น Admin) -->
            <div id="agencyAppIcon" class="app-icon hidden flex-col items-center cursor-pointer" onclick="openApp('agency.html')">
                <div class="w-16 h-16 bg-purple-600 rounded-2xl flex items-center justify-center"><svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5" /></svg></div>
                <span class="text-xs mt-2 text-purple-300 font-semibold">Agency</span>
            </div>
        </div>

        <div class="mt-auto pt-8 flex justify-center">
            <button onclick="logout()" class="text-xs text-rose-400 hover:text-rose-300">ออกจากระบบ</button>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            document.getElementById('realtimeClock').innerText = now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // ดึงข้อมูลอีเมลผู้ใช้จาก LocalStorage
        const email = localStorage.getItem('userEmail') || '';
        const userRole = localStorage.getItem('userRole');

        if(email) {
            document.getElementById('userDisplay').innerText = email.split('@')[0];
        }

        // กำหนดเงื่อนไขอีเมลแอดมินของคุณ (สามารถเปลี่ยนหรือเพิ่มอีเมลแอดมินตรงนี้ได้เลยครับ)
        const adminEmails = ["ciidelynn@gmail.com", "admin@vlink.com"]; // <-- ใส่เมลแอดมินของคุณตรงนี้

        if(userRole === 'admin' || adminEmails.includes(email.toLowerCase())) {
            // บังคับเซ็ตสิทธิ์ให้เป็น Admin ในเครื่องทันที
            localStorage.setItem('userRole', 'admin');
            
            // แสดงป้าย Admin และเปิดไอคอน Agency
            document.getElementById('agencyAppIcon').classList.remove('hidden');
            document.getElementById('agencyAppIcon').classList.add('flex');
            
            const badge = document.getElementById('roleBadge');
            badge.innerText = "Admin";
            badge.className = "text-[10px] uppercase font-semibold text-pink-400";
            
            document.getElementById('statusDot').className = "w-2 h-2 rounded-full bg-pink-400 animate-pulse";
        }

        function openApp(page) { window.location.href = page; }
        function logout() { localStorage.clear(); window.location.href = 'index.html'; }
    </script>
</body>
</html>
