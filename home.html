<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Idol Ecosystem - Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Prompt', sans-serif; }</style>
</head>
<body class="bg-slate-950 min-h-screen text-white p-4">
    <div class="max-w-sm mx-auto bg-slate-900 border border-slate-800 rounded-[2.5rem] shadow-2xl p-8 min-h-[700px] flex flex-col">
        
        <div class="flex justify-between items-center mb-8 text-xs text-slate-400">
            <span id="clock">Loading...</span>
            <span id="roleBadge" class="bg-emerald-900/50 text-emerald-400 px-2 py-1 rounded-full uppercase">User</span>
        </div>

        <h1 class="text-2xl font-bold mb-10">สวัสดี, <span id="userDisplay" class="text-pink-400">ผู้ใช้</span></h1>

        <div class="grid grid-cols-3 gap-y-8 gap-x-4">
            <!-- แอปมาตรฐาน -->
            <div class="flex flex-col items-center cursor-pointer" onclick="openApp('s-link.html')"><div class="w-16 h-16 bg-gradient-to-tr from-amber-500 to-purple-600 rounded-2xl"></div><span class="text-xs mt-2">S-link</span></div>
            <div class="flex flex-col items-center cursor-pointer" onclick="openApp('x-ling.html')"><div class="w-16 h-16 bg-black border border-slate-700 rounded-2xl flex items-center justify-center font-black">𝕏</div><span class="text-xs mt-2">X-ling</span></div>
            <div class="flex flex-col items-center cursor-pointer" onclick="openApp('u-link.html')"><div class="w-16 h-16 bg-red-600 rounded-2xl"></div><span class="text-xs mt-2">U-link</span></div>
            <div class="flex flex-col items-center cursor-pointer" onclick="openApp('store.html')"><div class="w-16 h-16 bg-emerald-600 rounded-2xl"></div><span class="text-xs mt-2">Store</span></div>
            <div class="flex flex-col items-center cursor-pointer" onclick="openApp('virtual-bank.html')"><div class="w-16 h-16 bg-blue-600 rounded-2xl"></div><span class="text-xs mt-2">Bank</span></div>
            <div class="flex flex-col items-center cursor-pointer" onclick="openApp('profile.html')"><div class="w-16 h-16 bg-orange-500 rounded-2xl"></div><span class="text-xs mt-2">Profile</span></div>

            <!-- แอป Admin (เฉพาะ Admin) -->
            <div id="adminAppIcon" class="hidden flex-col items-center cursor-pointer" onclick="openApp('admin.html')">
                <div class="w-16 h-16 bg-pink-600 rounded-2xl flex items-center justify-center shadow-lg shadow-pink-600/30">🛡️</div>
                <span class="text-xs mt-2 text-pink-300 font-bold">Admin</span>
            </div>

            <!-- แอป Agency (สำหรับทีมบริหาร) -->
            <div id="agencyAppIcon" class="hidden flex-col items-center cursor-pointer" onclick="openApp('agency.html')">
                <div class="w-16 h-16 bg-purple-600 rounded-2xl flex items-center justify-center shadow-lg shadow-purple-600/30">📊</div>
                <span class="text-xs mt-2 text-purple-300 font-bold">Agency</span>
            </div>
        </div>
    </div>

    <script>
        const role = localStorage.getItem('userRole');
        const email = localStorage.getItem('userEmail');
        
        document.getElementById('userDisplay').innerText = email ? email.split('@')[0] : "ผู้ใช้";
        document.getElementById('roleBadge').innerText = role || "User";

        // ตรวจสอบสิทธิ์
        if (role === 'admin') {
            document.getElementById('adminAppIcon').classList.remove('hidden');
            document.getElementById('agencyAppIcon').classList.remove('hidden');
        } else if (role === 'agency') {
            document.getElementById('agencyAppIcon').classList.remove('hidden');
        }

        function openApp(url) { window.location.href = url; }
    </script>
</body>
</html>
