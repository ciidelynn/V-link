<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Idol Ecosystem - Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- ใช้ Heroicons เพื่อความชัวร์ในการแสดงผล -->
    <script src="https://unpkg.com/@heroicons/v2/24/outline/index.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-white p-4 flex justify-center">
    <div class="w-full max-w-sm bg-slate-900 rounded-[2rem] p-6 shadow-2xl">
        <div class="mb-6">
            <h1 class="text-xl font-bold">สวัสดี, <span id="userDisplay" class="text-pink-400">ผู้ใช้</span></h1>
            <p class="text-xs text-slate-400">ยินดีต้อนรับสู่ระบบ</p>
        </div>

        <div class="grid grid-cols-3 gap-6">
            <!-- สร้างแอปโดยใช้ Template เดียวกัน -->
            <div class="flex flex-col items-center cursor-pointer" onclick="openApp('s-link.html')">
                <div class="w-14 h-14 bg-gradient-to-tr from-amber-500 to-pink-500 rounded-2xl flex items-center justify-center text-white">📷</div>
                <span class="text-[10px] mt-1">S-link</span>
            </div>
            <div class="flex flex-col items-center cursor-pointer" onclick="openApp('x-ling.html')">
                <div class="w-14 h-14 bg-black border border-slate-700 rounded-2xl flex items-center justify-center text-white font-bold">𝕏</div>
                <span class="text-[10px] mt-1">X-ling</span>
            </div>
            <div class="flex flex-col items-center cursor-pointer" onclick="openApp('u-link.html')">
                <div class="w-14 h-14 bg-red-600 rounded-2xl flex items-center justify-center text-white">▶️</div>
                <span class="text-[10px] mt-1">U-link</span>
            </div>
            <div class="flex flex-col items-center cursor-pointer" onclick="openApp('store.html')">
                <div class="w-14 h-14 bg-emerald-600 rounded-2xl flex items-center justify-center text-white">🛍️</div>
                <span class="text-[10px] mt-1">Store</span>
            </div>
            <div class="flex flex-col items-center cursor-pointer" onclick="openApp('virtual-bank.html')">
                <div class="w-14 h-14 bg-blue-600 rounded-2xl flex items-center justify-center text-white">💰</div>
                <span class="text-[10px] mt-1">Bank</span>
            </div>
            <div class="flex flex-col items-center cursor-pointer" onclick="openApp('profile.html')">
                <div class="w-14 h-14 bg-orange-500 rounded-2xl flex items-center justify-center text-white">👤</div>
                <span class="text-[10px] mt-1">Profile</span>
            </div>
            
            <!-- Admin -->
            <div id="adminApp" class="hidden flex-col items-center cursor-pointer" onclick="openApp('admin.html')">
                <div class="w-14 h-14 bg-pink-600 rounded-2xl flex items-center justify-center text-white">🛡️</div>
                <span class="text-[10px] mt-1 text-pink-400">Admin</span>
            </div>
            <!-- Agency -->
            <div id="agencyApp" class="hidden flex-col items-center cursor-pointer" onclick="openApp('agency.html')">
                <div class="w-14 h-14 bg-purple-600 rounded-2xl flex items-center justify-center text-white">📊</div>
                <span class="text-[10px] mt-1 text-purple-400">Agency</span>
            </div>
        </div>

        <button onclick="localStorage.clear(); location.reload();" class="mt-10 w-full text-[10px] text-slate-500">ออกจากระบบ</button>
    </div>

    <script>
        const role = localStorage.getItem('userRole');
        document.getElementById('userDisplay').innerText = localStorage.getItem('userEmail')?.split('@')[0] || "ผู้ใช้";
        
        if (role === 'admin') {
            document.getElementById('adminApp').classList.remove('hidden');
            document.getElementById('agencyApp').classList.remove('hidden');
        } else if (role === 'agency') {
            document.getElementById('agencyApp').classList.remove('hidden');
        }
        function openApp(url) { window.location.href = url; }
    </script>
</body>
</html>
