<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S-link - Mini Social Network</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Prompt', sans-serif; } </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex justify-center items-center p-0">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 shadow-2xl overflow-hidden flex flex-col h-screen relative">
        
        <!-- Header -->
        <div class="flex justify-between items-center px-6 py-4 border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-20">
            <button onclick="window.history.back()" class="text-slate-400 text-xs">← ย้อนกลับ</button>
            <h1 class="text-base font-bold text-pink-500">S-link</h1>
            <button onclick="openPostModal()" class="bg-pink-600 text-white p-2 rounded-full text-xs shadow-lg shadow-pink-900/40">เพิ่มโพสต์</button>
        </div>

        <!-- Main Content Container -->
        <div id="feedContainer" class="flex-1 overflow-y-auto space-y-4 p-4 pb-20">
            <p class="text-center text-slate-500 text-xs py-10">กำลังโหลดข้อมูล...</p>
        </div>

        <!-- Bottom Nav -->
        <div class="absolute bottom-0 left-0 right-0 bg-slate-950/95 border-t border-slate-800 p-3 flex justify-around z-20">
            <button onclick="switchTab('feed')" id="navFeed" class="text-pink-500 flex flex-col items-center text-[10px] font-bold">🏠 หน้าแรก</button>
            <button onclick="switchTab('search')" id="navSearch" class="text-slate-500 flex flex-col items-center text-[10px]">🔍 ค้นหา</button>
            <button onclick="switchTab('messages')" id="navMessages" class="text-slate-500 flex flex-col items-center text-[10px]">💬 ข้อความ</button>
            <button onclick="switchTab('profile')" id="navProfile" class="text-slate-500 flex flex-col items-center text-[10px]">👤 โปรไฟล์</button>
        </div>
    </div>

    <!-- Post Modal -->
    <div id="postModal" class="fixed inset-0 bg-black/90 hidden flex justify-center items-center p-4 z-50">
        <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-4">
            <h3 class="text-sm font-bold text-pink-400">สร้างโพสต์</h3>
            <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="previewImage(event)">
            <button onclick="document.getElementById('fileInput').click()" class="w-full h-40 border-2 border-dashed border-slate-700 rounded-2xl flex items-center justify-center overflow-hidden relative">
                <img id="imagePreview" src="" class="hidden w-full h-full object-contain bg-black">
                <span id="uploadPlaceholder" class="text-xs text-slate-500">เลือกรูปภาพจากมือถือ</span>
            </button>
            <textarea id="postCaption" rows="2" placeholder="แคปชัน..." class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-2xl text-xs"></textarea>
            <div class="grid grid-cols-2 gap-3">
                <button onclick="closePostModal()" class="bg-slate-800 py-3 rounded-2xl text-xs">ยกเลิก</button>
                <button onclick="createPost()" id="submitPostBtn" class="bg-pink-600 py-3 rounded-2xl text-xs font-bold">โพสต์</button>
            </div>
        </div>
    </div>

    <!-- Edit Profile Modal -->
    <div id="editProfileModal" class="fixed inset-0 bg-black/90 hidden flex justify-center items-center p-4 z-50">
        <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-4">
            <h3 class="text-sm font-bold text-pink-400">แก้ไขโปรไฟล์</h3>
            <div class="flex flex-col items-center space-y-2">
                <input type="file" id="avatarInput" accept="image/*" class="hidden" onchange="previewAvatar(event)">
                <div onclick="document.getElementById('avatarInput').click()" class="w-20 h-20 rounded-full overflow-hidden bg-slate-800 border-2 border-pink-500 flex items-center justify-center cursor-pointer relative group">
                    <img id="avatarPreview" src="" class="w-full h-full object-cover hidden">
                    <span id="avatarPlaceholder" class="text-xs text-slate-400 text-center px-1">เปลี่ยนรูป</span>
                </div>
            </div>
            <div class="space-y-3">
                <div>
                    <label class="text-[10px] text-slate-400">ชื่อแอคเคาท์ (Display Name)</label>
                    <input type="text" id="editDisplayName" class="w-full px-4 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs">
                </div>
                <div>
                    <label class="text-[10px] text-slate-400">ยูสเซอร์เนม (@username)</label>
                    <input type="text" id="editUsername" class="w-full px-4 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs">
                </div>
                <div>
                    <label class="text-[10px] text-slate-400">คำแนะนำ (Bio)</label>
                    <textarea id="editBio" rows="2" class="w-full px-4 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs"></textarea>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-3 pt-2">
                <button onclick="closeEditProfileModal()" class="bg-slate-800 py-3 rounded-2xl text-xs">ยกเลิก</button>
                <button onclick="saveProfile()" class="bg-pink-600 py-3 rounded-2xl text-xs font-bold">บันทึก</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc, updateDoc, setDoc, getDoc, arrayUnion, arrayRemove, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyCskpROK3OC55EXjDP-ywMiuaOen-fwr2Y", projectId: "v-link-5d0c8" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const email = localStorage.getItem('userEmail') || 'user@example.com';
        
        // Cloudinary Config
        const CLOUD_NAME = 'bnz9fyns';
        const UPLOAD_PRESET = 'V-link';

        let currentTab = 'feed';
        let selectedFile = null;
        let selectedAvatarFile = null;

        // โหลดข้อมูลโปรไฟล์เริ่มต้นหรือจาก LocalStorage
        let userProfile = {
            displayName: localStorage.getItem('slink_name') || email.split('@')[0],
            username: localStorage.getItem('slink_username') || email.split('@')[0],
            bio: localStorage.getItem('slink_bio') || 'ยินดีต้อนรับสู่โปรไฟล์ S-link ✨',
            avatarUrl: localStorage.getItem('slink_avatar') || ''
        };

        window.openPostModal = () => document.getElementById('postModal').classList.remove('hidden');
        window.closePostModal = () => {
            document.getElementById('postModal').classList.add('hidden');
            selectedFile = null;
            document.getElementById('imagePreview').src = '';
            document.getElementById('imagePreview').classList.add('hidden');
            document.getElementById('uploadPlaceholder').classList.remove('hidden');
            document.getElementById('postCaption').value = '';
        }

        window.previewImage = (e) => {
            selectedFile = e.target.files[0];
            if(selectedFile) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    document.getElementById('imagePreview').src = ev.target.result;
                    document.getElementById('imagePreview').classList.remove('hidden');
                    document.getElementById('uploadPlaceholder').classList.add('hidden');
                };
                reader.readAsDataURL(selectedFile);
            }
        }

        window.openEditProfileModal = () => {
            document.getElementById('editDisplayName').value = userProfile.displayName;
            document.getElementById('editUsername').value = userProfile.username;
            document.getElementById('editBio').value = userProfile.bio;
            if(userProfile.avatarUrl) {
                document.getElementById('avatarPreview').src = userProfile.avatarUrl;
                document.getElementById('avatarPreview').classList.remove('hidden');
                document.getElementById('avatarPlaceholder').classList.add('hidden');
            }
            document.getElementById('editProfileModal').classList.remove('hidden');
        }

        window.closeEditProfileModal = () => {
            document.getElementById('editProfileModal').classList.add('hidden');
            selectedAvatarFile = null;
        }

        window.previewAvatar = (e) => {
            selectedAvatarFile = e.target.files[0];
            if(selectedAvatarFile) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    document.getElementById('avatarPreview').src = ev.target.result;
                    document.getElementById('avatarPreview').classList.remove('hidden');
                    document.getElementById('avatarPlaceholder').classList.add('hidden');
                };
                reader.readAsDataURL(selectedAvatarFile);
            }
        }

        window.saveProfile = async () => {
            try {
                let avatarUrl = userProfile.avatarUrl;
                if(selectedAvatarFile) {
                    const formData = new FormData();
                    formData.append("file", selectedAvatarFile);
                    formData.append("upload_preset", UPLOAD_PRESET);
                    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method: "POST", body: formData });
                    const json = await res.json();
                    if(json.secure_url) avatarUrl = json.secure_url;
                }

                userProfile.displayName = document.getElementById('editDisplayName').value;
                userProfile.username = document.getElementById('editUsername').value;
                userProfile.bio = document.getElementById('editBio').value;
                userProfile.avatarUrl = avatarUrl;

                localStorage.setItem('slink_name', userProfile.displayName);
                localStorage.setItem('slink_username', userProfile.username);
                localStorage.setItem('slink_bio', userProfile.bio);
                localStorage.setItem('slink_avatar', userProfile.avatarUrl);

                // บันทึกโปรไฟล์ลง Firestore เพื่อให้คนอื่นค้นหาเจอ
                await setDoc(doc(db, "users", email), {
                    email: email,
                    displayName: userProfile.displayName,
                    username: userProfile.username,
                    bio: userProfile.bio,
                    avatarUrl: userProfile.avatarUrl
                }, { merge: true });

                closeEditProfileModal();
                loadProfile();
            } catch(e) {
                alert("บันทึกโปรไฟล์ไม่สำเร็จ: " + e.message);
            }
        }

        window.createPost = async () => {
            if(!selectedFile) return alert("โปรดเลือกรูปภาพ");
            const btn = document.getElementById('submitPostBtn');
            btn.disabled = true; btn.innerText = "กำลังอัปโหลด...";
            
            try {
                const formData = new FormData();
                formData.append("file", selectedFile);
                formData.append("upload_preset", UPLOAD_PRESET);
                
                const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method: "POST", body: formData });
                const result = await response.json();
                if(!result.secure_url) throw new Error("อัปโหลดรูปภาพไม่สำเร็จ");
                
                btn.innerText = "กำลังส่งข้อมูล...";
                await addDoc(collection(db, "posts"), {
                    author: userProfile.displayName,
                    username: userProfile.username,
                    email: email, 
                    imageUrl: result.secure_url,
                    caption: document.getElementById('postCaption').value,
                    likes: [], 
                    createdAt: serverTimestamp()
                });
                
                closePostModal();
                if(currentTab === 'feed') loadFeed();
            } catch(e) { 
                alert("การเชื่อมต่อมีปัญหา: " + e.message); 
            } finally { 
                btn.disabled = false; btn.innerText = "โพสต์"; 
            }
        }

        window.switchTab = (tab) => {
            currentTab = tab;
            ['Feed', 'Search', 'Messages', 'Profile'].forEach(t => {
                const el = document.getElementById('nav' + t);
                if(el) el.className = (t.toLowerCase() === tab) ? "text-pink-500 flex flex-col items-center text-[10px] font-bold" : "text-slate-500 flex flex-col items-center text-[10px]";
            });
            if(tab === 'feed') loadFeed();
            else if(tab === 'search') loadSearch();
            else if(tab === 'messages') loadMessages();
            else if(tab === 'profile') loadProfile();
        }

        window.deletePost = async (postId) => {
            if(confirm("คุณต้องการลบโพสต์นี้ใช่หรือไม่?")) {
                try {
                    await deleteDoc(doc(db, "posts", postId));
                    if(currentTab === 'profile') loadProfile();
                    else loadFeed();
                } catch(e) { alert("ไม่สามารถลบโพสต์ได้"); }
            }
        }

        window.toggleLike = async (postId) => {
            try {
                await updateDoc(doc(db, "posts", postId), { likes: arrayUnion(email) });
                loadFeed();
            } catch(e) { console.error(e); }
        }

        window.sharePost = (url) => {
            if (navigator.share) { navigator.share({ title: 'S-link Post', url: url }).catch(() => {}); }
            else { navigator.clipboard.writeText(url); alert("คัดลอกลิงก์แล้ว!"); }
        }

        // ระบบค้นหาและติดตาม
        window.searchUsers = async () => {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const resultsContainer =-document.getElementById('searchResults');
            // ทำระบบค้นหาจาก collection users
            try {
                const snap = await getDocs(collection(db, "users"));
                let html = '';
                snap.forEach(d => {
                    const u = d.data();
                    if(u.email !== email && (u.username.toLowerCase().includes(keyword) || u.displayName.toLowerCase().includes(keyword))) {
                        html += `
                        <div class="flex justify-between items-center bg-slate-900 border border-slate-800 p-3 rounded-2xl">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-full bg-slate-800 overflow-hidden flex items-center justify-center font-bold text-pink-400">
                                    ${u.avatarUrl ? `<img src="${u.avatarUrl}" class="w-full h-full object-cover">` : u.username.charAt(0).toUpperCase()}
                                </div>
                                <div>
                                    <p class="text-xs font-bold">${u.displayName}</p>
                                    <p class="text-[10px] text-slate-400">@${u.username}</p>
                                </div>
                            </div>
                            <button onclick="toggleFollow('${u.email}')" class="bg-pink-600 px-3 py-1.5 rounded-xl text-[10px] font-bold">ติดตาม</button>
                        </div>`;
                    }
                });
                document.getElementById('searchResultsList').innerHTML = html || `<p class="text-center text-slate-500 text-xs py-5">ไม่พบผู้ใช้งาน</p>`;
            } catch(e) { console.error(e); }
        }

        async function loadFeed() {
            const container = document.getElementById('feedContainer');
            container.innerHTML = `<p class="text-center text-slate-500 text-xs py-10">กำลังโหลดข้อมูล...</p>`;
            try {
                const snap = await getDocs(query(collection(db, "posts"), orderBy("createdAt", "desc")));
                let html = '';
                snap.forEach(d => {
                    const p = d.data();
                    const postId = d.id;
                    const likesCount = p.likes ? p.likes.length : 0;
                    const isOwner = p.email === email;
                    
                    html += `
                    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-4 space-y-3">
                        <div class="flex justify-between items-center">
                            <p class="text-xs font-bold text-slate-200">${p.author} <span class="text-[10px] text-slate-500 font-normal">(@${p.username || 'user'})</span></p>
                            ${isOwner ? `<button onclick="deletePost('${postId}')" class="text-slate-500 hover:text-red-500 text-xs transition">🗑️ ลบ</button>` : ''}
                        </div>
                        <div class="w-full bg-black flex items-center justify-center rounded-2xl overflow-hidden">
                            <img src="${p.imageUrl}" class="w-full h-auto max-h-[500px] object-contain block">
                        </div>
                        <p class="text-xs text-slate-300">${p.caption || ''}</p>
                        <div class="flex items-center gap-4 pt-2 border-t border-slate-800/80 text-xs text-slate-400">
                            <button onclick="toggleLike('${postId}')" class="flex items-center gap-1.5 hover:text-pink-500 transition">
                                <span>❤️</span> <span>${likesCount}</span>
                            </button>
                            <button onclick="alert('ฟีเจอร์คอมเมนต์กำลังมา')" class="flex items-center gap-1.5 hover:text-pink-500 transition">
                                <span>💬</span> <span>คอมเมนต์</span>
                            </button>
                            <button onclick="sharePost('${p.imageUrl}')" class="flex items-center gap-1.5 hover:text-pink-500 transition ml-auto">
                                <span>🔗</span> <span>แชร์</span>
                            </button>
                        </div>
                    </div>`;
                });
                container.innerHTML = html || `<p class="text-center text-slate-500 text-xs py-10">ยังไม่มีโพสต์ในขณะนี้</p>`;
            } catch (error) {
                container.innerHTML = `<p class="text-center text-red-500 text-xs py-10">ไม่สามารถโหลดฟีดได้</p>`;
            }
        }

        async function loadSearch() {
            const container = document.getElementById('feedContainer');
            container.innerHTML = `
            <div class="space-y-4">
                <input type="text" id="searchInput" oninput="searchUsers()" placeholder="ค้นหาชื่อ หรือ @username..." class="w-full px-4 py-3 bg-slate-900 border border-slate-800 rounded-2xl text-xs">
                <div id="searchResultsList" class="space-y-2">
                    <p class="text-center text-slate-500 text-xs py-10">พิมพ์เพื่อค้นหาเพื่อน...</p>
                </div>
            </div>`;
        }

        async function loadMessages() {
            const container = document.getElementById('feedContainer');
            container.innerHTML = `
            <div class="space-y-3">
                <h3 class="text-xs font-bold text-pink-400">ข้อความ (Direct Message)</h3>
                <p class="text-[11px] text-slate-400">คุณสามารถส่งข้อความหากันได้เฉพาะผู้ใช้ที่คุณติดตามและติดตามคุณกลับแล้วเท่านั้น (Mutual Follow)</p>
                <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl text-center space-y-2">
                    <p class="text-xs text-slate-500">ยังไม่มีห้องแชทที่เปิดใช้งาน</p>
                </div>
            </div>`;
        }

        async function loadProfile() {
            const container = document.getElementById('feedContainer');
            container.innerHTML = `<p class="text-center text-slate-500 text-xs py-10">กำลังโหลดโปรไฟล์...</p>`;
            try {
                const snap = await getDocs(query(collection(db, "posts"), orderBy("createdAt", "desc")));
                let userPosts = [];
                snap.forEach(d => {
                    const p = d.data();
                    if(p.email === email) userPosts.push({ id: d.id, ...p });
                });

                let html = `
                <div class="space-y-6 pt-2">
                    <div class="flex items-center gap-6 px-2">
                        <div class="w-20 h-20 bg-gradient-to-tr from-pink-500 to-purple-600 rounded-full p-[2px] flex-shrink-0">
                            <div class="w-full h-full bg-slate-900 rounded-full flex items-center justify-center overflow-hidden">
                                ${userProfile.avatarUrl ? `<img src="${userProfile.avatarUrl}" class="w-full h-full object-cover">` : `<span class="text-xl font-bold text-pink-400">${userProfile.username.charAt(0).toUpperCase()}</span>`}
                            </div>
                        </div>
                        <div class="flex justify-around flex-1 text-center">
                            <div><p class="text-sm font-bold">${userPosts.length}</p><p class="text-[11px] text-slate-400">โพสต์</p></div>
                            <div><p class="text-sm font-bold">0</p><p class="text-[11px] text-slate-400">ผู้ติดตาม</p></div>
                            <div><p class="text-sm font-bold">0</p><p class="text-[11px] text-slate-400">กำลังติดตาม</p></div>
                        </div>
                    </div>

                    <div class="px-2 space-y-1">
                        <p class="text-xs font-bold text-slate-100">${userProfile.displayName} <span class="font-normal text-slate-400">@${userProfile.username}</span></p>
                        <p class="text-[11px] text-slate-300">${userProfile.bio}</p>
                        <button onclick="openEditProfileModal()" class="w-full mt-3 bg-slate-800 hover:bg-slate-700 py-2 rounded-xl text-xs font-bold transition">แก้ไขโปรไฟล์</button>
                    </div>

                    <div class="border-t border-slate-800 pt-3">
                        <div class="flex justify-center text-pink-500 text-xs font-bold pb-2 border-b-2 border-pink-500 w-24 mx-auto">📷 โพสต์ทั้งหมด</div>
                    </div>

                    <div class="grid grid-cols-3 gap-1">
                `;

                if(userPosts.length === 0) {
                    html += `</div><p class="text-center text-slate-500 text-xs py-10 col-span-3">ยังไม่มีโพสต์ของคุณ</p>`;
                } else {
                    userPosts.forEach(p => {
                        html += `
                        <div class="aspect-square bg-slate-800 relative group overflow-hidden">
                            <img src="${p.imageUrl}" class="w-full h-full object-cover">
                            <button onclick="deletePost('${p.id}')" class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 flex items-center justify-center text-white text-xs transition font-bold">🗑️ ลบ</button>
                        </div>`;
                    });
                    html += `</div>`;
                }

                html += `</div>`;
                container.innerHTML = html;
            } catch (error) {
                container.innerHTML = `<p class="text-center text-red-500 text-xs py-10">ไม่สามารถโหลดโปรไฟล์ได้</p>`;
            }
        }

        loadFeed();
    </script>
</body>
</html>
