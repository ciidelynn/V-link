<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S-link - Mini Social Network</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- นำเข้า Supabase JS SDK -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
        
        const SUPABASE_URL = 'https://pjapezytmawescgcbyxd.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_bAQw8ZRxU7djRR3w11vsfQ__ig0uUuX';
        
        window.supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
    </script>
    <style> body { font-family: 'Prompt', sans-serif; } </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex justify-center items-center p-0">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 shadow-2xl overflow-hidden flex flex-col h-screen relative">
        
        <!-- Header -->
        <div class="flex justify-between items-center px-6 py-4 border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-20">
            <button onclick="window.history.back()" class="text-slate-400 text-xs">← ย้อนกลับ</button>
            <h1 class="text-base font-bold text-pink-500">S-link</h1>
            <button onclick="openPostModal()" class="bg-pink-600 text-white p-2 rounded-full text-xs shadow-lg shadow-pink-900/40">เพิ่มโพสต์</button>
        </div>

        <!-- Main Content Container -->
        <div id="feedContainer" class="flex-1 overflow-y-auto space-y-4 p-4 pb-20">
            <p class="text-center text-slate-500 text-xs py-10">กำลังโหลดข้อมูล...</p>
        </div>

        <!-- Bottom Nav -->
        <div class="absolute bottom-0 left-0 right-0 bg-slate-950/95 border-t border-slate-800 p-3 flex justify-around z-20">
            <button onclick="switchTab('feed')" id="navFeed" class="text-slate-500 flex flex-col items-center text-[10px]">🏠 หน้าแรก</button>
            <button onclick="switchTab('search')" id="navSearch" class="text-slate-500 flex flex-col items-center text-[10px]">🔍 ค้นหา</button>
            <button onclick="switchTab('messages')" id="navMessages" class="text-slate-500 flex flex-col items-center text-[10px]">💬 ข้อความ</button>
            <button onclick="switchTab('profile')" id="navProfile" class="text-slate-500 flex flex-col items-center text-[10px]">👤 โปรไฟล์</button>
        </div>
    </div>

    <!-- Post Modal -->
    <div id="postModal" class="fixed inset-0 bg-black/90 hidden flex justify-center items-center p-4 z-50">
        <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-4">
            <h3 class="text-sm font-bold text-pink-400">สร้างโพสต์</h3>
            <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="previewImage(event)">
            <button onclick="document.getElementById('fileInput').click()" class="w-full h-40 border-2 border-dashed border-slate-700 rounded-2xl flex items-center justify-center overflow-hidden relative">
                <img id="imagePreview" src="" class="hidden w-full h-full object-cover">
                <span id="uploadPlaceholder" class="text-xs text-slate-500">เลือกรูปภาพจากมือถือ</span>
            </button>
            <textarea id="postCaption" rows="2" placeholder="แคปชัน..." class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-2xl text-xs"></textarea>
            <div class="grid grid-cols-2 gap-3">
                <button onclick="closePostModal()" class="bg-slate-800 py-3 rounded-2xl text-xs">ยกเลิก</button>
                <button onclick="createPost()" id="submitPostBtn" class="bg-pink-600 py-3 rounded-2xl text-xs font-bold">โพสต์</button>
            </div>
        </div>
    </div>

    <!-- Edit Profile Modal -->
    <div id="editProfileModal" class="fixed inset-0 bg-black/90 hidden flex justify-center items-center p-4 z-50">
        <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-4">
            <h3 class="text-sm font-bold text-pink-400">แก้ไขโปรไฟล์</h3>
            <div class="flex flex-col items-center space-y-2">
                <input type="file" id="avatarInput" accept="image/*" class="hidden" onchange="previewAvatar(event)">
                <div onclick="document.getElementById('avatarInput').click()" class="w-20 h-20 rounded-full overflow-hidden bg-slate-800 border-2 border-pink-500 flex items-center justify-center cursor-pointer relative">
                    <img id="avatarPreview" src="" class="w-full h-full object-cover hidden">
                    <span id="avatarPlaceholder" class="text-xs text-slate-400 text-center px-1">เปลี่ยนรูป</span>
                </div>
            </div>
            <div class="space-y-3">
                <div>
                    <label class="text-[10px] text-slate-400">ชื่อแอคเคาท์ (Display Name)</label>
                    <input type="text" id="editDisplayName" class="w-full px-4 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs">
                </div>
                <div>
                    <label class="text-[10px] text-slate-400">ยูสเซอร์เนม (@username)</label>
                    <input type="text" id="editUsername" class="w-full px-4 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs">
                </div>
                <div>
                    <label class="text-[10px] text-slate-400">คำแนะนำ (Bio)</label>
                    <textarea id="editBio" rows="2" class="w-full px-4 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs"></textarea>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-3 pt-2">
                <button onclick="closeEditProfileModal()" class="bg-slate-800 py-3 rounded-2xl text-xs">ยกเลิก</button>
                <button onclick="saveProfile()" class="bg-pink-600 py-3 rounded-2xl text-xs font-bold">บันทึก</button>
            </div>
        </div>
    </div>

    <!-- Detail / Comment Modal -->
    <div id="detailModal" class="fixed inset-0 bg-black/90 hidden flex justify-center items-center p-4 z-50">
        <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl max-h-[85vh] flex flex-col overflow-hidden">
            <div class="flex justify-between items-center px-4 py-3 border-b border-slate-800">
                <span class="text-xs font-bold text-pink-400">รายละเอียดโพสต์</span>
                <button onclick="closeDetailModal()" class="text-slate-400 text-xs">✕ ปิด</button>
            </div>
            <div id="detailContent" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
        </div>
    </div>

    <!-- User Profile Full Screen Modal -->
    <div id="userProfileModal" class="fixed inset-0 bg-slate-950 hidden flex flex-col z-50 overflow-y-auto">
        <div class="flex items-center justify-between px-6 py-4 border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-20">
            <button onclick="closeUserProfileModal()" class="text-slate-400 text-xs">← ย้อนกลับ</button>
            <span id="userProfileHeaderTitle" class="text-xs font-bold text-pink-400">โปรไฟล์</span>
            <div class="w-8"></div>
        </div>
        <div id="userProfileContent" class="flex-1 p-4 space-y-4 max-w-md w-full mx-auto pb-20"></div>
    </div>

    <!-- User List Modal -->
    <div id="userListModal" class="fixed inset-0 bg-black/90 hidden flex justify-center items-center p-4 z-50">
        <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl max-h-[85vh] flex flex-col overflow-hidden">
            <div class="flex justify-between items-center px-4 py-3 border-b border-slate-800">
                <span id="userListTitle" class="text-xs font-bold text-pink-400">รายชื่อ</span>
                <button onclick="closeUserListModal()" class="text-slate-400 text-xs">✕ ปิด</button>
            </div>
            <div id="userListContent" class="flex-1 overflow-y-auto p-4 space-y-2"></div>
        </div>
    </div>

    <!-- Chat Modal -->
    <div id="chatModal" class="fixed inset-0 bg-slate-950 hidden flex flex-col z-50">
        <div class="flex items-center justify-between px-4 py-3 border-b border-slate-800 bg-slate-900/90 backdrop-blur">
            <div class="flex items-center gap-3">
                <button onclick="closeChat()" class="text-slate-400 text-xs">← กลับ</button>
                <span id="chatTargetName" class="text-xs font-bold text-pink-400">แชท</span>
            </div>
        </div>
        <div id="chatMessages" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
        <div class="p-3 bg-slate-900 border-t border-slate-800 flex gap-2">
            <input type="text" id="chatInput" onkeydown="if(event.key === 'Enter') sendMessage()" placeholder="พิมพ์ข้อความ..." class="flex-1 px-4 py-3 bg-slate-950 border border-slate-800 rounded-2xl text-xs text-white">
            <button onclick="sendMessage()" class="bg-pink-600 px-5 py-3 rounded-2xl text-xs font-bold shadow-lg shadow-pink-900/40">ส่ง</button>
        </div>
    </div>

    <!-- Custom Confirm Delete Bubble Modal -->
    <div id="confirmModal" class="fixed inset-0 bg-black/80 hidden flex justify-center items-center p-4 z-50 backdrop-blur-sm">
        <div class="w-full max-w-xs bg-slate-900 border border-pink-500/40 rounded-3xl p-6 text-center space-y-4 shadow-2xl shadow-pink-950/50">
            <div class="w-12 h-12 bg-pink-500/10 text-pink-500 rounded-full flex items-center justify-center mx-auto text-xl">
                🗑️
            </div>
            <div class="space-y-1">
                <h3 class="text-sm font-bold text-pink-400">ลบโพสต์นี้</h3>
                <p id="confirmModalText" class="text-xs text-slate-400">คุณแน่ใจใช่ไหมที่จะลบโพสต์นี้?</p>
            </div>
            <div class="grid grid-cols-2 gap-2 pt-2">
                <button id="confirmCancelBtn" class="bg-slate-800 hover:bg-slate-700 py-2.5 rounded-2.5 text-xs transition">ยกเลิก</button>
                <button id="confirmOkBtn" class="bg-pink-600 hover:bg-pink-500 py-2.5 rounded-2.5 text-xs font-bold shadow-lg shadow-pink-900/40 transition">ลบเลย</button>
            </div>
        </div>
    </div>

    <script type="module">
        const email = localStorage.getItem('userEmail');
        if (!email) {
            alert("กรุณาเข้าสู่ระบบก่อนใช้งาน");
            window.location.href = 'index.html';
        }

        const CLOUD_NAME = 'bnz9fyns';
        const UPLOAD_PRESET = 'V-link';

        let currentTab = localStorage.getItem('slink_current_tab') || 'feed';
        let selectedFile = null;
        let selectedAvatarFile = null;
        let activeChatUser = null;
        let chatSubscription = null;
        let activeIntervals = [];

        let userProfile = {
            displayName: localStorage.getItem('slink_name') || email.split('@')[0],
            username: localStorage.getItem('slink_username') || email.split('@')[0],
            bio: localStorage.getItem('slink_bio') !== null ? localStorage.getItem('slink_bio') : 'ยินดีต้อนรับสู่โปรไฟล์ S-link ✨',
            avatarUrl: localStorage.getItem('slink_avatar') || ''
        };

        const fakeNames = [
            'lucas_dev', 'emma_99', 'oliver_m', 'sophia.k', 'liam_j', 
            'charlotte_x', 'noah_style', 'ava_rose', 'ethan_w', 'mia_v',
            'alex_23', 'hannah_B', 'leo_nardo', 'chloe_art', 'ryan_99'
        ];

        const fakeCommentsPool = [
            "Amazing shot! 🔥", "So cool!", "Love this vibe so much ✨", "Gorgeous!", 
            "10/10 composition!", "Looking great!", "Wow stunning!", "So aesthetic 💖", "Impressive!",
            "สวยมากครับ รูปดีสุดๆ 😍", "เท่ระเบิดเลยคุนน้า 😎", "มุมนี้คือที่สุด! 👏", 
            "Nice pic! ชอบโทนสีนี้จัง", "สุดยอดไปเลยครับพี่ชาย 🔥", "ดีต่อใจมากๆ 💖",
            "This is art! 🎨", "Keep it up! 🚀", "ลงรูปบ่อยๆ นะครับ รอติดตามอยู่!",
            "เก่งมากกก ยกนิ้วให้เลย 👍", "Perfect timing! 📸", "ละมุนมากกกก ✨"
        ];

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function formatNumber(num) {
            if (num < 1000) {
                return num.toString();
            } else if (num >= 1000 && num < 10000) {
                return num.toLocaleString('en-US');
            } else if (num >= 10000 && num < 1000000) {
                const formatted = (num / 1000).toFixed(1);
                return (formatted.endsWith('.0') ? Math.floor(num / 1000) : formatted) + 'K';
            } else if (num >= 1000000 && num < 1000000000) {
                const formatted = (num / 1000000).toFixed(1);
                return (formatted.endsWith('.0') ? Math.floor(num / 1000000) : formatted) + 'M';
            } else {
                const formatted = (num / 1000000000).toFixed(1);
                return (formatted.endsWith('.0') ? Math.floor(num / 1000000000) : formatted) + 'B';
            }
        }

        function clearAllIntervals() {
            activeIntervals.forEach(id => clearInterval(id));
            activeIntervals = [];
        }

        async function initUserProfile() {
            try {
                const { data, error } = await window.supabase
                    .from('users')
                    .select('*')
                    .eq('email', email)
                    .single();

                if (data) {
                    userProfile.displayName = data.displayName || userProfile.displayName;
                    userProfile.username = data.username || userProfile.username;
                    userProfile.bio = data.bio || userProfile.bio;
                    userProfile.avatarUrl = data.avatarUrl || userProfile.avatarUrl;
                }
            } catch (e) {
                console.error("Error loading profile:", e);
            }
        }

        function showConfirmModal(message, onConfirm) {
            const modal = document.getElementById('confirmModal');
            const textEl = document.getElementById('confirmModalText');
            const okBtn = document.getElementById('confirmOkBtn');
            const cancelBtn = document.getElementById('confirmCancelBtn');

            textEl.innerText = message;
            modal.classList.remove('hidden');

            const newOkBtn = okBtn.cloneNode(true);
            const newCancelBtn = cancelBtn.cloneNode(true);
            okBtn.parentNode.replaceChild(newOkBtn, okBtn);
            cancelBtn.parentNode.replaceChild(newCancelBtn, cancelBtn);

            newOkBtn.addEventListener('click', () => {
                modal.classList.add('hidden');
                onConfirm();
            });
            newCancelBtn.addEventListener('click', () => {
                modal.classList.add('hidden');
            });
        }

        window.openPostModal = () => document.getElementById('postModal').classList.remove('hidden');
        window.closePostModal = () => {
            document.getElementById('postModal').classList.add('hidden');
            selectedFile = null;
            document.getElementById('imagePreview').src = '';
            document.getElementById('imagePreview').classList.add('hidden');
            document.getElementById('uploadPlaceholder').classList.remove('hidden');
            document.getElementById('postCaption').value = '';
        }

        window.previewImage = (e) => {
            selectedFile = e.target.files[0];
            if(selectedFile) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    document.getElementById('imagePreview').src = ev.target.result;
                    document.getElementById('imagePreview').classList.remove('hidden');
                    document.getElementById('uploadPlaceholder').classList.add('hidden');
                };
                reader.readAsDataURL(selectedFile);
            }
        }

        window.openEditProfileModal = () => {
            document.getElementById('editDisplayName').value = userProfile.displayName;
            document.getElementById('editUsername').value = userProfile.username;
            document.getElementById('editBio').value = userProfile.bio;
            if(userProfile.avatarUrl) {
                document.getElementById('avatarPreview').src = userProfile.avatarUrl;
                document.getElementById('avatarPreview').classList.remove('hidden');
                document.getElementById('avatarPlaceholder').classList.add('hidden');
            }
            document.getElementById('editProfileModal').classList.remove('hidden');
        }

        window.closeEditProfileModal = () => document.getElementById('editProfileModal').classList.add('hidden');

        window.previewAvatar = (e) => {
            selectedAvatarFile = e.target.files[0];
            if(selectedAvatarFile) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    document.getElementById('avatarPreview').src = ev.target.result;
                    document.getElementById('avatarPreview').classList.remove('hidden');
                    document.getElementById('avatarPlaceholder').classList.add('hidden');
                };
                reader.readAsDataURL(selectedAvatarFile);
            }
        }

        window.saveProfile = async () => {
            try {
                let avatarUrl = userProfile.avatarUrl;
                if(selectedAvatarFile) {
                    const formData = new FormData();
                    formData.append("file", selectedAvatarFile);
                    formData.append("upload_preset", UPLOAD_PRESET);
                    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method: "POST", body: formData });
                    const json = await res.json();
                    if(json.secure_url) avatarUrl = json.secure_url;
                }

                userProfile.displayName = document.getElementById('editDisplayName').value;
                userProfile.username = document.getElementById('editUsername').value;
                userProfile.bio = document.getElementById('editBio').value;
                userProfile.avatarUrl = avatarUrl;

                localStorage.setItem('slink_name', userProfile.displayName);
                localStorage.setItem('slink_username', userProfile.username);
                localStorage.setItem('slink_bio', userProfile.bio);
                localStorage.setItem('slink_avatar', userProfile.avatarUrl);

                const { error } = await window.supabase.from('users').update({
                    displayName: userProfile.displayName,
                    username: userProfile.username,
                    bio: userProfile.bio,
                    avatarUrl: userProfile.avatarUrl
                }).eq('email', email);

                if (error) throw error;

                closeEditProfileModal();
                loadProfile();
            } catch(e) { alert("บันทึกโปรไฟล์ไม่สำเร็จ: " + e.message); }
        }

        window.createPost = async () => {
            if(!selectedFile) return alert("โปรดเลือกรูปภาพ");
            const btn = document.getElementById('submitPostBtn');
            btn.disabled = true; btn.innerText = "กำลังอัปโหลด...";
            
            try {
                const formData = new FormData();
                formData.append("file", selectedFile);
                formData.append("upload_preset", UPLOAD_PRESET);
                
                const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method: "POST", body: formData });
                const result = await response.json();
                if(!result.secure_url) throw new Error("อัปโหลดรูปภาพไม่สำเร็จ");
                
                btn.innerText = "กำลังสร้างโพสต์...";

                const { data: meData } = await window.supabase.from('users').select('followers').eq('email', email).single();
                const followersCount = meData && meData.followers ? meData.followers.length : 10;
                
                const targetLikesCount = Math.max(1, Math.floor(followersCount * (getRandomInt(60, 90) / 100)));
                const targetSharesCount = Math.max(0, Math.floor(followersCount * (getRandomInt(2, 5) / 100)));
                const targetCommsCount = Math.max(1, Math.floor(followersCount * (getRandomInt(10, 20) / 100)));

                let simulatedLikes = [];
                let simulatedComments = [];
                let initialShares = "0";

                const { error: postErr } = await window.supabase.from('posts').insert([{
                    author: userProfile.displayName,
                    username: userProfile.username,
                    email: email, 
                    imageUrl: result.secure_url,
                    caption: document.getElementById('postCaption').value || "",
                    likes: simulatedLikes, 
                    shares: initialShares,
                    comments: simulatedComments,
                    target_likes: targetLikesCount,
                    target_shares: targetSharesCount,
                    target_comms: targetCommsCount
                }]);

                if (postErr) throw postErr;
                
                closePostModal();
                if(currentTab === 'feed') loadFeed();
                else if(currentTab === 'profile') loadProfile();
            } catch(e) { 
                alert("การเชื่อมต่อมีปัญหา: " + e.message); 
            } finally { 
                btn.disabled = false; btn.innerText = "โพสต์"; 
            }
        }

        window.switchTab = (tab) => {
            clearAllIntervals();
            currentTab = tab;
            localStorage.setItem('slink_current_tab', tab);

            ['Feed', 'Search', 'Messages', 'Profile'].forEach(t => {
                const el = document.getElementById('nav' + t);
                if(el) el.className = (t.toLowerCase() === tab) ? "text-pink-500 flex flex-col items-center text-[10px] font-bold" : "text-slate-500 flex flex-col items-center text-[10px]";
            });

            if(tab === 'feed') loadFeed();
            else if(tab === 'search') loadSearch();
            else if(tab === 'messages') loadMessages();
            else if(tab === 'profile') loadProfile();
        }

        window.deletePost = (postId) => {
            showConfirmModal("คุณแน่ใจใช่ไหมที่จะลบโพสต์นี้?", async () => {
                try {
                    await window.supabase.from('posts').delete().eq('id', postId);
                    closeDetailModal();
                    if(currentTab === 'profile') loadProfile();
                    else if(currentTab === 'feed') loadFeed();
                } catch(e) { alert("ไม่สามารถลบโพสต์ได้"); }
            });
        }

        window.toggleLike = async (postId) => {
            try {
                const { data: post, error } = await window.supabase.from('posts').select('likes').eq('id', postId).single();
                if (error) throw error;

                let likes = post.likes || [];
                if(likes.includes(email)) {
                    likes = likes.filter(e => e !== email);
                } else {
                    likes.push(email);
                }

                await window.supabase.from('posts').update({ likes }).eq('id', postId);
            } catch(e) { console.error(e); }
        }

        window.sharePost = async (postId, url) => {
            try {
                const { data: post } = await window.supabase.from('posts').select('shares').eq('id', postId).single();
                if (post) {
                    const currentShares = parseInt(post.shares || "0");
                    await window.supabase.from('posts').update({ shares: String(currentShares + 1) }).eq('id', postId);
                    
                    if (currentTab === 'feed') loadFeed();
                    else if (currentTab === 'profile') loadProfile();
                }
            } catch(e) {}
            if (navigator.share) { navigator.share({ title: 'S-link Post', url: url }).catch(() => {}); }
            else { navigator.clipboard.writeText(url); alert("คัดลอกลิงก์แล้ว!"); }
        }

        window.toggleFollow = async (targetEmail, callback) => {
            try {
                const { data: me } = await window.supabase.from('users').select('following').eq('email', email).single();
                const { data: target } = await window.supabase.from('users').select('followers').eq('email', targetEmail).single();

                let myFollowing = me.following || [];
                let targetFollowers = target.followers || [];

                if(myFollowing.includes(targetEmail)) {
                    myFollowing = myFollowing.filter(e => e !== targetEmail);
                    targetFollowers = targetFollowers.filter(e => e !== email);
                } else {
                    myFollowing.push(targetEmail);
                    targetFollowers.push(email);
                }

                await window.supabase.from('users').update({ following: myFollowing }).eq('email', email);
                await window.supabase.from('users').update({ followers: targetFollowers }).eq('email', targetEmail);

                if(callback) callback();
            } catch(e) { console.error(e); }

        async function attachLiveEngagement(postId, postEmail) {
            try {
                const { data: postData } = await window.supabase.from('posts').select('*').eq('id', postId).single();
                if(!postData) return;

                const { data: authorData } = await window.supabase.from('users').select('followers').eq('email', postEmail).single();
                const followersCount = authorData && authorData.followers ? authorData.followers.length : 10;

                const maxLikes = postData.target_likes || Math.max(1, Math.floor(followersCount * (getRandomInt(60, 90) / 100)));
                const maxShares = postData.target_shares || Math.max(0, Math.floor(followersCount * (getRandomInt(2, 5) / 100)));
                const maxComms = postData.target_comms || Math.max(1, Math.floor(followersCount * (getRandomInt(10, 20) / 100)));

                let availableNames = [...fakeNames].sort(() => Math.random() - 0.5);
                let availableComments = [...fakeCommentsPool].sort(() => Math.random() - 0.5);

                const initialDelay = setTimeout(() => {
                    const intervalId = setInterval(async () => {
                        const { data: currentPost } = await window.supabase.from('posts').select('likes, comments, shares').eq('id', postId).single();
                        if(!currentPost) return;

                        let likes = currentPost.likes || [];
                        let comments = currentPost.comments || [];
                        let shares = parseInt(currentPost.shares || "0");

                        if(likes.length >= maxLikes && comments.length >= maxComms && shares >= maxShares) {
                            clearInterval(intervalId);
                            return;
                        }

                        const actionType = getRandomInt(1, 3);
                        let updated = false;

                        if(actionType === 1 && likes.length < maxLikes) {
                            const fakeLikeUser = `live_fan_${getRandomInt(1, 5000)}@slink.local`;
                            if(!likes.includes(fakeLikeUser)) {
                                likes.push(fakeLikeUser);
                                updated = true;
                            }
                        } else if(actionType === 2 && comments.length < maxComms) {
                            if (availableNames.length === 0) availableNames = [...fakeNames].sort(() => Math.random() - 0.5);
                            if (availableComments.length === 0) availableComments = [...fakeCommentsPool].sort(() => Math.random() - 0.5);

                            const randomName = availableNames.pop();
                            const randomText = availableComments.pop();

                            const lastCommentAuthor = comments.length > 0 ? comments[comments.length - 1].author : "";
                            if (randomName === lastCommentAuthor && availableNames.length > 0) {
                                availableNames.unshift(randomName);
                                const alternateName = availableNames.pop();
                                comments.push({
                                    author: alternateName,
                                    text: randomText,
                                    created_at: new Date().toISOString()
                                });
                            } else {
                                comments.push({
                                    author: randomName,
                                    text: randomText,
                                    created_at: new Date().toISOString()
                                });
                            }
                            updated = true;
                        } else if(actionType === 3 && shares < maxShares) {
                            shares += 1;
                            updated = true;
                        }

                        if(updated) {
                            await window.supabase.from('posts').update({
                                likes: likes,
                                comments: comments,
                                shares: String(shares)
                            }).eq('id', postId);

                            const likeEl = document.getElementById(`likesCount_${postId}`);
                            const commEl = document.getElementById(`commCount_${postId}`);
                            const shareEl = document.getElementById(`shareCount_${postId}`);
                            const commListEl = document.getElementById(`commentList_${postId}`) || document.getElementById(`profileCommentList_${postId}`);

                            if(likeEl) likeEl.innerText = likes.length;
                            if(commEl) commEl.innerText = comments.length;
                            if(shareEl) shareEl.innerText = shares;

                            if(commListEl && comments.length > 0) {
                                let lastComm = comments[comments.length - 1];
                                const emptyPlaceholder = commListEl.querySelector('.text-slate-500');
                                if (emptyPlaceholder) emptyPlaceholder.remove();

                                const newDiv = document.createElement('div');
                                newDiv.className = "bg-slate-950 p-2 rounded-xl text-[11px] animate-pulse";
                                newDiv.innerHTML = `<span class="font-bold text-pink-400">@${lastComm.author}</span> <span class="text-slate-300">${lastComm.text}</span>`;
                                commListEl.appendChild(newDiv);
                                commListEl.scrollTop = commListEl.scrollHeight;
                            }
                        }
                    }, 1400);

                    activeIntervals.push(intervalId);
                }, 2500);

                activeIntervals.push(initialDelay);
            } catch(e) { console.error(e); }
        }

                if(commentsList.length > 0) {
                    commentsList.forEach(com => {
                        commentsHtml += `<div class="bg-slate-950 p-2 rounded-xl text-[11px]"><span class="font-bold text-pink-400">@${com.author}</span> <span class="text-slate-300">${com.text}</span></div>`;
                    });
                }

                container.innerHTML = `
                <div class="space-y-3">
                    <div class="flex justify-between items-center">
                        <p class="text-xs font-bold">${p.author}</p>
                        ${isOwner ? `<button onclick="deletePost('${postId}')" class="text-red-500 text-xs">🗑️ ลบโพสต์</button>` : ''}
                    </div>
                    <div class="w-full flex items-center justify-center rounded-2xl overflow-hidden">
                        <img src="${p.imageUrl}" class="w-full h-auto rounded-2xl block">
                    </div>
                    <p class="text-xs text-slate-300">${p.caption || ''}</p>
                    
                    <div class="flex items-center gap-4 pt-2 border-t border-slate-800 text-xs text-slate-400">
                        <button onclick="toggleLike('${postId}');" class="flex items-center gap-1 hover:text-pink-500 transition">
                            <span>${isLiked ? '❤️' : '🤍'}</span> <span id="modalLikesCount_${postId}">${likesCount}</span>
                        </button>
                        <div class="flex items-center gap-1">
                            <span>💬</span> <span id="modalCommCount_${postId}">${commentsCount}</span>
                        </div>
                        <button onclick="sharePost('${postId}', '${p.imageUrl}')" class="flex items-center gap-1 hover:text-pink-500 transition ml-auto">
                            <span>🔗</span> <span id="modalShareCount_${postId}">${sharesCount}</span>
                        </button>
                    </div>

                    <div class="space-y-2 pt-2 border-t border-slate-800">
                        <p class="text-xs font-bold text-pink-400">ความคิดเห็น</p>
                        <div id="modalCommentList_${postId}" class="space-y-1.5 max-h-40 overflow-y-auto">${commentsHtml || '<p class="text-[10px] text-slate-500">ยังไม่มีความคิดเห็น</p>'}</div>
                        <div class="flex gap-2 pt-1">
                            <input type="text" id="modalCommentInput_${postId}" placeholder="พิมพ์คอมเมนต์..." class="flex-1 px-3 py-1.5 bg-slate-950 border border-slate-800 rounded-xl text-xs">
                            <button onclick="addModalComment('${postId}')" class="bg-pink-600 px-3 py-1.5 rounded-xl text-xs font-bold">ส่ง</button>
                        </div>
                    </div>
                </div>`;
            } catch (e) {
                container.innerHTML = `<p class="text-center text-xs text-red-500 py-5">เกิดข้อผิดพลาดในการโหลดข้อมูล</p>`;
            }
        }

        window.addModalComment = async (postId) => {
            const input = document.getElementById(`modalCommentInput_${postId}`);
            const text = input.value.trim();
            if(!text) return;
            try {
                const { data: post } = await window.supabase.from('posts').select('comments').eq('id', postId).single();
                let comments = post.comments || [];
                comments.push({
                    author: userProfile.username,
                    text: text,
                    created_at: new Date().toISOString()
                });
                await window.supabase.from('posts').update({ comments }).eq('id', postId);
                input.value = '';
                openPostDetail(postId);
            } catch(e) { console.error(e); }
        }

        window.closeDetailModal = () => document.getElementById('detailModal').classList.add('hidden');

        window.openChat = async (targetEmail, targetName) => {
            activeChatUser = targetEmail;
            document.getElementById('chatTargetName').innerText = targetName;
            document.getElementById('chatModal').classList.remove('hidden');

            const chatId = [email, targetEmail].sort().join('_');
            const chatContainer = document.getElementById('chatMessages');
            chatContainer.innerHTML = `<p class="text-center text-slate-500 text-xs py-10">กำลังโหลดข้อความ...</p>`;

            if (chatSubscription) chatSubscription.unsubscribe();

            const fetchMessages = async () => {
                const { data: messages } = await window.supabase.from('messages').select('*').eq('chat_id', chatId).order('created_at', { ascending: true });
                let html = '';
                if(messages) {
                    messages.forEach(m => {
                        const isMe = m.sender === email;
                        html += `
                        <div class="flex ${isMe ? 'justify-end' : 'justify-start'}">
                            <div class="max-w-[75%] px-4 py-2.5 rounded-2xl text-xs leading-relaxed ${isMe ? 'bg-pink-600 text-white rounded-br-none' : 'bg-slate-900 border border-slate-800 text-slate-200 rounded-bl-none'}">
                                ${m.text}
                            </div>
                        </div>`;
                    });
                }
                chatContainer.innerHTML = html || `<p class="text-center text-slate-500 text-xs py-10">ยังไม่มีข้อความ เริ่มทักทายกันเลย!</p>`;
                chatContainer.scrollTop = chatContainer.scrollHeight;
            };

            await fetchMessages();

            chatSubscription = window.supabase
                .channel(`public:messages:${chatId}`)
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `chat_id=eq.${chatId}` }, () => {
                    fetchMessages();
                })
                .subscribe();
        }

        window.closeChat = () => {
            document.getElementById('chatModal').classList.add('hidden');
            if(chatSubscription) {
                chatSubscription.unsubscribe();
                chatSubscription = null;
            }
            loadMessages();
        }

        window.sendMessage = async () => {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if(!text || !activeChatUser) return;
            
            try {
                const chatId = [email, activeChatUser].sort().join('_');
                input.value = ''; 
                await window.supabase.from('messages').insert([{
                    chat_id: chatId,
                    sender: email,
                    text: text
                }]);
            } catch(e) { 
                console.error(e);
                alert("ส่งข้อความไม่สำเร็จ กรุณาลองใหม่อีกครั้ง");
            }
        }

        async function loadFeed() {
            clearAllIntervals();
            const container = document.getElementById('feedContainer');
            container.innerHTML = `<p class="text-center text-slate-500 text-xs py-10">กำลังโหลดข้อมูลฟีด...</p>`;
            
            try {
                const { data: mySnap } = await window.supabase.from('users').select('following').eq('email', email).single();
                const followingList = mySnap ? (mySnap.following || []) : [];
                const allowedAuthors = [email, ...followingList];

                const { data: posts, error } = await window.supabase.from('posts').select('*').order('created_at', { ascending: false });
                if (error) throw error;

                let html = '';
                if(posts) {
                    for(let p of posts) {
                        if(!allowedAuthors.includes(p.email)) continue;

                        const postId = p.id;
                        const likesCount = p.likes ? p.likes.length : 0;
                        const sharesCount = parseInt(p.shares || "0");
                        const isLiked = p.likes && p.likes.includes(email);
                        const isOwner = p.email === email;

                        const commentsList = p.comments || [];
                        const commentsCount = commentsList.length;
                        
                        html += `
                        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-4 space-y-3">
                            <div class="flex justify-between items-center">
                                <p class="text-xs font-bold text-slate-200">${p.author}</p>
                                ${isOwner ? `<button onclick="deletePost('${postId}')" class="text-slate-500 hover:text-red-500 text-xs transition">🗑️ ลบ</button>` : ''}
                            </div>
                            <div class="w-full flex items-center justify-center rounded-2xl overflow-hidden cursor-pointer" onclick="openPostDetail('${postId}')">
                                <img src="${p.imageUrl}" class="w-full h-auto rounded-2xl block">
                            </div>
                            <p class="text-xs text-slate-300">${p.caption || ''}</p>
                            
                            <div class="flex items-center gap-4 pt-2 border-t border-slate-800/80 text-xs text-slate-400">
                                <button onclick="toggleLike('${postId}')" class="flex items-center gap-1 hover:text-pink-500 transition">
                                    <span>${isLiked ? '❤️' : '🤍'}</span> <span id="likesCount_${postId}">${likesCount}</span>
                                </button>
                                <button onclick="toggleCommentBox('${postId}')" class="flex items-center gap-1 hover:text-pink-500 transition">
                                    <span>💬</span> <span id="commCount_${postId}">${commentsCount}</span>
                                </button>
                                <button onclick="sharePost('${postId}', '${p.imageUrl}')" class="flex items-center gap-1 hover:text-pink-500 transition ml-auto">
                                    <span>🔗</span> <span id="shareCount_${postId}">${sharesCount}</span>
                                </button>
                            </div>

                            <div id="commentBox_${postId}" class="hidden space-y-2 pt-2 border-t border-slate-800">
                                <div id="commentList_${postId}" class="space-y-1.5 max-h-32 overflow-y-auto">`;
                                if(commentsList.length > 0) {
                                    commentsList.forEach(com => {
                                        html += `<div class="bg-slate-950 p-2 rounded-xl text-[11px]"><span class="font-bold text-pink-400">@${com.author}</span> <span class="text-slate-300">${com.text}</span></div>`;
                                    });
                                } else {
                                    html += `<p class="text-[10px] text-slate-500">ยังไม่มีความคิดเห็น</p>`;
                                }
                        html += `</div>
                                <div class="flex gap-2">
                                    <input type="text" id="inlineCommentInput_${postId}" placeholder="พิมพ์คอมเมนต์..." class="flex-1 px-3 py-1.5 bg-slate-950 border border-slate-800 rounded-xl text-xs">
                                    <button onclick="addInlineComment('${postId}')" class="bg-pink-600 px-3 py-1.5 rounded-xl text-xs font-bold">ส่ง</button>
                                </div>
                            </div>
                        </div>`;

                        attachLiveEngagement(postId, p.email);
                    }
                }
                container.innerHTML = html || `<p class="text-center text-slate-500 text-xs py-10">ยังไม่มีโพสต์ของคุณหรือคนที่คุณติดตาม</p>`;
            } catch (error) {
                container.innerHTML = `<p class="text-center text-red-500 text-xs py-10">ไม่สามารถโหลดฟีดได้</p>`;
            }
        }

        async function loadSearch() {
            clearAllIntervals();
            const container = document.getElementById('feedContainer');
            container.innerHTML = `
            <div class="space-y-4">
                <div class="flex gap-2">
                    <input type="text" id="searchInput" onkeydown="if(event.key === 'Enter') searchUsers()" placeholder="ค้นหา @username หรือชื่อศิลปิน/ค่าย..." class="flex-1 px-4 py-3 bg-slate-900 border border-slate-800 rounded-2xl text-xs">
                    <button onclick="searchUsers()" class="bg-pink-600 px-4 py-3 rounded-2xl text-xs font-bold shadow-lg shadow-pink-900/40">ค้นหา</button>
                </div>
                <div id="searchResultsList" class="space-y-2">
                    <p class="text-center text-slate-500 text-xs py-5">พิมพ์ชื่อหรือ @username แล้วกดปุ่มค้นหา...</p>
                </div>
            </div>`;
        }

        async function loadMessages() {
            clearAllIntervals();
            const container = document.getElementById('feedContainer');
            container.innerHTML = `<p class="text-center text-slate-500 text-xs py-10">กำลังโหลดรายชื่อแชท...</p>`;
            try {
                const { data: myData } = await window.supabase.from('users').select('*').eq('email', email).single();
                if(!myData) {
                    container.innerHTML = `<p class="text-center text-slate-500 text-xs py-10">ยังไม่มีรายชื่อแชท</p>`;
                    return;
                }
                const following = myData.following || [];
                const followers = myData.followers || [];
                const mutuals = following.filter(f => !f.includes('@') === false && followers.includes(f));

                if(mutuals.length === 0) {
                    container.innerHTML = `
                    <div class="space-y-3">
                        <h3 class="text-xs font-bold text-pink-400">ข้อความ (Direct Message)</h3>
                        <p class="text-[11px] text-slate-400">คุณสามารถส่งข้อความหากันได้เฉพาะผู้ใช้ที่คุณติดตามและติดตามคุณกลับแล้วเท่านั้น (Mutual Follow)</p>
                        <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl text-center space-y-2">
                            <p class="text-xs text-slate-500">ยังไม่มีเพื่อนที่ติดตามกันและกัน</p>
                        </div>
                    </div>`;
                    return;
                }

                let html = `<div class="space-y-3"><h3 class="text-xs font-bold text-pink-400">ข้อความ (Direct Message)</h3><div class="space-y-2">`;
                for(let mEmail of mutuals) {
                    const { data: u } = await window.supabase.from('users').select('*').eq('email', mEmail).single();
                    if(u) {
                        html += `
                        <div onclick="openChat('${u.email}', '${u.displayName}')" class="flex items-center gap-3 bg-slate-900 border border-slate-800 p-3 rounded-2xl cursor-pointer hover:border-pink-500 transition">
                            <div class="w-10 h-10 rounded-full bg-slate-800 overflow-hidden flex items-center justify-center font-bold text-pink-400">
                                ${u.avatarUrl ? `<img src="${u.avatarUrl}" class="w-full h-full object-cover">` : `<span class="text-sm">${u.username.charAt(0).toUpperCase()}</span>`}
                            </div>
                            <div>
                                <p class="text-xs font-bold">${u.displayName}</p>
                                <p class="text-[10px] text-slate-400">@${u.username} • แตะเพื่อแชท</p>
                            </div>
                        </div>`;
                    }
                }
                html += `</div></div>`;
                container.innerHTML = html;
            } catch(e) {
                container.innerHTML = `<p class="text-center text-red-500 text-xs py-10">โหลดข้อความไม่สำเร็จ</p>`;
            }
        }

        async function loadProfile() {
            clearAllIntervals();
            const container = document.getElementById('feedContainer');
            container.innerHTML = `<p class="text-center text-slate-500 text-xs py-10">กำลังโหลดโปรไฟล์...</p>`;
            
            try {
                const { data: uData } = await window.supabase.from('users').select('*').eq('email', email).single();
                const rawFollowersCount = uData && uData.followers ? uData.followers.length : 0;
                const rawFollowingCount = uData && uData.following ? uData.following.length : 0;

                const followersCount = formatNumber(rawFollowersCount);
                const followingCount = formatNumber(rawFollowingCount);

                const { data: userPosts } = await window.supabase.from('posts').select('*').eq('email', email);

                container.innerHTML = `
                <div class="space-y-6 pt-2">
                    <div class="flex items-center gap-6 px-2">
                        <div class="w-20 h-20 bg-gradient-to-tr from-pink-500 to-purple-600 rounded-full p-[2px] flex-shrink-0">
                            <div class="w-full h-full bg-slate-900 rounded-full flex items-center justify-center overflow-hidden">
                                ${userProfile.avatarUrl ? `<img src="${userProfile.avatarUrl}" class="w-full h-full object-cover">` : `<span class="text-xl font-bold text-pink-400">${userProfile.username.charAt(0).toUpperCase()}</span>`}
                            </div>
                        </div>
                        <div class="flex justify-around flex-1 text-center">
                            <div><p class="text-sm font-bold">${userPosts ? userPosts.length : 0}</p><p class="text-[11px] text-slate-400">โพสต์</p></div>
                            <div onclick="openUserList('followers')" class="cursor-pointer hover:opacity-75 transition"><p class="text-sm font-bold">${followersCount}</p><p class="text-[11px] text-slate-400">ผู้ติดตาม</p></div>
                            <div onclick="openUserList('following')" class="cursor-pointer hover:opacity-75 transition"><p class="text-sm font-bold">${followingCount}</p><p class="text-[11px] text-slate-400">กำลังติดตาม</p></div>
                        </div>
                    </div>

                    <div class="px-2 space-y-1">
                        <p class="text-xs font-bold text-slate-100">${userProfile.displayName} <span class="font-normal text-slate-400">@${userProfile.username}</span></p>
                        <p class="text-[11px] text-slate-300 whitespace-pre-line">${userProfile.bio}</p>
                        <button onclick="openEditProfileModal()" class="w-full mt-3 bg-slate-800 hover:bg-slate-700 py-2 rounded-xl text-xs font-bold transition">แก้ไขโปรไฟล์</button>
                    </div>

                    <div class="border-t border-slate-800 pt-3">
                        <div class="flex justify-center text-pink-500 text-xs font-bold pb-2 border-b-2 border-pink-500 w-24 mx-auto">📷 โพสต์ทั้งหมด</div>
                    </div>

                    <div class="grid grid-cols-3 gap-1" id="userPostsGrid"></div>
                </div>`;

                const grid = document.getElementById('userPostsGrid');
                if(!userPosts || userPosts.length === 0) {
                    container.innerHTML += `<p class="text-center text-slate-500 text-xs py-10">ยังไม่มีโพสต์ของคุณ</p>`;
                } else {
                    let gridHtml = '';
                    userPosts.forEach(p => {
                        gridHtml += `
                        <div onclick="openPostDetail('${p.id}')" class="aspect-square bg-slate-800 relative group overflow-hidden cursor-pointer">
                            <img src="${p.imageUrl}" class="w-full h-full object-cover">
                            <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 flex items-center justify-center text-white text-xs transition font-bold">🔍 ดูโพสต์</div>
                        </div>`;
                    });
                    if(grid) gridHtml ? grid.innerHTML = gridHtml : null;
                }
            } catch (error) {
                container.innerHTML = `<p class="text-center text-red-500 text-xs py-10">ไม่สามารถโหลดโปรไฟล์ได้</p>`;
            }
        }

        (async () => {
            await initUserProfile();
            switchTab(currentTab);
        })();
    </script>
</body>
</html>
