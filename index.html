<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Idol Ecosystem - Authentication</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .auth-view { display: none; }
        .auth-view.active { display: block; }
    </style>

    <!-- Supabase Client & Logic -->
    <script type="module">
        import { supabase } from './supabase-config.js';

        // จัดการฟอร์มเข้าสู่ระบบ
        window.handleLogin = async function(event) {
            event.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const pass = document.getElementById('loginPassword').value.trim();

            // เงื่อนไข Admin พิเศษ
            if (email === "ciiderydem@gmail.com" && pass === "adminciily") {
                localStorage.setItem('userRole', 'admin');
                localStorage.setItem('userEmail', email);
                window.location.href = 'home.html';
                return;
            } 
            // เงื่อนไข Agency พิเศษ
            if (email === "agency@lumistar.com") {
                localStorage.setItem('userRole', 'agency');
                localStorage.setItem('agencyId', 'LumiStar');
                localStorage.setItem('userEmail', email);
                window.location.href = 'home.html';
                return;
            }

            // ล็อกอินทั่วไปผ่าน Supabase Auth
            try {
                const { data: authData, error: authError } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: pass
                });

                if (authError) throw authError;

                // ตรวจสอบและสร้างข้อมูลสำรองในตาราง users ถ้ายังไม่มี
                const { data: existingUser } = await supabase
                    .from('users')
                    .select('*')
                    .eq('id', email)
                    .single();

                if (!existingUser) {
                    const newAcc = Math.floor(1000000000 + Math.random() * 9000000000).toString();
                    const newUserId = Math.floor(100000 + Math.random() * 900000).toString();
                    
                    await supabase
                        .from('users')
                        .insert([
                            {
                                id: email,
                                userId: newUserId,
                                accountnumber: newAcc,
                                balance: 1000000,
                                email: email,
                                name: email.split('@')[0],
                                user: '@' + email.split('@')[0],
                                bio: 'สวัสดี ฉันเป็นสมาชิกใหม่ของ Virtual Idol Ecosystem',
                                avatar: '',
                                realName: '',
                                nickName: '',
                                age: '',
                                birthDate: '',
                                agency: 'independent',
                                contacts: []
                            }
                        ]);
                }

                // บันทึกค่าลง localStorage ให้ครบถ้วนเพื่อใช้เชื่อมต่อหน้าอื่น
                localStorage.setItem('userEmail', email);
                localStorage.setItem('userRole', 'user');

                window.location.href = 'home.html';
            } catch (error) {
                console.error("Login Error:", error);
                alert("อีเมลหรือรหัสผ่านไม่ถูกต้อง: " + error.message);
            }
        };

        // จัดการฟอร์มสมัครสมาชิก
        window.handleRegister = async function(event) {
            event.preventDefault();
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value.trim();

            try {
                // สมัครสมาชิกผ่าน Supabase Auth
                const { data: authData, error: authError } = await supabase.auth.signUp({
                    email: email,
                    password: password
                });

                if (authError) throw authError;

                // สร้างข้อมูลโครงสร้างกลางที่รองรับทั้งระบบโปรไฟล์และระบบธนาคารเสมือน
                const newAcc = Math.floor(1000000000 + Math.random() * 9000000000).toString();
                const newUserId = Math.floor(100000 + Math.random() * 900000).toString();

                const profileData = {
                    id: email,
                    userId: newUserId,
                    accountnumber: newAcc,
                    balance: 1000000,
                    email: email,
                    name: name,
                    user: '@' + email.split('@')[0],
                    bio: 'สวัสดี ฉันเป็นสมาชิกใหม่ของ Virtual Idol Ecosystem',
                    avatar: '',
                    realName: name,
                    nickName: '',
                    age: '',
                    birthDate: '',
                    agency: 'independent',
                    contacts: []
                };

                // บันทึกลงตาราง users ใน Supabase
                const { error: insertError } = await supabase
                    .from('users')
                    .insert([profileData]);

                if (insertError) throw insertError;
                
                localStorage.setItem('xlink_profile', JSON.stringify(profileData));
                localStorage.setItem('userEmail', email);
                localStorage.setItem('userRole', 'user');

                alert("สมัครสมาชิกสำเร็จ!");
                window.location.href = 'home.html';
            } catch (error) {
                console.error("Register Error:", error);
                alert("เกิดข้อผิดพลาดในการสมัคร: " + error.message);
            }
        };
    </script>
</head>
<body class="bg-gradient-to-br from-indigo-950 via-purple-900 to-slate-900 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-slate-900/80 backdrop-blur-xl border border-purple-500/30 rounded-3xl shadow-2xl p-6 text-white">
        
        <!-- โหมดเข้าสู่ระบบ (Login View) -->
        <div id="loginView" class="auth-view active">
            <h1 class="text-2xl font-bold text-center mb-6 bg-gradient-to-r from-pink-400 to-purple-300 bg-clip-text text-transparent">เข้าสู่ระบบ</h1>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">อีเมล</label>
                    <input type="email" id="loginEmail" required class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl text-sm focus:border-purple-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">รหัสผ่าน</label>
                    <input type="password" id="loginPassword" required class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl text-sm focus:border-purple-500 outline-none">
                </div>
                <button type="submit" class="w-full py-3 bg-gradient-to-r from-pink-500 to-purple-600 rounded-xl text-sm font-bold shadow-lg hover:opacity-90 transition">เข้าสู่ระบบ</button>
            </form>
            <div class="text-center mt-4">
                <p class="text-xs text-slate-400">ยังไม่มีบัญชีใช่ไหม? <button onclick="switchView('register')" class="text-pink-400 hover:underline font-medium">สมัครสมาชิก</button></p>
            </div>
        </div>

        <!-- โหมดสมัครสมาชิก (Register View) -->
        <div id="registerView" class="auth-view">
            <h1 class="text-2xl font-bold text-center mb-6 bg-gradient-to-r from-pink-400 to-purple-300 bg-clip-text text-transparent">สมัครสมาชิก</h1>
            <form onsubmit="handleRegister(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">ชื่อที่แสดง</label>
                    <input type="text" id="regName" required class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl text-sm focus:border-purple-500 outline-none" placeholder="ชื่อของคุณ">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">อีเมล</label>
                    <input type="email" id="regEmail" required class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl text-sm focus:border-purple-500 outline-none" placeholder="name@example.com">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">รหัสผ่าน</label>
                    <input type="password" id="regPassword" required minlength="6" class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl text-sm focus:border-purple-500 outline-none" placeholder="อย่างน้อย 6 ตัวอักษร">
                </div>
                <button type="submit" class="w-full py-3 bg-gradient-to-r from-pink-500 to-purple-600 rounded-xl text-sm font-bold shadow-lg hover:opacity-90 transition">ลงทะเบียน</button>
            </form>
            <div class="text-center mt-4">
                <p class="text-xs text-slate-400">มีบัญชีอยู่แล้ว? <button onclick="switchView('login')" class="text-pink-400 hover:underline font-medium">เข้าสู่ระบบ</button></p>
            </div>
        </div>

    </div>

    <script>
        // ฟังก์ชันสลับหน้าจอไปมาระหว่าง Login และ Register ภายในไฟล์เดียว
        function switchView(viewName) {
            document.querySelectorAll('.auth-view').forEach(el => el.classList.remove('active'));
            if (viewName === 'login') {
                document.getElementById('loginView').classList.add('active');
            } else {
                document.getElementById('registerView').classList.add('active');
            }
        }
    </script>
</body>
</html>
