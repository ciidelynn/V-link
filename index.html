<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Idol Ecosystem - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Prompt', sans-serif; }</style>
</head>
<body class="bg-gradient-to-br from-indigo-950 via-purple-900 to-slate-900 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-slate-900/80 backdrop-blur-xl border border-purple-500/30 rounded-3xl shadow-2xl p-6 text-white">
        <h1 class="text-2xl font-bold text-center mb-6 bg-gradient-to-r from-pink-400 to-purple-300 bg-clip-text text-transparent">VIRTUAL IDOL</h1>
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">อีเมล</label>
                <input type="email" id="email" required class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl text-sm focus:border-purple-500 outline-none">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">รหัสผ่าน</label>
                <input type="password" id="password" required class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl text-sm focus:border-purple-500 outline-none">
            </div>
            <button type="submit" class="w-full py-3 bg-gradient-to-r from-pink-500 to-purple-600 rounded-xl text-sm font-bold shadow-lg">เข้าสู่ระบบ</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('password').value.trim();

            // เงื่อนไข Admin
            if (email === "ciiderydem@gmail.com" && pass === "adminciily") {
                localStorage.setItem('userRole', 'admin');
                localStorage.setItem('userEmail', email);
                window.location.href = 'home.html';
            } 
            // เงื่อนไข Agency (ตัวอย่างค่าย)
            else if (email === "agency@lumistar.com") {
                localStorage.setItem('userRole', 'agency');
                localStorage.setItem('agencyId', 'LumiStar');
                localStorage.setItem('userEmail', email);
                window.location.href = 'home.html';
            }
            else {
                alert("อีเมลหรือรหัสผ่านไม่ถูกต้อง");
            }
        });
    </script>
</body>
</html>
