<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-link - Social Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCskpROK3OC55EXjDP-ywMiuaOen-fwr2Y",
            authDomain: "v-link-5d0c8.firebaseapp.com",
            projectId: "v-link-5d0c8",
            storageBucket: "v-link-5d0c8.firebasestorage.app",
            messagingSenderId: "797769925158",
            appId: "1:797769925158:web:58c4a32a506494999b5ce7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.db = db;
        window.collection = collection;
        window.addDoc = addDoc;
        window.getDocs = getDocs;
        window.doc = doc;
        window.updateDoc = updateDoc;
        window.onSnapshot = onSnapshot;
        window.query = query;
        window.orderBy = orderBy;
        
        window.initRealtimeFeed();
    </script>

    <style>
        body { font-family: 'Prompt', sans-serif; }
        .tab-content { display: none; }
        .tab-content.active { display: flex; }
        .profile-tab-content { display: none; }
        .profile-tab-content.active { display: block; }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex justify-center p-4">
    <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-[2.5rem] shadow-2xl flex flex-col h-[700px] overflow-hidden">
        
        <!-- Header -->
        <div class="p-5 border-b border-slate-800 flex items-center justify-between bg-slate-900/80 backdrop-blur z-10 flex-shrink-0">
            <div class="flex items-center">
                <button onclick="window.location.href='home.html'" class="mr-4 text-slate-400 hover:text-white transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                </button>
                <h1 class="font-bold text-lg" id="headerTitle">หน้าหลัก</h1>
            </div>
        </div>

        <!-- Scrollable Area -->
        <div class="flex-grow overflow-y-auto p-4 flex flex-col space-y-4" id="mainContainer">
            
            <!-- 1. หน้าหลัก -->
            <div id="tab-home" class="tab-content active flex-col space-y-4">
                <div class="bg-slate-800/80 border border-slate-700/60 p-3.5 rounded-2xl space-y-3">
                    <textarea id="postInput" placeholder="คุณกำลังคิดอะไรอยู่? (พิมพ์ # เพื่อใส่แฮชแท็ก...)" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-slate-500 resize-none h-20"></textarea>
                    
                    <div class="flex items-center justify-between">
                        <label class="cursor-pointer flex items-center space-x-1.5 text-xs text-pink-400 hover:text-pink-300 transition">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                            <span id="imageFileName">แนบรูปภาพ</span>
                            <input type="file" id="postImageInput" accept="image/*" class="hidden" onchange="uploadToCloudinary(event, 'post')">
                        </label>
                    </div>

                    <div id="imagePreviewContainer" class="hidden relative rounded-xl overflow-hidden max-h-32 bg-slate-950 border border-slate-700">
                        <img id="imagePreview" src="" alt="Preview" class="w-full h-full object-cover">
                        <button onclick="removeImage()" class="absolute top-1 right-1 bg-black/70 rounded-full p-1 text-white hover:bg-black text-xs">✕</button>
                    </div>

                    <button onclick="createPostFirebase()" class="w-full py-2 bg-pink-600 hover:bg-pink-500 text-white rounded-xl text-xs font-bold transition shadow-md shadow-pink-600/20">โพสต์</button>
                </div>

                <div class="text-[11px] text-slate-500 italic text-center">ฟีดแบบเรียลไทม์ ทุกคนเห็นตรงกัน</div>
                
                <div class="feed-container-master space-y-4" id="feedContainer">
                    <div class="text-xs text-slate-500 text-center py-10">กำลังโหลดข้อมูลจากฐานข้อมูล...</div>
                </div>
            </div>

            <!-- 2. หน้าค้นหา -->
            <div id="tab-search" class="tab-content flex-col space-y-4">
                <div class="flex space-x-2">
                    <div class="relative flex-grow">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                        </span>
                        <input type="text" id="searchInput" placeholder="ค้นหาโพสต์ หรือแฮชแท็ก..." class="w-full bg-slate-800/80 border border-slate-700 rounded-xl pl-9 pr-3 py-2.5 text-xs text-white focus:outline-none focus:border-pink-500">
                    </div>
                    <button onclick="executeSearch()" class="px-4 bg-pink-600 hover:bg-pink-500 text-white rounded-xl text-xs font-bold transition shadow-md shadow-pink-600/20">ค้นหา</button>
                </div>

                <div id="searchContentArea" class="space-y-3">
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider px-1 pt-2"># แฮชแท็กยอดฮิต</h3>
                    <div class="space-y-3">
                        <div onclick="filterByHashtag('#SOLNIGHT_Debut')" class="p-3.5 bg-slate-800/40 hover:bg-slate-800 border border-slate-800 rounded-2xl cursor-pointer transition flex justify-between items-center">
                            <span class="text-sm font-semibold text-pink-400">#SOLNIGHT_Debut</span>
                            <span class="text-[10px] text-slate-500">แตะเพื่อค้นหา</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 3. หน้าโปรไฟล์ -->
            <div id="tab-profile" class="tab-content flex-col items-center text-center space-y-4">
                <div class="relative group cursor-pointer" onclick="document.getElementById('profileImageInput').click()">
                    <div id="profileAvatarBox" class="w-20 h-20 rounded-full bg-slate-800 border-2 border-slate-700 overflow-hidden flex items-center justify-center text-2xl font-bold shadow-lg">
                        <img id="profileAvatarImg" src="" class="w-full h-full object-cover hidden">
                        <span id="profileInitial">U</span>
                    </div>
                    <div class="absolute inset-0 bg-black/40 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition text-[10px] text-white font-medium">เปลี่ยนรูป</div>
                    <input type="file" id="profileImageInput" accept="image/*" class="hidden" onchange="uploadToCloudinary(event, 'profile')">
                </div>

                <div>
                    <h2 id="profileDisplayName" class="text-base font-bold">ชื่อบัญชี</h2>
                    <p id="profileUsername" class="text-xs text-slate-400">@username</p>
                </div>

                <p id="profileBio" class="text-xs text-slate-300 px-6 italic hidden"></p>

                <div class="flex space-x-6 text-xs text-slate-300 bg-slate-800/40 border border-slate-800 py-2 px-6 rounded-2xl">
                    <div onclick="openFollowingModal()" class="cursor-pointer hover:text-pink-400 transition"><span class="font-bold text-white" id="followingCount">0</span> กำลังติดตาม</div>
                    <div><span class="font-bold text-white" id="followersCount">0</span> ผู้ติดตาม</div>
                </div>

                <button onclick="openEditModal()" class="px-5 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-full text-xs font-semibold transition">
                    แก้ไขโปรไฟล์
                </button>

                <div class="w-full border-t border-slate-800 pt-3 mt-2">
                    <div class="grid grid-cols-2 text-xs font-semibold border-b border-slate-800 pb-2">
                        <button onclick="switchProfileTab('myposts')" id="btn-myposts" class="text-white pb-1 border-b-2 border-pink-500 transition">โพสต์ของคุณ</button>
                        <button onclick="switchProfileTab('likedposts')" id="btn-likedposts" class="text-slate-400 pb-1 border-b-2 border-transparent transition">ที่ถูกใจ</button>
                    </div>

                    <div id="profile-myposts" class="profile-tab-content active space-y-3 pt-3 text-left">
                        <div class="text-xs text-slate-500 text-center py-6">ยังไม่มีโพสต์ของคุณ</div>
                    </div>

                    <div id="profile-likedposts" class="profile-tab-content space-y-3 pt-3 text-left">
                        <div class="text-xs text-slate-500 text-center py-6">ยังไม่มีโพสต์ที่คุณกดใจ</div>
                    </div>
                </div>
            </div>

        </div>

        <!-- Bottom Navigation Tabs -->
        <div class="grid grid-cols-3 border-t border-slate-800 bg-slate-900 text-xs font-medium flex-shrink-0">
            <button onclick="switchTab('home', 'หน้าหลัก')" id="btn-home" class="py-4 text-center text-white border-t-2 border-white transition">หน้าหลัก</button>
            <button onclick="switchTab('search', 'ค้นหา')" id="btn-search" class="py-4 text-center text-slate-400 border-t-2 border-transparent transition hover:text-white">ค้นหา</button>
            <button onclick="switchTab('profile', 'โปรไฟล์')" id="btn-profile" class="py-4 text-center text-slate-400 border-t-2 border-transparent transition hover:text-white">โปรไฟล์</button>
        </div>
    </div>

    <!-- Modal แก้ไขโปรไฟล์ -->
    <div id="editModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-xs rounded-3xl p-6 space-y-4 shadow-2xl">
            <h3 class="font-bold text-base">แก้ไขโปรไฟล์</h3>
            <div class="space-y-3">
                <div>
                    <label class="text-[10px] text-slate-400 block mb-1">ชื่อบัญชี</label>
                    <input type="text" id="inputName" class="w-full p-3 rounded-xl bg-slate-950 border border-slate-800 text-sm focus:outline-none">
                </div>
                <div>
                    <label class="text-[10px] text-slate-400 block mb-1">ชื่อผู้ใช้ (@username)</label>
                    <input type="text" id="inputUser" class="w-full p-3 rounded-xl bg-slate-950 border border-slate-800 text-sm focus:outline-none">
                </div>
                <div>
                    <label class="text-[10px] text-slate-400 block mb-1">ไบโอ (เว้นว่างได้)</label>
                    <textarea id="inputBio" class="w-full p-3 rounded-xl bg-slate-950 border border-slate-800 text-sm focus:outline-none h-20 resize-none"></textarea>
                </div>
            </div>
            <div class="flex space-x-2 pt-2">
                <button onclick="closeEditModal()" class="flex-1 py-2.5 rounded-xl bg-slate-800 text-xs">ยกเลิก</button>
                <button onclick="saveProfile()" class="flex-1 py-2.5 rounded-xl bg-white text-black font-bold text-xs">บันทึก</button>
            </div>
        </div>
    </div>

    <!-- Modal รายชื่อกำลังติดตาม -->
    <div id="followingModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-xs rounded-3xl p-6 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="font-bold text-sm">กำลังติดตาม</h3>
                <button onclick="closeFollowingModal()" class="text-slate-400 hover:text-white text-xs">✕</button>
            </div>
            <div id="followingListContainer" class="space-y-3 max-h-60 overflow-y-auto">
                <div class="text-xs text-slate-500 text-center py-6">คุณยังไม่ได้ติดตามใคร</div>
            </div>
        </div>
    </div>

    <script>
        let uploadedImageSrc = null;
        let globalPostsCache = [];
        let likedPostIds = JSON.parse(localStorage.getItem('xlink_liked')) || [];
        let followingList = JSON.parse(localStorage.getItem('xlink_following')) || [];

        const CLOUD_NAME = "bnz9fyns"; 
        const UPLOAD_PRESET = "V-link"; 

        window.onload = function() {
            loadProfileData();
        };

        async function uploadToCloudinary(event, type) {
            const file = event.target.files[0];
            if (!file) return;

            if (type === 'post') {
                document.getElementById('imageFileName').innerText = "กำลังอัปโหลด...";
            } else {
                document.getElementById('profileInitial').innerText = "⏳";
            }

            const formData = new FormData();
            formData.append("file", file);
            formData.append("upload_preset", UPLOAD_PRESET);

            try {
                const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
                    method: "POST",
                    body: formData
                });
                const data = await response.json();

                if (data.secure_url) {
                    if (type === 'post') {
                        uploadedImageSrc = data.secure_url;
                        document.getElementById('imagePreview').src = uploadedImageSrc;
                        document.getElementById('imagePreviewContainer').classList.remove('hidden');
                        document.getElementById('imageFileName').innerText = file.name.substring(0, 10) + '...';
                    } else if (type === 'profile') {
                        const profileAvatarSrc = data.secure_url;
                        document.getElementById('profileAvatarImg').src = profileAvatarSrc;
                        document.getElementById('profileAvatarImg').classList.remove('hidden');
                        document.getElementById('profileInitial').classList.add('hidden');

                        let profileData = JSON.parse(localStorage.getItem('xlink_profile')) || {};
                        profileData.avatar = profileAvatarSrc;
                        localStorage.setItem('xlink_profile', JSON.stringify(profileData));
                    }
                } else {
                    alert("อัปโหลดรูปไม่สำเร็จ กรุณาตรวจสอบ Cloud Name และ Upload Preset");
                }
            } catch (error) {
                console.error("Cloudinary Error:", error);
                alert("เกิดข้อผิดพลาดในการอัปโหลดรูปภาพ");
            }
        }

        function removeImage() {
            uploadedImageSrc = null;
            document.getElementById('postImageInput').value = '';
            document.getElementById('imagePreviewContainer').classList.add('hidden');
            document.getElementById('imageFileName').innerText = 'แนบรูปภาพ';
        }

        function switchTab(tabName, title) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + tabName).classList.add('active');
            document.getElementById('headerTitle').innerText = title;

            ['home', 'search', 'profile'].forEach(t => {
                document.getElementById('btn-' + t).className = "py-4 text-center text-slate-400 border-t-2 border-transparent transition hover:text-white";
            });
            document.getElementById('btn-' + tabName).className = "py-4 text-center text-white border-t-2 border-white transition";
        }

        function switchProfileTab(subTab) {
            document.querySelectorAll('.profile-tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById('profile-' + subTab).classList.add('active');

            if(subTab === 'myposts') {
                document.getElementById('btn-myposts').className = "text-white pb-1 border-b-2 border-pink-500 transition";
                document.getElementById('btn-likedposts').className = "text-slate-400 pb-1 border-b-2 border-transparent transition";
            } else {
                document.getElementById('btn-likedposts').className = "text-white pb-1 border-b-2 border-pink-500 transition";
                document.getElementById('btn-myposts').className = "text-slate-400 pb-1 border-b-2 border-transparent transition";
            }
            renderProfileSections();
        }

        window.initRealtimeFeed = function() {
            const q = window.query(window.collection(window.db, "posts"), window.orderBy("createdAt", "desc"));
            window.onSnapshot(q, (snapshot) => {
                const posts = [];
                snapshot.forEach((docSnap) => {
                    posts.push({ id: docSnap.id, ...docSnap.data() });
                });
                globalPostsCache = posts;
                renderPosts(posts);
                renderProfileSections();
            });
        };

        async function createPostFirebase() {
            const text = document.getElementById('postInput').value.trim();
            if (!text && !uploadedImageSrc) return;

            const profileData = JSON.parse(localStorage.getItem('xlink_profile')) || {};
            const name = profileData.name || 'ชื่อบัญชี';
            const user = profileData.user || '@user';

            const matches = text.match(/#[^\s#]+/g) || [];
            const tagsStr = matches.join(' ');

            try {
                await window.addDoc(window.collection(window.db, "posts"), {
                    name: name,
                    user: user,
                    text: text,
                    image: uploadedImageSrc || '',
                    tags: tagsStr,
                    likes: 0,
                    reposts: 0,
                    createdAt: Date.now()
                });

                document.getElementById('postInput').value = '';
                removeImage();
            } catch (e) {
                console.error("Error adding post: ", e);
                alert("เกิดข้อผิดพลาดในการโพสต์");
            }
        }

        async function toggleLike(postId, currentLikes) {
            const isLiked = likedPostIds.includes(postId);
            const postRef = window.doc(window.db, "posts", postId);
            
            let newLikes = isLiked ? Math.max(0, currentLikes - 1) : currentLikes + 1;

            if (isLiked) {
                likedPostIds = likedPostIds.filter(id => id !== postId);
            } else {
                likedPostIds.push(postId);
            }
            localStorage.setItem('xlink_liked', JSON.stringify(likedPostIds));

            await window.updateDoc(postRef, { likes: newLikes });
            renderProfileSections();
        }

        async function toggleRepost(postId, currentReposts) {
            const postRef = window.doc(window.db, "posts", postId);
            await window.updateDoc(postRef, { reposts: currentReposts + 1 });
        }

        function renderPosts(posts) {
            const feedMaster = document.getElementById('feedContainer');
            if (posts.length === 0) {
                feedMaster.innerHTML = '<div class="text-xs text-slate-500 text-center py-10">ยังไม่มีโพสต์ในระบบ มาโพสต์คนแรกกันเถอะ!</div>';
                return;
            }

            feedMaster.innerHTML = '';
            posts.forEach(post => {
                const isLiked = likedPostIds.includes(post.id);
                let imageHTML = post.image ? `<div class="rounded-xl overflow-hidden max-h-48 border border-slate-700/60"><img src="${post.image}" class="w-full h-full object-cover"></div>` : '';

                const postHTML = `
                    <div class="bg-slate-800/60 border border-slate-800 p-4 rounded-2xl space-y-3">
                        <div class="flex items-center space-x-3">
                            <div class="w-9 h-9 rounded-full bg-pink-600 flex items-center justify-center font-bold text-sm overflow-hidden flex-shrink-0">
                                ${post.name.charAt(0)}
                            </div>
                            <div>
                                <h4 class="font-bold text-sm">${post.name}</h4>
                                <p class="text-[10px] text-slate-400">${post.user}</p>
                            </div>
                        </div>
                        ${post.text ? `<p class="text-sm text-slate-200">${post.text}</p>` : ''}
                        ${imageHTML}
                        <div class="flex justify-between items-center pt-2 border-t border-slate-700/50 text-xs text-slate-400">
                            <button onclick="toggleLike('${post.id}', ${post.likes})" class="flex items-center space-x-1 transition ${isLiked ? 'text-pink-500 font-bold' : 'text-slate-400 hover:text-pink-400'}">
                                <span>${isLiked ? '❤️' : '🤍'}</span> <span>${post.likes}</span>
                            </button>
                            <button onclick="toggleRepost('${post.id}', ${post.reposts})" class="flex items-center space-x-1 hover:text-green-400 transition text-slate-400">
                                <span>🔁</span> <span>${post.reposts}</span>
                            </button>
                        </div>
                    </div>
                `;
                feedMaster.insertAdjacentHTML('beforeend', postHTML);
            });
        }

        function renderProfileSections() {
            const profileData = JSON.parse(localStorage.getItem('xlink_profile')) || {};
            const myUsername = profileData.user || '@user';

            document.getElementById('followingCount').innerText = followingList.length;
            document.getElementById('followersCount').innerText = 0;

            const myPostsContainer = document.getElementById('profile-myposts');
            const likedPostsContainer = document.getElementById('profile-likedposts');

            let myPostsHTML = '';
            let likedPostsHTML = '';
            let myCount = 0;
            let likedCount = 0;

            globalPostsCache.forEach(post => {
                const isLiked = likedPostIds.includes(post.id);
                let imageHTML = post.image ? `<div class="rounded-xl overflow-hidden max-h-36 border border-slate-700/60 mt-2"><img src="${post.image}" class="w-full h-full object-cover"></div>` : '';

                const cardHTML = `
                    <div class="bg-slate-800/50 border border-slate-800 p-3 rounded-2xl space-y-2">
                        ${post.text ? `<p class="text-xs text-slate-200">${post.text}</p>` : ''}
                        ${imageHTML}
                        <div class="flex justify-between items-center pt-1 text-[11px] text-slate-400">
                            <span>❤️ ${post.likes}</span>
                            <span>🔁 ${post.reposts}</span>
                        </div>
                    </div>
                `;

                if (post.user === myUsername) {
                    myPostsHTML += cardHTML;
                    myCount++;
                }

                if (isLiked) {
                    likedPostsHTML += cardHTML;
                    likedCount++;
                }
            });

            myPostsContainer.innerHTML = myCount > 0 ? myPostsHTML : '<div class="text-xs text-slate-500 text-center py-6">ยังไม่มีโพสต์ของคุณ</div>';
            likedPostsContainer.innerHTML = likedCount > 0 ? likedPostsHTML : '<div class="text-xs text-slate-500 text-center py-6">ยังไม่มีโพสต์ที่คุณกดใจ</div>';
            
            renderFollowingList();
        }

        function renderFollowingList() {
            const container = document.getElementById('followingListContainer');
            if (followingList.length === 0) {
                container.innerHTML = '<div class="text-xs text-slate-500 text-center py-6">คุณยังไม่ได้ติดตามใคร</div>';
                return;
            }
            let html = '';
            followingList.forEach(user => {
                html += `
                    <div class="flex items-center justify-between bg-slate-950 p-2.5 rounded-xl border border-slate-800">
                        <div class="flex items-center space-x-2">
                            <div class="w-8 h-8 rounded-full bg-pink-600 flex items-center justify-center font-bold text-xs">${user.name.charAt(0)}</div>
                            <div>
                                <h4 class="text-xs font-bold">${user.name}</h4>
                                <p class="text-[10px] text-slate-400">${user.username}</p>
                            </div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function openFollowingModal() {
            document.getElementById('followingModal').classList.remove('hidden');
        }
        function closeFollowingModal() {
            document.getElementById('followingModal').classList.add('hidden');
        }

        function openEditModal() {
            document.getElementById('inputName').value = document.getElementById('profileDisplayName').innerText;
            document.getElementById('inputUser').value = document.getElementById('profileUsername').innerText;
            const currentBio = document.getElementById('profileBio').innerText;
            document.getElementById('inputBio').value = currentBio;
            document.getElementById('editModal').classList.remove('hidden');
        }
        function closeEditModal() { document.getElementById('editModal').classList.add('hidden'); }

        function saveProfile() {
            const name = document.getElementById('inputName').value.trim();
            const user = document.getElementById('inputUser').value.trim();
            const bio = document.getElementById('inputBio').value.trim();

            let profileData = JSON.parse(localStorage.getItem('xlink_profile')) || {};
            profileData.name = name || 'ชื่อบัญชี';
            profileData.user = user ? (user.startsWith('@') ? user : '@' + user) : '@username';
            profileData.bio = bio;

            localStorage.setItem('xlink_profile', JSON.stringify(profileData));
            loadProfileData();
            closeEditModal();
        }

        function loadProfileData() {
            const data = localStorage.getItem('xlink_profile');
            if (data) {
                const profile = JSON.parse(data);
                document.getElementById('profileDisplayName').innerText = profile.name;
                document.getElementById('profileUsername').innerText = profile.user;
                document.getElementById('profileInitial').innerText = profile.name.charAt(0).toUpperCase();

                const bioElement = document.getElementById('profileBio');
                if (profile.bio && profile.bio.trim() !== "") {
                    bioElement.innerText = profile.bio;
                    bioElement.classList.remove('hidden');
                } else {
                    bioElement.innerText = "";
                    bioElement.classList.add('hidden');
                }

                if (profile.avatar) {
                    document.getElementById('profileAvatarImg').src = profile.avatar;
                    document.getElementById('profileAvatarImg').classList.remove('hidden');
                    document.getElementById('profileInitial').classList.add('hidden');
                }
            }
            renderProfileSections();
        }

        function executeSearch() {
            const keyword = document.getElementById('searchInput').value.trim();
            if(!keyword) return;
            filterByHashtag(keyword);
        }

        function filterByHashtag(query) {
            const searchArea = document.getElementById('searchContentArea');
            let matchedHTML = `<div class="text-xs text-pink-400 font-semibold mb-2">ผลการค้นหา: "${query}"</div><div class="space-y-3">`;
            
            let foundCount = 0;
            globalPostsCache.forEach(post => {
                if ((post.tags && post.tags.includes(query)) || (post.text && post.text.includes(query))) {
                    matchedHTML += `
                        <div class="bg-slate-800/60 border border-slate-800 p-4 rounded-2xl space-y-2">
                            <h4 class="font-bold text-sm">${post.name}</h4>
                            <p class="text-sm text-slate-200">${post.text}</p>
                        </div>
                    `;
                    foundCount++;
                }
            });

            if (foundCount === 0) matchedHTML += `<div class="text-xs text-slate-500 text-center py-6">ไม่พบโพสต์ที่ตรงกัน</div>`;
            matchedHTML += `</div>`;
            searchArea.innerHTML = matchedHTML;
        }
    </script>
</body>
</html>
