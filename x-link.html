<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-link - Social Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex justify-center p-4">
    <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-[2.5rem] shadow-2xl flex flex-col h-[700px] overflow-hidden">
        
        <!-- Header -->
        <div class="p-6 border-b border-slate-800 flex items-center">
            <button onclick="window.location.href='home.html'" class="mr-4 text-slate-400">←</button>
            <h1 class="font-bold text-lg">X-link</h1>
        </div>

        <!-- Scrollable Area -->
        <div class="flex-grow overflow-y-auto p-4" id="mainContainer">
            
            <!-- หน้าหลัก (Timeline) -->
            <div id="tab-home" class="tab-content active space-y-4">
                <div class="text-xs text-slate-500 italic">ฟีดข่าวจากค่ายและศิลปินที่ติดตาม...</div>
                <!-- ตัวอย่าง Post -->
                <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                    <div class="flex items-center space-x-2">
                        <div class="w-8 h-8 rounded-full bg-pink-500"></div>
                        <span class="font-bold text-sm">Artist Name</span>
                    </div>
                    <p class="mt-2 text-sm">วันนี้สนุกมากเลยครับ! #คุยเล่นกับศิลปิน</p>
                    <div class="mt-3 flex space-x-4 text-xs text-slate-400">
                        <span>❤️ ใจ</span> <span>🔁 รีโพสต์</span> <span>💬 โควท</span>
                    </div>
                </div>
            </div>

            <!-- หน้าค้นหา -->
            <div id="tab-search" class="tab-content space-y-4">
                <input type="text" placeholder="ค้นหาศิลปิน หรือ #แฮชแท็ก" class="w-full p-3 rounded-xl bg-slate-950 border border-slate-700 text-sm">
                <div class="text-xs text-slate-500">#Trending ในขณะนี้...</div>
            </div>

            <!-- หน้าโปรไฟล์ -->
            <div id="tab-profile" class="tab-content space-y-4 text-center">
                <div class="w-20 h-20 rounded-full bg-slate-700 mx-auto"></div>
                <h2 class="font-bold">User Name</h2>
                <p class="text-xs text-slate-400">Bio... (แก้ไขได้)</p>
                <div class="border-t border-slate-800 pt-4 mt-4">
                    <p class="text-sm font-semibold">โพสต์ที่ถูกใจ / รีโพสต์</p>
                </div>
            </div>
        </div>

        <!-- Bottom Tabs -->
        <div class="grid grid-cols-3 border-t border-slate-800 bg-slate-900">
            <button onclick="switchTab('home')" class="p-4 text-xs border-b-2 border-transparent hover:border-white">หน้าหลัก</button>
            <button onclick="switchTab('search')" class="p-4 text-xs border-b-2 border-transparent hover:border-white">ค้นหา</button>
            <button onclick="switchTab('profile')" class="p-4 text-xs border-b-2 border-transparent hover:border-white">โปรไฟล์</button>
        </div>
    </div>

    <script>
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + tabName).classList.add('active');
        }
    </script>
</body>
</html>
