<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-link - Social Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, onSnapshot, query, orderBy, setDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCskpROK3OC55EXjDP-ywMiuaOen-fwr2Y",
            authDomain: "v-link-5d0c8.firebaseapp.com",
            projectId: "v-link-5d0c8",
            storageBucket: "v-link-5d0c8.firebasestorage.app",
            messagingSenderId: "797769925158",
            appId: "1:797769925158:web:58c4a32a506494999b5ce7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.db = db;
        window.collection = collection;
        window.addDoc = addDoc;
        window.getDocs = getDocs;
        window.doc = doc;
        window.setDoc = setDoc;
        window.updateDoc = updateDoc;
        window.deleteDoc = deleteDoc;
        window.onSnapshot = onSnapshot;
        window.query = query;
        window.orderBy = orderBy;
        
        window.initRealtimeFeed();
    </script>

    <style>
        body { font-family: 'Prompt', sans-serif; }

        .tab-content.active { display: flex; }
        .profile-tab-content { display: none; }
        .profile-tab-content.active { display: block; }
    </style>
</head>

                    <textarea id="postInput" placeholder="คุณกำลังคิดอะไรอยู่? (พิมพ์ # เพื่อใส่แฮชแท็ก...)" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-slate-500 resize-none h-20"></textarea>
                    
                    <div class="flex items-center justify-between">
                        <label class="cursor-pointer flex items-center space-x-1.5 text-xs text-pink-400 hover:text-pink-300 transition">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>

                    </div>

                    <button onclick="createPostFirebase()" class="w-full py-2 bg-pink-600 hover:bg-pink-500 text-white rounded-xl text-xs font-bold transition shadow-md shadow-pink-600/20">โพสต์</button>
                </div>
                
                <div class="feed-container-master space-y-4" id="feedContainer">

            <!-- 2. หน้าค้นหา -->
            <div id="tab-search" class="tab-content flex-col space-y-4">
                <div class="flex space-x-2">
                    <div class="relative flex-grow">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>

                        <input type="text" id="searchInput" placeholder="ค้นหาโพสต์, แฮชแท็ก หรือ @username..." class="w-full bg-slate-800/80 border border-slate-700 rounded-xl pl-9 pr-3 py-2.5 text-xs text-white focus:outline-none focus:border-pink-500" oninput="handleSearchInput(this.value)">

                    <div class="absolute inset-0 bg-black/40 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition text-[10px] text-white font-medium">เปลี่ยนรูป</div>
                    <input type="file" id="profileImageInput" accept="image/*" class="hidden" onchange="uploadToCloudinary(event, 'profile')">

                <div>
                    <h2 id="profileDisplayName" class="text-base font-bold">ชื่อบัญชี</h2>

                <p id="profileBio" class="text-xs text-slate-300 px-6 italic hidden"></p>

                <div class="flex space-x-6 text-xs text-slate-300 bg-slate-800/40 border border-slate-800 py-2 px-6 rounded-2xl">

                    <div><span class="font-bold text-white" id="followersCount">0</span> ผู้ติดตาม</div>

                        <div class="text-xs text-slate-500 text-center py-6">ยังไม่มีโพสต์ของคุณ</div>
                    </div>

                    <div id="profile-likedposts" class="profile-tab-content space-y-3 pt-3 text-left">

                </div>

        </div>

        <!-- Bottom Navigation Tabs -->
        <div class="grid grid-cols-3 border-t border-slate-800 bg-slate-900 text-xs font-medium flex-shrink-0">
            <button onclick="switchTab('home', 'หน้าหลัก')" id="btn-home" class="py-4 text-center text-white border-t-2 border-white transition">หน้าหลัก</button>
            <button onclick="switchTab('search', 'ค้นหา')" id="btn-search" class="py-4 text-center text-slate-400 border-t-2 border-transparent transition hover:text-white">ค้นหา</button>
            <button onclick="switchTab('profile', 'โปรไฟล์')" id="btn-profile" class="py-4 text-center text-slate-400 border-t-2 border-transparent transition hover:text-white">โปรไฟล์</button>
        </div>

    <!-- Modal แก้ไขโปรไฟล์ -->
    <div id="editModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">

                </div>
                <div>
                    <label class="text-[10px] text-slate-400 block mb-1">ชื่อผู้ใช้ (@username)</label>
                    <input type="text" id="inputUser" class="w-full p-3 rounded-xl bg-slate-950 border border-slate-800 text-sm focus:outline-none">
                </div>
                <div>
                    <label class="text-[10px] text-slate-400 block mb-1">ไบโอ (เว้นว่างได้)</label>

                </div>
            </div>
            <div class="flex space-x-2 pt-2">
                <button onclick="closeEditModal()" class="flex-1 py-2.5 rounded-xl bg-slate-800 text-xs">ยกเลิก</button>

    <!-- Modal รายชื่อกำลังติดตาม -->
    <div id="followingModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">

    <!-- Modal ดูโปรไฟล์ผู้อื่น (พร้อมแสดงโพสต์และกดไลก์/รีโพสต์ได้) -->
    <div id="userProfileModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-sm h-[85%] rounded-3xl p-5 flex flex-col shadow-2xl relative">
            <button onclick="closeUserProfileModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-xs z-10">✕</button>
            
            <div class="flex flex-col items-center space-y-2 pt-2 flex-shrink-0 border-b border-slate-800 pb-4">
                <div id="modalUserAvatar" class="w-16 h-16 rounded-full bg-slate-800 border-2 border-slate-700 overflow-hidden flex items-center justify-center text-xl font-bold shadow-lg"></div>
                <div>
                    <h3 id="modalUserDisplayName" class="font-bold text-sm text-center"></h3>
                    <p id="modalUserUsername" class="text-xs text-slate-400 text-center"></p>
                </div>
                <div class="flex space-x-6 text-xs text-slate-300 bg-slate-800/40 border border-slate-800 py-1.5 px-4 rounded-xl">
                    <div><span class="font-bold text-white" id="modalUserFollowingCount">0</span> กำลังติดตาม</div>
                    <div><span class="font-bold text-white" id="modalUserFollowersCount">0</span> ผู้ติดตาม</div>
                </div>
                <div id="modalUserFollowBtnContainer" class="w-full pt-1"></div>
            </div>

            <!-- ส่วนแสดงโพสต์ของยูสเซอร์นั้นใน Modal -->
            <div class="flex-grow overflow-y-auto pt-3 space-y-3" id="modalUserPostsContainer">
                <div class="text-xs text-slate-500 text-center py-6">ยังไม่มีโพสต์</div>
            </div>
        </div>
    </div>

    <script>
        let uploadedImageSrc = null;
        let globalPostsCache = [];
        let likedPostIds = JSON.parse(localStorage.getItem('xlink_liked')) || [];
        let followingList = JSON.parse(localStorage.getItem('xlink_following')) || [];
        let currentActiveTab = 'home';
        let currentViewingUsername = null; // เก็บ username ของโปรไฟล์ที่เปิดดูอยู่ปัจจุบัน

        let predefinedSystemUsers = [
            { name: "SOLNIGHT Official", user: "@solnight", avatar: "", following: 5, followers: 1240 },
            { name: "Lumistar Ent.", user: "@lumistar", avatar: "", following: 2, followers: 3500 },
            { name: "Admin System", user: "@admin", avatar: "", following: 10, followers: 890 },
            { name: "Test User", user: "@testuser", avatar: "", following: 1, followers: 45 }
        ];

        const CLOUD_NAME = "bnz9fyns"; 
        const UPLOAD_PRESET = "V-link"; 

        window.onload = function() {
            loadProfileData();
        };

        async function uploadToCloudinary(event, type) {
            const file = event.target.files[0];
            if (!file) return;

            if (type === 'post') {
                document.getElementById('imageFileName').innerText = "กำลังอัปโหลด...";
            } else {
                document.getElementById('profileInitial').innerText = "⏳";
            }

            const formData = new FormData();
            formData.append("file", file);
            formData.append("upload_preset", UPLOAD_PRESET);

            try {
                const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
                    method: "POST",
                    body: formData
                });
                const data = await response.json();

                if (data.secure_url) {
                    if (type === 'post') {
                        uploadedImageSrc = data.secure_url;
                        document.getElementById('imagePreview').src = uploadedImageSrc;
                        document.getElementById('imagePreviewContainer').classList.remove('hidden');
                        document.getElementById('imageFileName').innerText = file.name.substring(0, 10) + '...';
                    } else if (type === 'profile') {
                        const profileAvatarSrc = data.secure_url;
                        document.getElementById('profileAvatarImg').src = profileAvatarSrc;
                        document.getElementById('profileAvatarImg').classList.remove('hidden');
                        document.getElementById('profileInitial').classList.add('hidden');

                        let profileData = JSON.parse(localStorage.getItem('xlink_profile')) || {};
                        profileData.avatar = profileAvatarSrc;
                        localStorage.setItem('xlink_profile', JSON.stringify(profileData));
                    }
                } else {
                    alert("อัปโหลดรูปไม่สำเร็จ กรุณาตรวจสอบ Cloud Name และ Upload Preset");
                }
            } catch (error) {
                console.error("Cloudinary Error:", error);
                alert("เกิดข้อผิดพลาดในการอัปโหลดรูปภาพ");
            }
        }

        function removeImage() {
            uploadedImageSrc = null;
            document.getElementById('postImageInput').value = '';
            document.getElementById('imagePreviewContainer').classList.add('hidden');
            document.getElementById('imageFileName').innerText = 'แนบรูปภาพ';
        }

        function switchTab(tabName, title) {
            currentActiveTab = tabName;
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + tabName).classList.add('active');
            document.getElementById('headerTitle').innerText = title;

            ['home', 'search', 'profile'].forEach(t => {
                document.getElementById('btn-' + t).className = "py-4 text-center text-slate-400 border-t-2 border-transparent transition hover:text-white";
            });
            document.getElementById('btn-' + tabName).className = "py-4 text-center text-white border-t-2 border-white transition";

            if(tabName === 'search') {
                renderTrendingHashtags();
            }
        }

        function switchProfileTab(subTab) {
            document.querySelectorAll('.profile-tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById('profile-' + subTab).classList.add('active');

            if(subTab === 'myposts') {
                document.getElementById('btn-myposts').className = "text-white pb-1 border-b-2 border-pink-500 transition";
                document.getElementById('btn-likedposts').className = "text-slate-400 pb-1 border-b-2 border-transparent transition";
            } else {
                document.getElementById('btn-likedposts').className = "text-white pb-1 border-b-2 border-pink-500 transition";
                document.getElementById('btn-myposts').className = "text-slate-400 pb-1 border-b-2 border-transparent transition";
            }
            renderProfileSections();
        }

        window.initRealtimeFeed = function() {
            const q = window.query(window.collection(window.db, "posts"), window.orderBy("createdAt", "desc"));
            window.onSnapshot(q, (snapshot) => {
                const posts = [];
                snapshot.forEach((docSnap) => {
                    posts.push({ id: docSnap.id, ...docSnap.data() });
                });
                globalPostsCache = posts;
                
                renderPosts(posts);
                renderProfileSections();
                
                // หากกำลังเปิดดูโปรไฟล์ผู้อื่นอยู่ ให้รีเฟรชรายการโพสต์ใน Modal ทันทีแบบเรียลไทม์
                if(currentViewingUsername) {
                    let targetUser = predefinedSystemUsers.find(u => u.user === currentViewingUsername);
                    let targetName = targetUser ? targetUser.name : currentViewingUsername;
                    let targetAvatar = targetUser ? targetUser.avatar : '';
                    renderModalUserPosts(currentViewingUsername, targetName, targetAvatar);
                }

                if(currentActiveTab === 'search') {
                    const searchInputVal = document.getElementById('searchInput').value.trim();
                    if(searchInputVal) {
                        filterSearch(searchInputVal);
                    } else {
                        renderTrendingHashtags();
                    }
                }
            });
        };

        async function createPostFirebase() {
            const text = document.getElementById('postInput').value.trim();
            if (!text && !uploadedImageSrc) return;

            const profileData = JSON.parse(localStorage.getItem('xlink_profile')) || {};
            const name = profileData.name || 'ชื่อบัญชี';
            const user = profileData.user || '@user';
            const avatar = profileData.avatar || '';

            const matches = text.match(/#[^\s#]+/g) || [];
            const tagsStr = matches.join(' ');

            try {
                await window.addDoc(window.collection(window.db, "posts"), {
                    name: name,
                    user: user,
                    avatar: avatar,
                    text: text,
                    image: uploadedImageSrc || '',
                    tags: tagsStr,
                    likes: 0,
                    reposts: 0,
                    createdAt: Date.now()
                });

                document.getElementById('postInput').value = '';
                removeImage();
            } catch (e) {
                console.error("Error adding post: ", e);
                alert("เกิดข้อผิดพลาดในการโพสต์");
            }
        }

        async function toggleLike(postId, currentLikes) {
            const isLiked = likedPostIds.includes(postId);
            const postRef = window.doc(window.db, "posts", postId);
            
            let newLikes = isLiked ? Math.max(0, currentLikes - 1) : currentLikes + 1;

            if (isLiked) {
                likedPostIds = likedPostIds.filter(id => id !== postId);
            } else {
                likedPostIds.push(postId);
            }
            localStorage.setItem('xlink_liked', JSON.stringify(likedPostIds));

            await window.updateDoc(postRef, { likes: newLikes });
            renderProfileSections();
        }

        async function toggleRepost(postId, currentReposts) {
            const postRef = window.doc(window.db, "posts", postId);
            await window.updateDoc(postRef, { reposts: currentReposts + 1 });
        }

        async function deletePost(postId) {
            if (!confirm("คุณต้องการลบโพสต์นี้ใช่หรือไม่?")) return;
            try {
                await window.deleteDoc(window.doc(window.db, "posts", postId));
                likedPostIds = likedPostIds.filter(id => id !== postId);
                localStorage.setItem('xlink_liked', JSON.stringify(likedPostIds));
            } catch (e) {
                console.error("Error deleting post: ", e);
                alert("เกิดข้อผิดพลาดในการลบโพสต์");
            }
        }

        function toggleFollowUser(name, username) {
            const index = followingList.findIndex(item => item.username === username);
            let targetSysUser = predefinedSystemUsers.find(u => u.user === username);

            if (index > -1) {
                followingList.splice(index, 1);
                if(targetSysUser) targetSysUser.followers = Math.max(0, targetSysUser.followers - 1);
            } else {
                followingList.push({ name, username });
                if(targetSysUser) targetSysUser.followers += 1;
            }
            localStorage.setItem('xlink_following', JSON.stringify(followingList));
            
            renderProfileSections();
            
            if(targetSysUser) {
                document.getElementById('modalUserFollowersCount').innerText = targetSysUser.followers;
            }
            
            const keyword = document.getElementById('searchInput').value.trim();
            if(keyword) {
                filterSearch(keyword);
            } else {
                renderTrendingHashtags();
            }
        }

        function viewUserProfile(name, username, avatar) {
            currentViewingUsername = username;
            document.getElementById('modalUserDisplayName').innerText = name;
            document.getElementById('modalUserUsername').innerText = username;

            let targetSysUser = predefinedSystemUsers.find(u => u.user === username);
            let followersCount = targetSysUser ? targetSysUser.followers : 0;
            let followingCount = targetSysUser ? targetSysUser.following : 0;

            document.getElementById('modalUserFollowingCount').innerText = followingCount;
            document.getElementById('modalUserFollowersCount').innerText = followersCount;

            const avatarContainer = document.getElementById('modalUserAvatar');
            if(avatar && avatar.trim() !== "") {
                avatarContainer.innerHTML = `<img src="${avatar}" class="w-full h-full object-cover">`;
            } else {
                avatarContainer.innerHTML = `<span class="text-pink-600">${name.charAt(0).toUpperCase()}</span>`;
            }

            const isFollowing = followingList.some(item => item.username === username);
            const btnContainer = document.getElementById('modalUserFollowBtnContainer');
            btnContainer.innerHTML = `
                <button onclick="toggleFollowUser('${name}', '${username}'); viewUserProfile('${name}', '${username}', '${avatar}');" class="w-full py-2 rounded-xl font-bold text-xs transition ${isFollowing ? 'bg-slate-800 text-slate-300 border border-slate-700 hover:bg-red-900/40' : 'bg-pink-600 text-white hover:bg-pink-500'}">
                    ${isFollowing ? 'กำลังติดตาม' : 'ติดตาม'}
                </button>
            `;

            renderModalUserPosts(username, name, avatar);
            document.getElementById('userProfileModal').classList.remove('hidden');
        }

        function renderModalUserPosts(username, name, avatar) {
            const container = document.getElementById('modalUserPostsContainer');
            const userPosts = globalPostsCache.filter(post => post.user === username);

            if (userPosts.length === 0) {
                container.innerHTML = '<div class="text-xs text-slate-500 text-center py-6">ยังไม่มีโพสต์ในบัญชีนี้</div>';
                return;
            }

            let html = '';
            userPosts.forEach(post => {
                const isLiked = likedPostIds.includes(post.id);
                let imageHTML = post.image ? `<div class="rounded-xl overflow-hidden max-h-36 border border-slate-700/60 mt-2"><img src="${post.image}" class="w-full h-full object-cover"></div>` : '';
                let avatarBox = getAvatarHTML(avatar, name, "w-7 h-7", "text-xs");

                html += `
                    <div class="bg-slate-800/60 border border-slate-800 p-3 rounded-2xl space-y-2 text-left">
                        <div class="flex items-center space-x-2">
                            ${avatarBox}
                            <div>
                                <span class="font-bold text-xs">${name}</span>
                                <span class="text-[10px] text-slate-400 block">${username}</span>
                            </div>
                        </div>
                        ${post.text ? `<p class="text-xs text-slate-200">${post.text}</p>` : ''}
                        ${imageHTML}
                        <div class="flex justify-between items-center pt-1 border-t border-slate-700/40 text-[11px] text-slate-400">
                            <button onclick="toggleLike('${post.id}', ${post.likes || 0})" class="flex items-center space-x-1 transition ${isLiked ? 'text-pink-500 font-bold' : 'text-slate-400 hover:text-pink-400'}">
                                <span>${isLiked ? '❤️' : '🤍'}</span> <span>${post.likes || 0}</span>
                            </button>
                            <button onclick="toggleRepost('${post.id}', ${post.reposts || 0})" class="flex items-center space-x-1 hover:text-green-400 transition text-slate-400">
                                <span>🔁</span> <span>${post.reposts || 0}</span>
                            </button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function closeUserProfileModal() {
            currentViewingUsername = null;
            document.getElementById('userProfileModal').classList.add('hidden');
        }

        function getAvatarHTML(avatarUrl, name, sizeClass = "w-9 h-9", textClass = "text-sm") {
            if (avatarUrl && avatarUrl.trim() !== "") {
                return `<div class="${sizeClass} rounded-full bg-slate-800 overflow-hidden flex-shrink-0 border border-slate-700"><img src="${avatarUrl}" class="w-full h-full object-cover"></div>`;
            } else {
                const initial = name ? name.charAt(0).toUpperCase() : 'U';
                return `<div class="${sizeClass} rounded-full bg-pink-600 flex items-center justify-center font-bold ${textClass} overflow-hidden flex-shrink-0">${initial}</div>`;
            }
        }

        function renderPosts(posts) {
            const feedMaster = document.getElementById('feedContainer');
            const viralPosts = posts.filter(post => (post.reposts || 0) >= 300);

            if (viralPosts.length === 0) {
                feedMaster.innerHTML = '<div class="text-xs text-slate-500 text-center py-10">ยังไม่มีโพสต์ที่มียอดรีโพสต์ถึง 300 ครั้งในหน้าหลัก</div>';
                return;
            }

            feedMaster.innerHTML = '';
            viralPosts.forEach(post => {
                const isLiked = likedPostIds.includes(post.id);
                let imageHTML = post.image ? `<div class="rounded-xl overflow-hidden max-h-48 border border-slate-700/60"><img src="${post.image}" class="w-full h-full object-cover"></div>` : '';
                let avatarBox = getAvatarHTML(post.avatar, post.name, "w-9 h-9", "text-sm");

                const postHTML = `
                    <div class="bg-slate-800/60 border border-slate-800 p-4 rounded-2xl space-y-3">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-3 cursor-pointer" onclick="viewUserProfile('${post.name}', '${post.user}', '${post.avatar || ''}')">
                                ${avatarBox}
                                <div>
                                    <h4 class="font-bold text-sm">${post.name}</h4>
                                    <p class="text-[10px] text-slate-400">${post.user}</p>
                                </div>
                            </div>
                        </div>
                        ${post.text ? `<p class="text-sm text-slate-200">${post.text}</p>` : ''}
                        ${imageHTML}
                        <div class="flex justify-between items-center pt-2 border-t border-slate-700/50 text-xs text-slate-400">
                            <button onclick="toggleLike('${post.id}', ${post.likes || 0})" class="flex items-center space-x-1 transition ${isLiked ? 'text-pink-500 font-bold' : 'text-slate-400 hover:text-pink-400'}">
                                <span>${isLiked ? '❤️' : '🤍'}</span> <span>${post.likes || 0}</span>
                            </button>
                            <button onclick="toggleRepost('${post.id}', ${post.reposts || 0})" class="flex items-center space-x-1 hover:text-green-400 transition text-slate-400">
                                <span>🔁</span> <span>${post.reposts || 0}</span>
                            </button>
                        </div>
                    </div>
                `;
                feedMaster.insertAdjacentHTML('beforeend', postHTML);
            });
        }

        function renderProfileSections() {
            const profileData = JSON.parse(localStorage.getItem('xlink_profile')) || {};
            const myUsername = profileData.user || '@user';

            document.getElementById('followingCount').innerText = followingList.length;
            document.getElementById('followersCount').innerText = 0;

            const myPostsContainer = document.getElementById('profile-myposts');
            const likedPostsContainer = document.getElementById('profile-likedposts');

            let myPostsHTML = '';
            let likedPostsHTML = '';
            let myCount = 0;
            let likedCount = 0;

            globalPostsCache.forEach(post => {
                const isLiked = likedPostIds.includes(post.id);
                let imageHTML = post.image ? `<div class="rounded-xl overflow-hidden max-h-36 border border-slate-700/60 mt-2"><img src="${post.image}" class="w-full h-full object-cover"></div>` : '';
                let avatarBox = getAvatarHTML(post.avatar, post.name, "w-7 h-7", "text-xs");

                const isMyPost = (post.user === myUsername);
                const deleteBtnHTML = isMyPost ? `<button onclick="deletePost('${post.id}')" class="text-slate-500 hover:text-red-400 text-xs transition" title="ลบโพสต์">🗑️</button>` : '';

                const cardHTML = `
                    <div class="bg-slate-800/50 border border-slate-800 p-3 rounded-2xl space-y-2">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-2 cursor-pointer" onclick="viewUserProfile('${post.name}', '${post.user}', '${post.avatar || ''}')">
                                ${avatarBox}
                                <div>
                                    <span class="font-bold text-xs">${post.name}</span>
                                    <span class="text-[10px] text-slate-400 block">${post.user}</span>
                                </div>
                            </div>
                            ${deleteBtnHTML}
                        </div>
                        ${post.text ? `<p class="text-xs text-slate-200">${post.text}</p>` : ''}
                        ${imageHTML}
                        <div class="flex justify-between items-center pt-1 border-t border-slate-700/40 text-[11px] text-slate-400">
                            <button onclick="toggleLike('${post.id}', ${post.likes || 0})" class="flex items-center space-x-1 transition ${isLiked ? 'text-pink-500 font-bold' : 'text-slate-400 hover:text-pink-400'}">
                                <span>${isLiked ? '❤️' : '🤍'}</span> <span>${post.likes || 0}</span>
                            </button>
                            <button onclick="toggleRepost('${post.id}', ${post.reposts || 0})" class="flex items-center space-x-1 hover:text-green-400 transition text-slate-400">
                                <span>🔁</span> <span>${post.reposts || 0}</span>
                            </button>
                        </div>
                    </div>
                `;

                if (isMyPost) {
                    myPostsHTML += cardHTML;
                    myCount++;
                }

                if (isLiked) {
                    likedPostsHTML += cardHTML;
                    likedCount++;
                }
            });

            myPostsContainer.innerHTML = myCount > 0 ? myPostsHTML : '<div class="text-xs text-slate-500 text-center py-6">ยังไม่มีโพสต์ของคุณ</div>';
            likedPostsContainer.innerHTML = likedCount > 0 ? likedPostsHTML : '<div class="text-xs text-slate-500 text-center py-6">ยังไม่มีโพสต์ที่คุณกดใจ</div>';
            
            renderFollowingList();
        }

        function renderFollowingList() {
            const container = document.getElementById('followingListContainer');
            if (followingList.length === 0) {
                container.innerHTML = '<div class="text-xs text-slate-500 text-center py-6">คุณยังไม่ได้ติดตามใคร</div>';
                return;
            }
            let html = '';
            followingList.forEach(user => {
                html += `
                    <div class="flex items-center justify-between bg-slate-950 p-2.5 rounded-xl border border-slate-800">
                        <div class="flex items-center space-x-2 cursor-pointer flex-grow" onclick="closeFollowingModal(); viewUserProfile('${user.name}', '${user.username}', '')">
                            <div class="w-8 h-8 rounded-full bg-pink-600 flex items-center justify-center font-bold text-xs">${user.name.charAt(0)}</div>
                            <div>
                                <h4 class="text-xs font-bold">${user.name}</h4>
                                <p class="text-[10px] text-slate-400">${user.username}</p>
                            </div>
                        </div>
                        <button onclick="toggleFollowUser('${user.name}', '${user.username}')" class="text-[10px] px-2.5 py-1 bg-slate-800 hover:bg-red-900/50 text-slate-300 rounded-lg transition">เลิกติดตาม</button>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function renderTrendingHashtags() {
            const container = document.getElementById('trendingTagsContainer');
            const tagCounts = {};

            globalPostsCache.forEach(post => {
                if (post.tags) {
                    const foundTags = post.tags.match(/#[^\s#]+/g) || [];
                    foundTags.forEach(tag => {
                        tagCounts[tag] = (tagCounts[tag] || 0) + 1;
                    });
                }
            });

            const sortedTags = Object.entries(tagCounts).sort((a, b) => b[1] - a[1]).slice(0, 5);

            if (sortedTags.length === 0) {
                container.innerHTML = '<div class="text-xs text-slate-500 text-center py-4">ยังไม่มีแฮชแท็กยอดนิยมในระบบ</div>';
                return;
            }

            let html = '';
            sortedTags.forEach(([tag, count], index) => {
                html += `
                    <div onclick="filterByHashtag('${tag}')" class="p-3 bg-slate-800/40 hover:bg-slate-800 border border-slate-800 rounded-2xl cursor-pointer transition flex justify-between items-center">
                        <div class="flex items-center space-x-2">
                            <span class="text-xs font-bold text-slate-500">#${index + 1}</span>
                            <span class="text-sm font-semibold text-pink-400">${tag}</span>
                        </div>
                        <span class="text-[10px] text-slate-400">${count} โพสต์</span>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function openFollowingModal() { document.getElementById('followingModal').classList.remove('hidden'); }
        function closeFollowingModal() { document.getElementById('followingModal').classList.add('hidden'); }

        function openEditModal() {
            document.getElementById('inputName').value = document.getElementById('profileDisplayName').innerText;
            document.getElementById('inputUser').value = document.getElementById('profileUsername').innerText;
            document.getElementById('inputBio').value = document.getElementById('profileBio').innerText;
            document.getElementById('editModal').classList.remove('hidden');
        }
        function closeEditModal() { document.getElementById('editModal').classList.add('hidden'); }

        function saveProfile() {
            const name = document.getElementById('inputName').value.trim();
            const user = document.getElementById('inputUser').value.trim();
            const bio = document.getElementById('inputBio').value.trim();

            let profileData = JSON.parse(localStorage.getItem('xlink_profile')) || {};
            profileData.name = name || 'ชื่อบัญชี';
            profileData.user = user ? (user.startsWith('@') ? user : '@' + user) : '@username';
            profileData.bio = bio;

            localStorage.setItem('xlink_profile', JSON.stringify(profileData));
            loadProfileData();
            closeEditModal();
        }

        function loadProfileData() {
            const data = localStorage.getItem('xlink_profile');
            if (data) {
                const profile = JSON.parse(data);
                document.getElementById('profileDisplayName').innerText = profile.name;
                document.getElementById('profileUsername').innerText = profile.user;
                document.getElementById('profileInitial').innerText = profile.name.charAt(0).toUpperCase();

                const bioElement = document.getElementById('profileBio');
                if (profile.bio && profile.bio.trim() !== "") {
                    bioElement.innerText = profile.bio;
                    bioElement.classList.remove('hidden');
                } else {
                    bioElement.innerText = "";
                    bioElement.classList.add('hidden');
                }

                if (profile.avatar) {
                    document.getElementById('profileAvatarImg').src = profile.avatar;
                    document.getElementById('profileAvatarImg').classList.remove('hidden');
                    document.getElementById('profileInitial').classList.add('hidden');
                }
            } else {
                const defaultProfile = { name: "ชื่อบัญชี", user: "@username", avatar: "", bio: "" };
                localStorage.setItem('xlink_profile', JSON.stringify(defaultProfile));
            }
            renderProfileSections();
        }

        function handleSearchInput(query) {
            if (!query.trim()) {
                renderTrendingHashtags();
            } else {
                filterSearch(query.trim());
            }
        }

        function executeSearch() {
            const keyword = document.getElementById('searchInput').value.trim();
            if(!keyword) return;
            filterSearch(keyword);
        }

        function filterSearch(query) {
            const searchArea = document.getElementById('searchContentArea');
            let matchedHTML = `<div class="text-xs text-pink-400 font-semibold mb-2">ผลการค้นหา: "${query}"</div>`;

            const uniqueUsersMap = new Map();
            predefinedSystemUsers.forEach(u => {
                uniqueUsersMap.set(u.user, u);
            });
            globalPostsCache.forEach(post => {
                if (post.user && post.name) {
                    if (!uniqueUsersMap.has(post.user)) {
                        uniqueUsersMap.set(post.user, { name: post.name, user: post.user, avatar: post.avatar, following: 0, followers: 10 });
                    }
                }
            });
            const allUsersFromPosts = Array.from(uniqueUsersMap.values());

            let matchedUsers = allUsersFromPosts.filter(u => 
                (u.user && u.user.toLowerCase().includes(query.toLowerCase())) || 
                (u.name && u.name.toLowerCase().includes(query.toLowerCase()))
            );

            if (matchedUsers.length > 0) {
                matchedHTML += `<div class="text-[11px] text-slate-400 font-bold uppercase mb-1">บัญชีผู้ใช้ / ค่าย / ศิลปิน</div><div class="space-y-2 mb-4">`;
                matchedUsers.forEach(u => {
                    const isFollowing = followingList.some(item => item.username === u.user);
                    let avatarBox = getAvatarHTML(u.avatar, u.name, "w-8 h-8", "text-xs");
                    matchedHTML += `
                        <div class="flex items-center justify-between bg-slate-800/60 p-3 rounded-xl border border-slate-800">
                            <div class="flex items-center space-x-2 cursor-pointer flex-grow" onclick="viewUserProfile('${u.name}', '${u.user}', '${u.avatar || ''}')">
                                ${avatarBox}
                                <div>
                                    <h4 class="text-xs font-bold">${u.name}</h4>
                                    <p class="text-[10px] text-slate-400">${u.user}</p>
                                </div>
                            </div>
                            <button onclick="toggleFollowUser('${u.name}', '${u.user}')" class="text-[10px] px-3 py-1.5 rounded-xl font-bold transition flex-shrink-0 ${isFollowing ? 'bg-slate-700 text-slate-300 hover:bg-red-900/50' : 'bg-pink-600 text-white hover:bg-pink-500'}">
                                ${isFollowing ? 'กำลังติดตาม' : 'ติดตาม'}
                            </button>
                        </div>
                    `;
                });
                matchedHTML += `</div>`;
            }

            matchedHTML += `<div class="text-[11px] text-slate-400 font-bold uppercase mb-1">โพสต์ที่เกี่ยวข้อง</div><div class="space-y-3">`;
            let foundPostCount = 0;
            globalPostsCache.forEach(post => {
                const queryLower = query.toLowerCase();
                if ((post.tags && post.tags.toLowerCase().includes(queryLower)) || 
                    (post.text && post.text.toLowerCase().includes(queryLower)) || 
                    (post.name && post.name.toLowerCase().includes(queryLower)) || 
                    (post.user && post.user.toLowerCase().includes(queryLower))) {
                    
                    const isLiked = likedPostIds.includes(post.id);
                    let imageHTML = post.image ? `<div class="rounded-xl overflow-hidden max-h-36 border border-slate-700/60 mt-2"><img src="${post.image}" class="w-full h-full object-cover"></div>` : '';
                    let avatarBox = getAvatarHTML(post.avatar, post.name, "w-7 h-7", "text-xs");

                    matchedHTML += `
                        <div class="bg-slate-800/60 border border-slate-800 p-4 rounded-2xl space-y-2">
                            <div class="flex items-center space-x-2 cursor-pointer" onclick="viewUserProfile('${post.name}', '${post.user}', '${post.avatar || ''}')">
                                ${avatarBox}
                                <div>
                                    <span class="font-bold text-xs">${post.name}</span>
                                    <span class="text-[10px] text-slate-400 block">${post.user}</span>
                                </div>
                            </div>
                            ${post.text ? `<p class="text-xs text-slate-200">${post.text}</p>` : ''}
                            ${imageHTML}
                            <div class="flex justify-between items-center pt-1 border-t border-slate-700/40 text-[11px] text-slate-400">
                                <button onclick="toggleLike('${post.id}', ${post.likes || 0})" class="flex items-center space-x-1 transition ${isLiked ? 'text-pink-500 font-bold' : 'text-slate-400 hover:text-pink-400'}">
                                    <span>${isLiked ? '❤️' : '🤍'}</span> <span>${post.likes || 0}</span>
                                </button>
                                <button onclick="toggleRepost('${post.id}', ${post.reposts || 0})" class="flex items-center space-x-1 hover:text-green-400 transition text-slate-400">
                                    <span>🔁</span> <span>${post.reposts || 0}</span>
                                </button>
                            </div>
                        </div>
                    `;
                    foundPostCount++;
                }
            });

            if (foundPostCount === 0 && matchedUsers.length === 0) {
                matchedHTML += `<div class="text-xs text-slate-500 text-center py-6">ไม่พบผลการค้นหาที่ตรงกัน</div>`;
            }
            matchedHTML += `</div>`;
            searchArea.innerHTML = matchedHTML;
        }

        function filterByHashtag(query) {
            document.getElementById('searchInput').value = query;
            filterSearch(query);
        }
    </script>
</body>
</html>
