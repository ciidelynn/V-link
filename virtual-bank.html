<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual BANK - Premium Financial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Prompt', sans-serif; } </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-zinc-900 to-indigo-950 text-white min-h-screen flex justify-center items-center p-4">

    <div class="w-full max-w-md bg-slate-900/95 backdrop-blur-2xl border border-amber-500/30 rounded-[2.5rem] shadow-2xl overflow-hidden p-6 flex flex-col min-h-[750px] relative">
        
        <div class="flex justify-between items-center mb-5">
            <button onclick="window.location.href='home.html'" class="bg-slate-800/80 hover:bg-slate-700 px-4 py-2 rounded-2xl text-xs transition text-slate-300">← หน้าหลัก</button>
            <span class="text-[10px] font-bold text-amber-400 bg-amber-500/20 px-3 py-1 rounded-full border border-amber-500/30">VIRTUAL BANK</span>
        </div>

        <div class="bg-gradient-to-br from-slate-800 via-slate-900 to-indigo-950 p-5 rounded-3xl border border-amber-500/20 mb-5 shadow-xl relative overflow-hidden">
            <div class="flex justify-between items-start mb-2">
                <p class="text-[10px] text-amber-400/90 font-medium" id="displayName">เจ้าของบัญชี: กำลังโหลด...</p>
            </div>
            <p class="text-[10px] text-slate-400 uppercase tracking-widest">เลขบัญชี (10 หลัก)</p>
            <h2 id="myAccount" class="text-xl font-mono font-bold tracking-wider text-white mb-3">----------</h2>
            <p class="text-[10px] text-slate-400 uppercase tracking-widest">ยอดเงินคงเหลือ</p>
            <p class="text-2xl font-bold text-emerald-400 mt-0.5" id="myBalance">0 ฿</p>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-5">
            <button id="btnTransferTab" onclick="switchTab('transfer')" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 px-4 rounded-2xl text-xs transition shadow-lg shadow-amber-500/20 flex items-center justify-center gap-2">
                💸 โอนเงิน
            </button>
            <button id="btnContactTab" onclick="switchTab('contact')" class="bg-slate-800/80 hover:bg-slate-700 text-slate-300 font-bold py-3 px-4 rounded-2xl text-xs transition border border-slate-700/60 flex items-center justify-center gap-2">
                📖 สมุดรายชื่อ
            </button>
        </div>

        <div id="transferView" class="space-y-4 flex-1">
            <div class="bg-slate-800/40 border border-slate-700/50 p-5 rounded-3xl space-y-3">
                <h3 class="text-xs font-bold text-amber-400">⚡ ทำรายการโอนเงิน</h3>
                
                <div>
                    <label class="text-[10px] text-slate-400 mb-1 block">เลขบัญชีปลายทาง (10 หลัก)</label>
                    <input type="text" id="targetAcc" maxlength="10" placeholder="ระบุเลขบัญชี 10 หลัก" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-2xl text-xs text-white focus:outline-none focus:border-amber-500">
                </div>

                <div>
                    <label class="text-[10px] text-slate-400 mb-1 block">จำนวนเงิน (บาท)</label>
                    <input type="number" id="transferAmount" placeholder="0.00" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-2xl text-xs text-white focus:outline-none focus:border-amber-500">
                </div>
                
                <button onclick="executeTransfer()" id="transferBtn" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 py-3.5 rounded-2xl text-xs font-bold transition shadow-lg shadow-emerald-900/40 mt-2">ยืนยันการโอนเงิน</button>
            </div>
        </div>

        <div id="contactView" class="space-y-4 flex-1 hidden">
            <div class="bg-slate-800/40 border border-slate-700/50 p-5 rounded-3xl space-y-3">
                <div class="flex justify-between items-center">
                    <h3 class="text-xs font-bold text-amber-400">📖 บัญชีที่บันทึกไว้</h3>
                    <button onclick="openModal()" class="text-[10px] bg-amber-500/20 text-amber-400 border border-amber-500/30 px-3 py-1.5 rounded-xl font-bold hover:bg-amber-500/30 transition">+ เพิ่มรายชื่อ</button>
                </div>

                <div id="contactList" class="space-y-2.5 max-h-[250px] overflow-y-auto pr-1">
                    <p class="text-[11px] text-slate-400 text-center py-6">ยังไม่มีรายชื่อที่บันทึกไว้</p>
                </div>
            </div>
        </div>

    </div>

    <div id="contactModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex justify-center items-center p-4 z-50">
        <div class="w-full max-w-sm bg-slate-900 border border-amber-500/40 rounded-3xl p-6 space-y-4 shadow-2xl">
            <h3 class="text-sm font-bold text-amber-400">➕ เพิ่มบัญชีในสมุดรายชื่อ</h3>
            
            <div>
                <label class="text-[10px] text-slate-400 mb-1 block">1) ตั้งชื่อผู้รับเงิน (ชื่อที่คุณจำง่าย)</label>
                <input type="text" id="modalName" placeholder="เช่น พี่สาว, ร้านค้า" class="w-full px-4 py-3 bg-slate-950 border border-slate-700 rounded-2xl text-xs text-white focus:outline-none focus:border-amber-500">
            </div>

            <div>
                <label class="text-[10px] text-slate-400 mb-1 block">2) เลขบัญชีปลายทาง (10 หลัก)</label>
                <input type="text" id="modalAcc" maxlength="10" placeholder="เลขบัญชี 10 หลัก" class="w-full px-4 py-3 bg-slate-950 border border-slate-700 rounded-2xl text-xs text-white focus:outline-none focus:border-amber-500">
            </div>

            <div class="grid grid-cols-2 gap-3 pt-2">
                <button onclick="closeModal()" class="bg-slate-800 hover:bg-slate-700 py-3 rounded-2xl text-xs font-bold transition text-slate-300">ยกเลิก</button>
                <button onclick="saveContact()" class="bg-amber-500 hover:bg-amber-600 py-3 rounded-2xl text-xs font-bold transition text-slate-950">บันทึก</button>
            </div>
        </div>
    </div>

    <div id="cutePopup" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex justify-center items-center p-4 z-50">
        <div class="w-full max-w-xs bg-gradient-to-b from-amber-500/20 via-slate-900 to-slate-900 border border-amber-400/50 rounded-[2rem] p-6 text-center space-y-4 shadow-2xl
