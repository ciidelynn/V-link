<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store - V-link System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Prompt', sans-serif; } .scrollbar-hide::-webkit-scrollbar { display: none; }</style>
</head>
<body class="bg-zinc-950 text-white p-4 flex justify-center">

    <div class="w-full max-w-md bg-zinc-900 rounded-[2.5rem] p-6 min-h-[750px] shadow-2xl border border-zinc-800 flex flex-col">
        
        <!-- Header -->
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-bold text-red-500">🛒 STORE</h1>
            <div class="bg-zinc-800 px-4 py-1 rounded-full text-xs font-bold text-emerald-400">💰 ฿0</div>
        </div>

        <!-- Main Tabs -->
        <div class="grid grid-cols-3 gap-2 mb-6">
            <button onclick="renderStore('fanclub')" class="py-2 text-[10px] bg-zinc-800 rounded-xl font-bold">🛍️ Shop</button>
            <button onclick="renderStore('social')" class="py-2 text-[10px] bg-zinc-800 rounded-xl font-bold">👥 Social</button>
            <button onclick="renderStore('inventory')" class="py-2 text-[10px] bg-zinc-800 rounded-xl font-bold">📦 Inventory</button>
        </div>

        <!-- Content Area -->
        <div id="storeContent" class="flex-1 overflow-y-auto scrollbar-hide"></div>
    </div>

    <script>
        const storeData = {
            socialItems: [
                { name: 'S-link Fans', price: 100, desc: 'เพิ่มแฟนคลับให้ S-link' },
                { name: 'X-link Fans', price: 150, desc: 'เพิ่มแฟนคลับให้ X-link' },
                { name: 'U-link Fans', price: 200, desc: 'เพิ่มแฟนคลับให้ U-link' }
            ]
        };

        function renderStore(view) {
            const container = document.getElementById('storeContent');
            
            if (view === 'fanclub') {
                container.innerHTML = `<h2 class="text-sm font-bold mb-4">Fan Club Shop</h2><p class="text-zinc-500 text-xs text-center mt-10">กำลังโหลดสินค้าจากค่ายเพลง...</p>`;
            } 
            else if (view === 'social') {
                container.innerHTML = `<h2 class="text-sm font-bold mb-4">Social Shop</h2>` + 
                    storeData.socialItems.map(item => `
                        <div class="bg-zinc-800 p-4 rounded-2xl mb-3 flex justify-between items-center border border-zinc-700">
                            <div>
                                <p class="text-xs font-bold">${item.name}</p>
                                <p class="text-[9px] text-zinc-400">${item.desc}</p>
                            </div>
                            <button class="bg-red-600 px-4 py-2 rounded-xl text-[10px] font-bold">฿${item.price}</button>
                        </div>
                    `).join('');
            } 
            else if (view === 'inventory') {
                container.innerHTML = `<h2 class="text-sm font-bold mb-4">คลังสินค้าของคุณ</h2><p class="text-zinc-500 text-xs text-center mt-10">ยังไม่มีสินค้าในคลัง...</p>`;
            }
        }

        // เริ่มต้นให้แสดงหน้าแรก
        renderStore('fanclub');
    </script>
</body>
</html>
