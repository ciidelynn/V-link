<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store - V-link System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- นำเข้า Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style> 
        body { font-family: 'Prompt', sans-serif; } 
        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-zinc-950 text-white p-4 flex justify-center">

    <div class="w-full max-w-md bg-zinc-900 rounded-[2.5rem] p-6 min-h-[750px] shadow-2xl border border-zinc-800 flex flex-col">
        <!-- Header -->
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-bold text-red-500">🛒 STORE</h1>
            <div id="balanceDisplay" class="bg-zinc-800 px-4 py-1 rounded-full text-xs font-bold text-emerald-400">💰 ฿0</div>
        </div>

        <!-- Main Tabs -->
        <div class="grid grid-cols-3 gap-2 mb-6">
            <button onclick="renderStore('fanclub')" class="py-2 text-[10px] bg-zinc-800 rounded-xl font-bold">🛍️ Shop</button>
            <button onclick="renderStore('social')" class="py-2 text-[10px] bg-zinc-800 rounded-xl font-bold">👥 Social</button>
            <button onclick="renderStore('inventory')" class="py-2 text-[10px] bg-zinc-800 rounded-xl font-bold">📦 Inventory</button>
        </div>

        <div id="storeContent" class="flex-1 overflow-y-auto scrollbar-hide"></div>
    </div>

    <script>
        // ----------------------------------------------------
        // 1. ตั้งค่า Supabase (กรอก URL และ Anon Key ของคุณที่นี่)
        // ----------------------------------------------------
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const email = localStorage.getItem('userEmail');
        let userBalance = 0;
        let activeSocialTab = 'S-link';

        function updateBalanceDisplay(amount) {
            document.getElementById('balanceDisplay').innerText = `💰 ฿${Number(amount).toLocaleString()}`;
        }

        // 2. ดึงข้อมูลยอดเงิน Real-time จาก Supabase
        async function initUserData() {
            if (!email) {
                console.warn("ไม่พบ userEmail ใน localStorage");
                return;
            }

            // ดึงข้อมูลครั้งแรก
            const { data, error } = await supabase
                .from('users')
                .select('balance')
                .eq('email', email)
                .single();

            if (data) {
                userBalance = data.balance || 0;
                updateBalanceDisplay(userBalance);
            }

            // ติดตามการเปลี่ยนแปลง Realtime
            supabase
                .channel('public:users:store')
                .on('postgres_changes', { 
                    event: 'UPDATE', 
                    schema: 'public', 
                    table: 'users', 
                    filter: `email=eq.${email}` 
                }, (payload) => {
                    if (payload.new) {
                        userBalance = payload.new.balance || 0;
                        updateBalanceDisplay(userBalance);
                    }
                })
                .subscribe();
        }

        // 3. แสดงผลหน้า ร้านค้า / โซเชียล
        window.renderStore = async (view) => {
            const container = document.getElementById('storeContent');
            
            if (view === 'social') {
                const tabs = ['S-link', 'X-link', 'U-link'];
                container.innerHTML = `
                    <h2 class="text-sm font-bold mb-4">Social Shop</h2>
                    <div class="flex gap-2 mb-4">
                        ${tabs.map(t => `
                            <button onclick="changeSocialTab('${t}')" class="flex-1 py-1.5 text-[9px] font-bold rounded-xl ${activeSocialTab === t ? 'bg-red-600' : 'bg-zinc-800'}">
                                ${t}
                            </button>
                        `).join('')}
                    </div>
                `;

                if (activeSocialTab === 'S-link' || activeSocialTab === 'X-link') {
                    const options = [
                        { label: 'ซื้อ Followers 1 คน', count: 1, price: 100 },
                        { label: 'ซื้อ Followers 10 คน', count: 10, price: 1000 },
                        { label: 'ซื้อ Followers 100 คน', count: 100, price: 10000 },
                        { label: 'ซื้อ Followers 1,000 คน', count: 1000, price: 100000 },
                        { label: 'ซื้อ Followers 10,000 คน', count: 10000, price: 1000000 }
                    ];
                    
                    options.forEach(opt => {
                        container.innerHTML += `
                            <div class="bg-zinc-800 p-4 rounded-2xl mb-3 flex justify-between items-center border border-zinc-700">
                                <div>
                                    <p class="text-xs font-bold">${opt.label}</p>
                                    <p class="text-[9px] text-zinc-400">ราคา ฿${opt.price.toLocaleString()}</p>
                                </div>
                                <button onclick="buySocial('${activeSocialTab}', ${opt.count}, ${opt.price})" class="bg-red-600 px-4 py-2 rounded-xl text-[10px] font-bold hover:bg-red-700 transition">ซื้อ</button>
                            </div>
                        `;
                    });
                } else {
                    container.innerHTML += `<p class="text-zinc-500 text-xs text-center mt-10">อยู่ระหว่างการพัฒนา...</p>`;
                }

            } else {
                container.innerHTML = `<p class="text-zinc-500 text-xs text-center mt-10">อยู่ระหว่างการพัฒนา...</p>`;
            }
        };

        window.changeSocialTab = (tab) => {
            activeSocialTab = tab;
            renderStore('social');
        };

        // 4. ระบบการสั่งซื้อ Followers และตัดเงิน
        window.buySocial = async (target, count, price) => {
            if (!email) {
                alert("ไม่พบข้อมูลผู้ใช้ กรุณาเข้าสู่ระบบใหม่อีกครั้ง");
                return;
            }

            // ดึงข้อมูลผู้ใช้ล่าสุดเพื่อป้องกันปัญหา Race Condition
            const { data: user, error: fetchError } = await supabase
                .from('users')
                .select('*')
                .eq('email', email)
                .single();

            if (fetchError || !user) {
                alert("เกิดข้อผิดพลาดในการตรวจสอบข้อมูลผู้ใช้");
                return;
            }

            if (user.balance < price) { 
                alert("ยอดเงินในบัญชีธนาคารไม่พอครับ!"); 
                return; 
            }
            
            try {
                // กำหนดคอลัมน์ที่จะเก็บตามแพลตฟอร์ม
                let fieldName = (target === 'X-link') ? 'followers_x' : 'followers';

                // สร้างรายการ Followers จำลอง
                let fakeFollowers = [];
                const timestamp = Date.now();
                for(let i = 1; i <= count; i++) {
                    fakeFollowers.push(`${target.toLowerCase()}_follower_${timestamp}_${i}@store.system`);
                }

                // ดึงรายการ followers เดิมมาต่อเข้าด้วยกัน (ถ้ามี)
                const existingFollowers = Array.isArray(user[fieldName]) ? user[fieldName] : [];
                const updatedFollowers = [...existingFollowers, ...fakeFollowers];

                // อัปเดตข้อมูลยอดเงินและ Followers ใหม่ลงใน Supabase
                const { error: updateError } = await supabase
                    .from('users')
                    .update({ 
                        balance: user.balance - price,
                        [fieldName]: updatedFollowers
                    })
                    .eq('email', email);

                if (updateError) throw updateError;

                alert(`ซื้อ ${count} Followers สำหรับ ${target} สำเร็จ!`);
            } catch (error) {
                console.error("Buy Error:", error);
                alert("เกิดข้อผิดพลาดในการทำรายการ กรุณาลองใหม่อีกครั้ง");
            }
        };

        // เริ่มต้นทำงาน
        initUserData();
        renderStore('social');
    </script>
</body>
</html>
