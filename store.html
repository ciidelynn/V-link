<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store - V-link System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- นำเข้า Supabase JS SDK -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
        
        const SUPABASE_URL = 'https://pjapezytmawescgcbyxd.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_bAQw8ZRxU7djRR3w11vsfQ__ig0uUuX';
        
        window.supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
    </script>
    <style> 
        body { font-family: 'Prompt', sans-serif; } 
        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-zinc-950 text-white p-4 flex justify-center">

    <div class="w-full max-w-md bg-zinc-900 rounded-[2.5rem] p-6 min-h-[750px] shadow-2xl border border-zinc-800 flex flex-col">
        <!-- Header -->
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-bold text-red-500">🛒 STORE</h1>
            <div id="balanceDisplay" class="bg-zinc-800 px-4 py-1 rounded-full text-xs font-bold text-emerald-400">💰 ฿0</div>
        </div>

        <!-- Main Tabs -->
        <div class="grid grid-cols-3 gap-2 mb-6">
            <button onclick="renderStore('fanclub')" class="py-2 text-[10px] bg-zinc-800 rounded-xl font-bold">🛍️ Shop</button>
            <button onclick="renderStore('social')" class="py-2 text-[10px] bg-zinc-800 rounded-xl font-bold">👥 Social</button>
            <button onclick="renderStore('inventory')" class="py-2 text-[10px] bg-zinc-800 rounded-xl font-bold">📦 Inventory</button>
        </div>

        <div id="storeContent" class="flex-1 overflow-y-auto scrollbar-hide"></div>
    </div>

    <script>
        const email = localStorage.getItem('userEmail');
        let userBalance = 0;
        let activeSocialTab = 'S-link';

        function updateBalanceDisplay(amount) {
            document.getElementById('balanceDisplay').innerText = `💰 ฿${Number(amount).toLocaleString()}`;
        }

        async function initUserData() {
            if (!email) return;

            // ดึงยอดเงินเริ่มต้น
            const { data } = await supabase
                .from('users')
                .select('balance')
                .eq('email', email)
                .single();

            if (data) {
                userBalance = data.balance || 0;
                updateBalanceDisplay(userBalance);
            }

            // Realtime Update ยอดเงิน
            supabase
                .channel('users-channel')
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'users', filter: `email=eq.${email}` }, 
                payload => {
                    userBalance = payload.new.balance;
                    updateBalanceDisplay(userBalance);
                })
                .subscribe();
        }

        window.renderStore = async (view) => {
            const container = document.getElementById('storeContent');
            
            if (view === 'social') {
                const tabs = ['S-link', 'X-link', 'U-link'];
                container.innerHTML = `
                    <h2 class="text-sm font-bold mb-4">Social Shop</h2>
                    <div class="flex gap-2 mb-4">
                        ${tabs.map(t => `
                            <button onclick="changeSocialTab('${t}')" class="flex-1 py-1.5 text-[9px] font-bold rounded-xl ${activeSocialTab === t ? 'bg-red-600' : 'bg-zinc-800'}">
                                ${t}
                            </button>
                        `).join('')}
                    </div>
                `;

                if (activeSocialTab === 'S-link' || activeSocialTab === 'X-link') {
                    const options = [
                        { count: 1, price: 100 },
                        { count: 10, price: 1000 },
                        { count: 100, price: 10000 },
                        { count: 1000, price: 100000 },
                        { count: 10000, price: 1000000 }
                    ];
                    
                    options.forEach(opt => {
                        container.innerHTML += `
                            <div class="bg-zinc-800 p-4 rounded-2xl mb-3 flex justify-between items-center border border-zinc-700">
                                <div>
                                    <p class="text-xs font-bold">ซื้อ Followers ${opt.count.toLocaleString()} คน</p>
                                    <p class="text-[9px] text-zinc-400">ราคา ฿${opt.price.toLocaleString()}</p>
                                </div>
                                <button onclick="buySocial('${activeSocialTab}', ${opt.count}, ${opt.price})" class="bg-red-600 px-4 py-2 rounded-xl text-[10px] font-bold">ซื้อ</button>
                            </div>
                        `;
                    });
                }
            } else {
                container.innerHTML = `<p class="text-zinc-500 text-xs text-center mt-10">อยู่ระหว่างการพัฒนา...</p>`;
            }
        };

        window.changeSocialTab = (tab) => {
            activeSocialTab = tab;
            renderStore('social');
        };

        window.buySocial = async (target, count, price) => {
            if (userBalance < price) { alert("ยอดเงินไม่พอครับ!"); return; }
            
            try {
                const fieldName = (target === 'X-link') ? 'followers_x' : 'followers';
                
                // ดึงข้อมูลเดิมมาอัปเดต
                const { data: user } = await supabase.from('users').select(fieldName).eq('email', email).single();
                const currentList = user[fieldName] || [];
                const newList = [...currentList, ...Array.from({length: count}, () => `${target}_bot_${Date.now()}`)];

                await supabase.from('users').update({ 
                    balance: userBalance - price,
                    [fieldName]: newList
                }).eq('email', email);
                
                alert(`ซื้อ ${count} Followers สำหรับ ${target} สำเร็จ!`);
            } catch (e) {
                alert("เกิดข้อผิดพลาด");
            }
        };

        // เริ่มต้น
        setTimeout(() => {
            initUserData();
            renderStore('social');
        }, 500);
    </script>
</body>
</html>
