<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>U-Link - YouTube Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Prompt', sans-serif; } </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-zinc-900 to-red-950 text-white min-h-screen flex justify-center items-center p-4">

    <div class="w-full max-w-md bg-slate-900/95 backdrop-blur-2xl border border-red-500/30 rounded-[2.5rem] shadow-2xl overflow-hidden p-6 flex flex-col min-h-[750px] relative">
        
        <!-- Header -->
        <div class="flex justify-between items-center mb-5">
            <button onclick="window.location.href='home.html'" class="bg-slate-800/80 hover:bg-slate-700 px-4 py-2 rounded-2xl text-xs transition text-slate-300">← หน้าหลัก</button>
            <span class="text-[10px] font-bold text-red-400 bg-red-500/20 px-3 py-1 rounded-full border border-red-500/30">U-LINK STREAM</span>
        </div>

        <!-- Channel Info Card -->
        <div class="bg-gradient-to-br from-slate-800 via-slate-900 to-red-950 p-5 rounded-3xl border border-red-500/20 mb-5 shadow-xl relative overflow-hidden">
            <div class="flex justify-between items-center mb-2">
                <p class="text-[10px] text-red-400 font-medium" id="channelName">ช่อง: กำลังโหลด...</p>
                <button onclick="openUploadModal()" class="text-[10px] bg-red-500 hover:bg-red-600 text-white px-3 py-1.5 rounded-xl font-bold transition shadow-md shadow-red-900/50">+ ลงคลิปใหม่</button>
            </div>
            <div class="flex justify-between items-end mt-3">
                <div>
                    <p class="text-[10px] text-slate-400 uppercase tracking-widest">ผู้ติดตามทั้งหมด</p>
                    <p class="text-xl font-bold text-white mt-0.5" id="subCount">0</p>
                </div>
                <div class="text-right">
                    <p class="text-[10px] text-slate-400 uppercase tracking-widest">วิดีโอในช่อง</p>
                    <p class="text-xl font-bold text-red-400 mt-0.5" id="videoCount">0 คลิป</p>
                </div>
            </div>
        </div>

        <!-- Feed Navigation -->
        <div class="flex gap-2 mb-4">
            <button onclick="switchTab('feed')" id="btnFeedTab" class="flex-1 bg-red-500 text-white font-bold py-2.5 rounded-2xl text-xs transition shadow-lg shadow-red-500/20">📺 ฟีดวิดีโอ</button>
            <button onclick="switchTab('myVideos')" id="btnMyTab" class="flex-1 bg-slate-800 text-slate-300 font-bold py-2.5 rounded-2xl text-xs transition border border-slate-700/60">📁 ช่องของฉัน</button>
        </div>

        <!-- Main Content Area -->
        <div id="mainView" class="flex-1 overflow-y-auto space-y-3 pr-1 max-h-[420px]">
            <p class="text-[11px] text-slate-400 text-center py-10">กำลังโหลดฟีดวิดีโอ...</p>
        </div>

    </div>

    <!-- Modal อัปโหลดวิดีโอ / เพิ่มลิงก์ YouTube -->
    <div id="uploadModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex justify-center items-center p-4 z-50">
        <div class="w-full max-w-sm bg-slate-900 border border-red-500/40 rounded-3xl p-6 space-y-4 shadow-2xl">
            <h3 class="text-sm font-bold text-red-400">📹 อัปโหลดวิดีโอ (YouTube Embed)</h3>
            
            <div>
                <label class="text-[10px] text-slate-400 mb-1 block">ชื่อคลิปวิดีโอ</label>
                <input type="text" id="videoTitleInput" placeholder="เช่น Vlog เที่ยวคาเฟ่ 20 นาที" class="w-full px-4 py-3 bg-slate-950 border border-slate-700 rounded-2xl text-xs text-white focus:outline-none focus:border-red-500">
            </div>

            <div>
                <label class="text-[10px] text-slate-400 mb-1 block">ลิงก์ YouTube หรือ Video ID (เช่น dQw4w9WgXcQ)</label>
                <input type="text" id="videoUrlInput" placeholder="วางลิงก์ยูทูป หรือรหัสวิดีโอตรงนี้" class="w-full px-4 py-3 bg-slate-950 border border-slate-700 rounded-2xl text-xs text-white focus:outline-none focus:border-red-500">
            </div>

            <div class="grid grid-cols-2 gap-3 pt-2">
                <button onclick="closeUploadModal()" class="bg-slate-800 hover:bg-slate-700 py-3 rounded-2xl text-xs font-bold transition text-slate-300">ยกเลิก</button>
                <button onclick="publishVideo()" class="bg-red-500 hover:bg-red-600 py-3 rounded-2xl text-xs font-bold transition text-white">เผยแพร่</button>
            </div>
        </div>
    </div>

    <!-- Modal สำหรับดูวิดีโอ (Player) -->
    <div id="playerModal" class="fixed inset-0 bg-black/90 backdrop-blur-md hidden flex flex-col justify-center items-center p-4 z-50">
        <div class="w-full max-w-lg bg-slate-900 border border-red-500/30 rounded-[2rem] overflow-hidden shadow-2xl relative flex flex-col max-h-[90vh]">
            <div class="flex justify-between items-center p-4 bg-slate-950 border-b border-slate-800">
                <h4 id="playerTitle" class="text-xs font-bold text-white truncate pr-4">ชื่อวิดีโอ</h4>
                <button onclick="closePlayerModal()" class="text-slate-400 hover:text-white text-sm px-2 py-1 bg-slate-800 rounded-xl">✕ ปิด</button>
            </div>
            
            <!-- YouTube Embed Frame -->
            <div class="w-full aspect-video bg-black relative">
                <iframe id="youtubeIframe" class="w-full h-full" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>

            <div class="p-4 space-y-2 bg-slate-900/90 text-xs">
                <div class="flex justify-between text-slate-400 text-[11px]">
                    <span id="playerCreator">ช่อง: --</span>
                    <span id="playerViews" class="text-red-400 font-bold">👀 0 วิว</span>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, getDocs, addDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCskpROK3OC55EXjDP-ywMiuaOen-fwr2Y",
            projectId: "v-link-5d0c8"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const email = localStorage.getItem('userEmail');
        if (!email) {
            alert("กรุณาเข้าสู่ระบบก่อนใช้งาน U-Link");
            window.location.href = 'index.html';
        }

        const userRef = doc(db, "users", email);
        let currentTab = 'feed';
        let allVideos = [];

        window.openUploadModal = () => document.getElementById('uploadModal').classList.remove('hidden');
        window.closeUploadModal = () => {
            document.getElementById('uploadModal').classList.add('hidden');
            document.getElementById('videoTitleInput').value = '';
            document.getElementById('videoUrlInput').value = '';
        }

        window.closePlayerModal = () => {
            document.getElementById('playerModal').classList.add('hidden');
            document.getElementById('youtubeIframe').src = '';
        }

        window.switchTab = (tab) => {
            currentTab = tab;
            const btnFeed = document.getElementById('btnFeedTab');
            const btnMy = document.getElementById('btnMyTab');
            if (tab === 'feed') {
                btnFeed.className = "flex-1 bg-red-500 text-white font-bold py-2.5 rounded-2xl text-xs transition shadow-lg shadow-red-500/20";
                btnMy.className = "flex-1 bg-slate-800 text-slate-300 font-bold py-2.5 rounded-2xl text-xs transition border border-slate-700/60";
            } else {
                btnMy.className = "flex-1 bg-red-500 text-white font-bold py-2.5 rounded-2xl text-xs transition shadow-lg shadow-red-500/20";
                btnFeed.className = "flex-1 bg-slate-800 text-slate-300 font-bold py-2.5 rounded-2xl text-xs transition border border-slate-700/60";
            }
            renderVideos();
        }

        // ดึง Video ID จากลิงก์ YouTube ทุกรูปแบบ
        function extractYouTubeId(urlOrId) {
            if (!urlOrId) return '';
            if (urlOrId.length === 11 && !urlOrId.includes('/') && !urlOrId.includes('.')) return urlOrId;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = urlOrId.match(regExp);
            return (match && match[2].length === 11) ? match[2] : urlOrId;
        }

        async function initUlink() {
            const snap = await getDoc(userRef);
            if (snap.exists()) {
                const data = snap.data();
                document.getElementById('channelName').innerText = `ช่อง: ${email.split('@')[0]}`;
                // ถ้ายังไม่มีฟิลด์ subscribers ให้เซ็ตเริ่มต้นที่ 150 คน
                if (data.subscribers === undefined) {
                    await updateDoc(userRef, { subscribers: 150 });
                    document.getElementById('subCount').innerText = "150";
                } else {
                    document.getElementById('subCount').innerText = data.subscribers.toLocaleString();
                }
            }

            // โหลดรายการวิดีโอทั้งหมดจาก Firestore Collection "ulink_videos"
            const q = query(collection(db, "ulink_videos"), orderBy("createdAt", "desc"));
            onSnapshot(q, (snapshot) => {
                allVideos = [];
                snapshot.forEach((docSnap) => {
                    allVideos.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderVideos();
                updateMyVideoCount();
            });
        }

        function updateMyVideoCount() {
            const myVids = allVideos.filter(v => v.creator === email);
            document.getElementById('videoCount').innerText = `${myVids.length} คลิป`;
        }

        window.publishVideo = async () => {
            const title = document.getElementById('videoTitleInput').value.trim();
            const rawUrl = document.getElementById('videoUrlInput').value.trim();

            if (!title) return alert("กรุณากรอกชื่อคลิปวิดีโอ");
            const videoId = extractYouTubeId(rawUrl);
            if (!videoId) return alert("ลิงก์หรือรหัส YouTube ไม่ถูกต้อง");

            try {
                await addDoc(collection(db, "ulink_videos"), {
                    title: title,
                    videoId: videoId,
                    creator: email,
                    creatorName: email.split('@')[0],
                    views: Math.floor(Math.random() * 50) + 10, // วิวเริ่มต้นสุ่มเล็กน้อย
                    createdAt: Date.now()
                });
                closeUploadModal();
                alert("🎉 เผยแพร่วิดีโอสำเร็จ!");
            } catch (error) {
                console.error(error);
                alert("❌ เกิดข้อผิดพลาดในการลงคลิป");
            }
        }

        function renderVideos() {
            const container = document.getElementById('mainView');
            let displayList = allVideos;

            if (currentTab === 'myVideos') {
                displayList = allVideos.filter(v => v.creator === email);
            }

            if (displayList.length === 0) {
                container.innerHTML = `<p class="text-[11px] text-slate-400 text-center py-10">ยังไม่มีวิดีโอในหมวดนี้</p>`;
                return;
            }

            container.innerHTML = displayList.map(v => `
                <div onclick="playVideo('${v.videoId}', '${v.title.replace(/'/g, "")}', '${v.creatorName}', ${v.views})" class="bg-slate-800/50 hover:bg-slate-800 border border-slate-700/60 p-3 rounded-2xl flex gap-3 cursor-pointer transition group">
                    <div class="w-28 aspect-video bg-black rounded-xl overflow-hidden relative flex-shrink-0">
                        <img src="https://img.youtube.com/vi/${v.videoId}/hqdefault.jpg" class="w-full h-full object-cover group-hover:scale-105 transition">
                    </div>
                    <div class="flex-1 flex flex-col justify-between py-0.5">
                        <div>
                            <h4 class="text-xs font-bold text-white line-clamp-2 group-hover:text-red-400 transition">${v.title}</h4>
                            <p class="text-[10px] text-slate-400 mt-0.5">${v.creatorName}</p>
                        </div>
                        <p class="text-[10px] text-red-400 font-medium">👀 ${v.views.toLocaleString()} วิว</p>
                    </div>
                </div>
            `).join('');
        }

        window.playVideo = (videoId, title, creator, views) => {
            document.getElementById('playerTitle').innerText = title;
            document.getElementById('playerCreator').innerText = `ช่อง: ${creator}`;
            document.getElementById('playerViews').innerText = `👀 ${views.toLocaleString()} วิว`;
            document.getElementById('youtubeIframe').src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
            document.getElementById('playerModal').classList.remove('hidden');
        }

        // ระบบจำลองยอดวิววิ่งแบบเรียลไทม์ (อิงตาม Subscriptions ของผู้ใช้)
        async function startRealtimeViews() {
            const snap = await getDoc(userRef);
            let subs = 150;
            if (snap.exists() && snap.data().subscribers) {
                subs = snap.data().subscribers;
            }

            // ยิ่งซับเยอะ วิวจะยิ่งบวกไวขึ้นตามสัดส่วน
            setInterval(() => {
                if (allVideos.length > 0) {
                    // สุ่มเลือกคลิปมาเพิ่มวิว
                    const randomIndex = Math.floor(Math.random() * allVideos.length);
                    const targetVideo = allVideos[randomIndex];
                    
                    // คำนวณจำนวนวิวที่จะเด้งขึ้น (สอดคล้องกับยอดผู้ติดตาม)
                    const increment = Math.max(1, Math.floor(subs / 50) + Math.floor(Math.random() * 5));
                    targetVideo.views += increment;

                    // อัปเดต UI ถ้ากำลังเปิดดูคลิปนั้นอยู่
                    const playerModal = document.getElementById('playerModal');
                    if (!playerModal.classList.contains('hidden')) {
                        // อัปเดตตัวเลขใน modal ถ้าตรงกัน
                        document.getElementById('playerViews').innerText = `👀 ${targetVideo.views.toLocaleString()} วิว`;
                    }
                    renderVideos();
                }
            }, 4000); // อัปเดตทุกๆ 4 วินาที
        }

        initUlink();
        setTimeout(startRealtimeViews, 2000);
    </script>
</body>
</html>
