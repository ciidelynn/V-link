<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>U-Link - Supabase Pro Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style> 
        body { font-family: 'Prompt', sans-serif; } 
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        @keyframes popUp {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop { animation: popUp 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-zinc-900 to-red-950 text-white min-h-screen flex justify-center p-4">

    <div class="w-full max-w-md bg-zinc-900/90 backdrop-blur-xl border border-zinc-800 rounded-[2.5rem] shadow-2xl p-5 flex flex-col min-h-[750px]">
        <div class="flex justify-between items-center mb-5">
            <button onclick="window.location.href='home.html'" class="text-xs text-zinc-400">← กลับ</button>
            <span class="text-[10px] font-bold text-red-500 bg-red-500/10 px-3 py-1 rounded-full border border-red-500/20">U-LINK SUPABASE</span>
        </div>

        <div class="flex gap-2 mb-5">
            <input type="text" id="searchInput" placeholder="ค้นหาคลิป หรือ ศิลปิน..." oninput="renderContent()" class="flex-1 px-4 py-3 bg-zinc-800 rounded-2xl text-xs border border-zinc-700 focus:outline-none focus:border-red-500">
            <button onclick="renderContent()" class="bg-red-600 px-4 rounded-2xl text-xs font-bold">ค้นหา</button>
        </div>

        <div class="flex gap-2 mb-5">
            <button onclick="switchView('feed')" id="tabFeed" class="flex-1 py-2.5 rounded-xl text-xs font-bold bg-zinc-800">🏠 ฟีด</button>
            <button onclick="switchView('myChannel')" id="tabMy" class="flex-1 py-2.5 rounded-xl text-xs font-bold bg-zinc-800">👤 ช่องของฉัน</button>
        </div>

        <div id="mainContent" class="flex-1 overflow-y-auto scrollbar-hide space-y-4"></div>
    </div>

    <!-- ป๊อปอัปตั้งชื่อช่อง -->
    <div id="namePopup" class="fixed inset-0 bg-black/60 hidden flex justify-center items-center z-50 p-4">
        <div class="bg-zinc-800 p-6 rounded-3xl w-full max-w-xs text-center border border-zinc-700 shadow-2xl animate-pop">
            <h3 class="text-sm font-bold mb-4">✨ ตั้งชื่อช่องของคุณ</h3>
            <input type="text" id="newNameInput" placeholder="พิมพ์ชื่อช่อง..." class="w-full px-4 py-3 bg-zinc-950 rounded-2xl text-xs mb-4 border border-zinc-700 outline-none focus:border-red-500">
            <div class="flex gap-2">
                <button onclick="closePopup()" class="flex-1 py-2 bg-zinc-700 rounded-xl text-xs">ยกเลิก</button>
                <button onclick="saveChannelName()" class="flex-1 py-2 bg-red-600 rounded-xl text-xs font-bold">ตกลง</button>
            </div>
        </div>
    </div>

    <!-- ป๊อปอัปสำหรับลงคลิปใหม่ -->
    <div id="uploadPopup" class="fixed inset-0 bg-black/60 hidden flex justify-center items-center z-50 p-4">
        <div class="bg-zinc-800 p-6 rounded-3xl w-full max-w-xs border border-zinc-700 shadow-2xl animate-pop">
            <h3 class="text-sm font-bold mb-4 text-center">📹 ลงคลิปวิดีโอใหม่</h3>
            <div class="space-y-3 mb-4">
                <div>
                    <label class="text-[10px] text-zinc-400 mb-1 block">ชื่อวิดีโอ</label>
                    <input type="text" id="uploadTitle" placeholder="เช่น เพลงใหม่ล่าสุด..." class="w-full px-3 py-2 bg-zinc-950 rounded-xl text-xs border border-zinc-700 outline-none focus:border-red-500">
                </div>
                <div>
                    <label class="text-[10px] text-zinc-400 mb-1 block">YouTube Video ID (เช่น dQw4w9WgXcQ)</label>
                    <input type="text" id="uploadVideoId" placeholder="รหัสวิดีโอ YouTube..." class="w-full px-3 py-2 bg-zinc-950 rounded-xl text-xs border border-zinc-700 outline-none focus:border-red-500">
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="closeUploadPopup()" class="flex-1 py-2 bg-zinc-700 rounded-xl text-xs">ยกเลิก</button>
                <button onclick="submitUploadVideo()" class="flex-1 py-2 bg-red-600 rounded-xl text-xs font-bold">อัปโหลด</button>
            </div>
        </div>
    </div>

    <!-- Cute Custom Modal (ป๊อปอัปน่ารักๆ แทน alert) -->
    <div id="cuteModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex justify-center items-center z-[100] p-4">
        <div class="bg-zinc-900 border border-zinc-700 w-full max-w-xs rounded-[2rem] p-6 text-center shadow-2xl animate-pop relative">
            <div id="modalIcon" class="text-4xl mb-3">✨</div>
            <h3 id="modalTitle" class="text-sm font-bold text-white mb-1">หัวข้อแจ้งเตือน</h3>
            <p id="modalDesc" class="text-xs text-zinc-300 mb-5 leading-relaxed">รายละเอียด...</p>
            <button id="modalBtnOk" onclick="closeCuteModal()" class="w-full py-2.5 bg-red-600 hover:bg-red-500 rounded-xl text-xs font-bold transition shadow-lg shadow-red-900/30">ตกลง</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://pjapezytmawescgcbyxd.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_bAQw8ZRxU7djRR3w11vsfQ__ig0uUuX';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const email = localStorage.getItem('userEmail') || localStorage.getItem('user') || 'user@simulator.com';
        let allVideos = [];
        let userData = { channelName: email.split('@')[0], followers_u: [], lastClaimedViews: 0 };
        let currentView = 'feed';
        let currentPlayingVideo = null;

        window.addEventListener('DOMContentLoaded', async () => {
            await initSupabase();
        });

        function showCuteModal(title, desc, icon = '✨', onOk = null) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalDesc').innerText = desc;
            document.getElementById('modalIcon').innerText = icon;
            document.getElementById('modalBtnOk').onclick = () => {
                closeCuteModal();
                if(onOk) onOk();
            };
            document.getElementById('cuteModal').classList.remove('hidden');
        }

        function closeCuteModal() {
            document.getElementById('cuteModal').classList.add('hidden');
        }

        async function init() {
            let { data: userDoc, error } = await supabaseClient.from("users").select("*").eq("email", email).single();
            if (!userDoc) {
                let { data: userDocAlt } = await supabaseClient.from("users").select("*").eq("user", email).single();
                userDoc = userDocAlt;
            }

            if (!userDoc) {
                const newUserData = {
                    email: email,
                    user: email,
                    name: userData.channelName,
                    channelName: userData.channelName,
                    followers_u: [],
                    lastClaimedViews: 0
                };
                let { data: insertedData, error: insertError } = await supabaseClient.from("users").insert([newUserData]).select().single();
                if(!insertError && insertedData) {
                    userData = insertedData;
                }
            } else {
                userData = userDoc;
                if(!userData.channelName) userData.channelName = email.split('@')[0];
            }

            fetchVideos();

            supabaseClient.channel('public:users-ulink')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'users', filter: `email=eq.${email}` }, payload => {
                    if (payload.new) {
                        userData = payload.new;
                        if(currentView === 'myChannel') renderContent();
                    }
                })
                .on('postgres_changes', { event: '*', schema: 'public', table: 'users', filter: `user=eq.${email}` }, payload => {
                    if (payload.new) {
                        userData = payload.new;
                        if(currentView === 'myChannel') renderContent();
                    }
                })
                .subscribe();

            supabaseClient.channel('public:ulink_videos')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'ulink_videos' }, payload => {
                    fetchVideos();
                })
                .subscribe();
        }

        async function initSupabase() {
            await init();
        }

        async function fetchVideos() {
            let { data, error } = await supabaseClient.from("ulink_videos").select("*");
            if (!error && data) {
                allVideos = data;
                renderContent();
            }
        }

        window.playVideo = (v) => {
            currentPlayingVideo = v;
            fetchComments(v.id || v.videoId);
            renderVideoView();
        };

        async function fetchComments(videoId) {
            let { data, error } = await supabaseClient.from("ulink_comments").select("*").eq("video_id", videoId).order("created_at", { ascending: false });
            if (!error) {
                renderCommentsList(data || []);
            }
        }

        function renderCommentsList(comments) {
            const listEl = document.getElementById('commentList');
            if(!listEl) return;
            listEl.innerHTML = comments.map(c => c.isSuperChat ? `
                <div class="bg-gradient-to-r from-amber-900 to-yellow-900 p-3 rounded-2xl border border-yellow-500 mb-2">
                    <div class="flex justify-between text-[10px] text-yellow-300 font-bold mb-1">
                        <span>${c.creatorName}</span>
                        <span>💰 ฿${c.amount}</span>
                    </div>
                    <p class="text-[11px] text-white">${c.text}</p>
                </div>` : `
                <div class="bg-zinc-800 p-3 rounded-2xl mb-2">
                    <p class="text-[9px] font-bold text-red-400">${c.creatorName}</p>
                    <p class="text-[10px] text-zinc-300">${c.text}</p>
                </div>`).join('');
        }

        window.renderVideoView = () => {
            const v = currentPlayingVideo;
            const likesArr = v.likes || [];
            const isLiked = likesArr.includes(email);
            const targetVideoId = v.id || v.videoId;
            
            document.getElementById('mainContent').innerHTML = `
                <button onclick="currentPlayingVideo=null; renderContent();" class="text-xs text-zinc-400 mb-2">← ย้อนกลับ</button>
                <div class="aspect-video w-full bg-black rounded-2xl overflow-hidden mb-4"><iframe class="w-full h-full" src="https://www.youtube.com/embed/${v.videoId}?autoplay=1" allowfullscreen></iframe></div>
                <h2 class="text-sm font-bold mb-4">${v.title}</h2>
                <button onclick="toggleLike('${targetVideoId}')" class="w-full py-2 mb-4 rounded-xl text-xs font-bold ${isLiked ? 'bg-red-600' : 'bg-zinc-800'}">👍 Like (${likesArr.length})</button>
                
                <div class="bg-zinc-800 p-4 rounded-2xl mb-4 border border-zinc-700">
                    <p class="text-[10px] text-yellow-500 font-bold mb-2">🎁 ส่ง Super Chat</p>
                    <input type="number" id="amtInput" placeholder="ระบุจำนวนเงิน (฿)" class="w-full bg-zinc-950 p-2 rounded-xl text-[10px] mb-2 text-white">
                    <textarea id="msgInput" placeholder="ข้อความ..." class="w-full bg-zinc-950 p-2 rounded-xl text-[10px] mb-2 text-white"></textarea>
                    <button onclick="postSuperChat('${targetVideoId}')" class="w-full bg-yellow-600 py-2 rounded-xl text-[10px] font-bold">ส่ง Super Chat</button>
                </div>

                <div id="commentList" class="max-h-60 overflow-y-auto scrollbar-hide"></div>
                <div class="flex gap-2 mt-2">
                    <input id="commentInput" class="flex-1 bg-zinc-800 p-2 rounded-xl text-[10px] text-white" placeholder="แสดงความคิดเห็น...">
                    <button onclick="postComment('${targetVideoId}')" class="bg-red-600 px-4 rounded-xl text-[10px]">ส่ง</button>
                </div>`;
            fetchComments(targetVideoId);
        };

        window.postSuperChat = async (id) => {
            const amount = document.getElementById('amtInput').value;
            const text = document.getElementById('msgInput').value;
            if(!amount || !text) return;
            
            await supabaseClient.from("ulink_comments").insert([{
                video_id: id,
                text: text,
                amount: parseFloat(amount),
                creatorName: userData.channelName || email.split('@')[0],
                isSuperChat: true,
                created_at: new Date().toISOString()
            }]);
            document.getElementById('amtInput').value = '';
            document.getElementById('msgInput').value = '';
            fetchComments(id);
        };

        window.postComment = async (id) => {
            const text = document.getElementById('commentInput').value;
            if(!text) return;
            
            await supabaseClient.from("ulink_comments").insert([{
                video_id: id,
                text: text,
                amount: 0,
                creatorName: userData.channelName || email.split('@')[0],
                isSuperChat: false,
                created_at: new Date().toISOString()
            }]);
            document.getElementById('commentInput').value = '';
            fetchComments(id);
        };

        window.toggleLike = async (id) => {
            let targetVideo = allVideos.find(v => (v.id === id || v.videoId === id));
            if(!targetVideo) return;
            let likes = targetVideo.likes || [];
            
            if(likes.includes(email)) {
                likes = likes.filter(e => e !== email);
            } else {
                likes.push(email);
            }

            await supabaseClient.from("ulink_videos").update({ likes: likes }).eq('id', targetVideo.id);
            fetchVideos();
        };

        window.claimEarnings = async () => {
            const myVideos = allVideos.filter(v => v.Creator === email || v.creator === email);
            const totalViews = myVideos.reduce((sum, v) => sum + (v.views || 1500), 0);
            
            await supabaseClient.from("users").update({ lastClaimedViews: totalViews }).eq('email', email);
            await supabaseClient.from("users").update({ lastClaimedViews: totalViews }).eq('user', email);
            
            userData.lastClaimedViews = totalViews;
            renderContent();
            showCuteModal('สำเร็จ! 🎉', 'กดรับเงินเข้าธนาคารเรียบร้อยแล้วจ้า', '💸');
        };

        window.switchView = (v) => { currentView = v; renderContent(); };
        window.openPopup = () => document.getElementById('namePopup').classList.remove('hidden');
        window.closePopup = () => document.getElementById('namePopup').classList.add('hidden');
        
        window.openUploadPopup = () => document.getElementById('uploadPopup').classList.remove('hidden');
        window.closeUploadPopup = () => document.getElementById('uploadPopup').classList.add('hidden');

        window.submitUploadVideo = async () => {
            const title = document.getElementById('uploadTitle').value.trim();
            const videoId = document.getElementById('uploadVideoId').value.trim();
            if(!title || !videoId) {
                showCuteModal('แจ้งเตือน', 'กรุณากรอกข้อมูลให้ครบถ้วน', '⚠️');
                return;
            }

            let { error } = await supabaseClient.from("ulink_videos").insert([{
                title: title,
                videoId: videoId,
                creator: email,
                creatorName: userData.channelName || email.split('@')[0],
                likes: [],
                views: Math.floor(Math.random() * 2000) + 500
            }]);

            if(!error) {
                closeUploadPopup();
                document.getElementById('uploadTitle').value = '';
                document.getElementById('uploadVideoId').value = '';
                showCuteModal('สำเร็จ! 🎉', 'ลงคลิปวิดีโอเรียบร้อยแล้ว', '📹');
                fetchVideos();
            } else {
                showCuteModal('เกิดข้อผิดพลาด', error.message, '❌');
            }
        };
        
        window.saveChannelName = async () => {
            const val = document.getElementById('newNameInput').value.trim();
            if(val) { 
                await supabaseClient.from("users").update({ channelName: val, name: val }).eq('email', email);
                await supabaseClient.from("users").update({ channelName: val, name: val }).eq('user', email);
                userData.channelName = val; 
                closePopup(); 
                renderContent(); 
            }
        };

        window.renderContent = () => {
            if (currentPlayingVideo) { renderVideoView(); return; }
            const container = document.getElementById('mainContent');
            const keyword = document.getElementById('searchInput') ? document.getElementById('searchInput').value.toLowerCase() : '';

            const tabFeedEl = document.getElementById('tabFeed');
            const tabMyEl = document.getElementById('tabMy');
            if(tabFeedEl && tabMyEl) {
                if(currentView === 'feed') {
                    tabFeedEl.className = 'flex-1 py-2.5 rounded-xl text-xs font-bold bg-red-600 text-white shadow-lg shadow-red-900/40';
                    tabMyEl.className = 'flex-1 py-2.5 rounded-xl text-xs font-bold bg-zinc-800 text-zinc-400 hover:bg-zinc-700';
                } else {
                    tabFeedEl.className = 'flex-1 py-2.5 rounded-xl text-xs font-bold bg-zinc-800 text-zinc-400 hover:bg-zinc-700';
                    tabMyEl.className = 'flex-1 py-2.5 rounded-xl text-xs font-bold bg-red-600 text-white shadow-lg shadow-red-900/40';
                }
            }

            if (currentView === 'feed') {
                const filtered = allVideos.filter(v => v.title.toLowerCase().includes(keyword) || (v.creatorName && v.creatorName.toLowerCase().includes(keyword)));
                
                container.innerHTML = filtered.length > 0 ? filtered.map(v => `
                    <div onclick='playVideo(${JSON.stringify(v)})' class="bg-zinc-800/50 p-3 rounded-2xl flex gap-3 border border-zinc-700 cursor-pointer hover:bg-zinc-800 transition">
                        <img src="https://img.youtube.com/vi/${v.videoId}/mqdefault.jpg" class="w-24 h-16 rounded-lg object-cover">
                        <div class="flex-1"><p class="text-xs font-bold line-clamp-2">${v.title}</p><p class="text-[10px] text-zinc-400 mt-1">${v.creatorName || 'ช่องทั่วไป'}</p></div>
                    </div>`).join('') : '<div class="text-xs text-zinc-500 text-center py-10">ไม่พบวิดีโอที่ค้นหา</div>';
            } else {
                const myVideos = allVideos.filter(v => v.Creator === email || v.creator === email);
                const totalViews = myVideos.reduce((sum, v) => sum + (v.views || 2500), 0);
                const lastClaimed = userData.lastClaimedViews || 0;
                const unclaimedViews = Math.max(0, totalViews - lastClaimed);
                const earnedMoney = (unclaimedViews / 1000).toFixed(2);
                
                const followers = Array.isArray(userData.followers_u) ? userData.followers_u : [];
                const totalFollowersCount = followers.length;

                container.innerHTML = `
                    <div class="text-center bg-zinc-800 p-5 rounded-3xl mb-4 border border-zinc-700">
                        <h2 class="text-xl font-bold">${userData.channelName || email.split('@')[0]}</h2>
                        <div class="flex justify-center items-center gap-2 mt-1">
                            <p class="text-[11px] text-red-400 font-bold">${totalFollowersCount.toLocaleString()} ผู้ติดตาม</p>
                        </div>
                        <button onclick="openPopup()" class="mt-3 text-[9px] bg-zinc-700 px-4 py-1 rounded-full text-zinc-300">✏️ แก้ไขชื่อช่อง</button>
                    </div>

                    <button onclick="openUploadPopup()" class="w-full py-3 bg-red-600 hover:bg-red-500 rounded-2xl text-xs font-bold transition shadow-lg shadow-red-900/30 flex justify-center items-center gap-2 mb-4">
                        📹 ลงคลิปวิดีโอใหม่
                    </button>

                    <div class="bg-gradient-to-br from-zinc-800 to-zinc-900 p-5 rounded-3xl border border-zinc-700 shadow-xl space-y-3">
                        <div class="flex justify-between items-center">
                            <span class="text-xs font-bold text-zinc-300">📊 สถิติและรายได้ช่อง</span>
                            <span class="text-[10px] bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded-full border border-emerald-500/20">1,000 วิว = 1 ฿</span>
                        </div>
                        <div class="flex justify-between text-xs py-2 border-y border-zinc-700/50">
                            <span class="text-zinc-400">ยอดวิวที่ยังไม่เคลียร์</span>
                            <span class="font-bold text-white">${unclaimedViews.toLocaleString()} วิว</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-xs text-zinc-400">รายได้สะสม</span>
                            <span class="text-base font-extrabold text-emerald-400">฿${earnedMoney}</span>
                        </div>
                        <button onclick="claimEarnings()" class="w-full mt-2 py-2.5 bg-emerald-600 hover:bg-emerald-500 rounded-xl text-xs font-bold transition shadow-lg shadow-emerald-900/20">
                            💸 กดรับเงินเข้าธนาคาร
                        </button>
                    </div>`;
            }
        };
    </script>
</body>
</html>
