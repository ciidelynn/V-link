<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>U-Link - Supabase Pro Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style> 
        body { font-family: 'Prompt', sans-serif; } 
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        @keyframes popUp {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop { animation: popUp 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-zinc-900 to-red-950 text-white min-h-screen flex justify-center p-4">

    <div class="w-full max-w-md bg-zinc-900/90 backdrop-blur-xl border border-zinc-800 rounded-[2.5rem] shadow-2xl p-5 flex flex-col min-h-[750px]">
        <div class="flex justify-between items-center mb-5">
            <button onclick="window.location.href='home.html'" class="text-xs text-zinc-400">← กลับ</button>
            <span class="text-[10px] font-bold text-red-500 bg-red-500/10 px-3 py-1 rounded-full border border-red-500/20">U-LINK STEAM</span>
        </div>

        <div class="flex gap-2 mb-5">
            <input type="text" id="searchInput" placeholder="ค้นหาคลิป หรือ ศิลปิน..." oninput="renderContent()" class="flex-1 px-4 py-3 bg-zinc-800 rounded-2xl text-xs border border-zinc-700 focus:outline-none focus:border-red-500">
            <button onclick="renderContent()" class="bg-red-600 px-4 rounded-2xl text-xs font-bold">ค้นหา</button>
        </div>

        <div class="flex gap-2 mb-5">
            <button onclick="switchView('feed')" id="tabFeed" class="flex-1 py-2.5 rounded-xl text-xs font-bold bg-zinc-800">🏠 ฟีด</button>
            <button onclick="switchView('myChannel')" id="tabMy" class="flex-1 py-2.5 rounded-xl text-xs font-bold bg-zinc-800">👤 ช่องของฉัน</button>
        </div>

        <div id="mainContent" class="flex-1 overflow-y-auto scrollbar-hide space-y-4"></div>
    </div>

    <!-- ป๊อปอัปตั้งชื่อช่อง -->
    <div id="namePopup" class="fixed inset-0 bg-black/60 hidden flex justify-center items-center z-50 p-4">
        <div class="bg-zinc-800 p-6 rounded-3xl w-full max-w-xs text-center border border-zinc-700 shadow-2xl animate-pop">
            <h3 class="text-sm font-bold mb-4">✨ ตั้งชื่อช่องของคุณ</h3>
            <input type="text" id="newNameInput" placeholder="พิมพ์ชื่อช่อง..." class="w-full px-4 py-3 bg-zinc-950 rounded-2xl text-xs mb-4 border border-zinc-700 outline-none focus:border-red-500 text-white">
            <div class="flex gap-2">
                <button onclick="closePopup()" class="flex-1 py-2 bg-zinc-700 rounded-xl text-xs">ยกเลิก</button>
                <button onclick="saveChannelName()" class="flex-1 py-2 bg-red-600 rounded-xl text-xs font-bold">ตกลง</button>
            </div>
        </div>
    </div>

    <!-- ป๊อปอัปสำหรับอัปโหลดวิดีโอและรูปปกจากในเครื่อง -->
    <div id="uploadPopup" class="fixed inset-0 bg-black/60 hidden flex justify-center items-center z-50 p-4">
        <div class="bg-zinc-800 p-6 rounded-3xl w-full max-w-xs border border-zinc-700 shadow-2xl animate-pop">
            <h3 class="text-sm font-bold mb-4 text-center">📹 อัปโหลดวิดีโอและรูปปก</h3>
            <div class="space-y-3 mb-4">
                <div>
                    <label class="text-[10px] text-zinc-400 mb-1 block">ชื่อวิดีโอ</label>
                    <input type="text" id="uploadTitle" placeholder="เช่น Vlog เที่ยวคาเฟ่..." class="w-full px-3 py-2 bg-zinc-950 rounded-xl text-xs border border-zinc-700 outline-none focus:border-red-500 text-white">
                </div>
                <div>
                    <label class="text-[10px] text-zinc-400 mb-1 block">เลือกรูปภาพปก (Thumbnail)</label>
                    <input type="file" id="thumbnailFileInput" accept="image/*" class="w-full px-3 py-2 bg-zinc-950 rounded-xl text-[10px] border border-zinc-700 outline-none focus:border-red-500 text-zinc-300 file:mr-2 file:py-1 file:px-2 file:rounded-lg file:border-0 file:text-[10px] file:font-semibold file:bg-red-600 file:text-white hover:file:bg-red-500">
                </div>
                <div>
                    <label class="text-[10px] text-zinc-400 mb-1 block">เลือกไฟล์วิดีโอในเครื่อง</label>
                    <input type="file" id="videoFileInput" accept="video/*" class="w-full px-3 py-2 bg-zinc-950 rounded-xl text-[10px] border border-zinc-700 outline-none focus:border-red-500 text-zinc-300 file:mr-2 file:py-1 file:px-2 file:rounded-lg file:border-0 file:text-[10px] file:font-semibold file:bg-red-600 file:text-white hover:file:bg-red-500">
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="closeUploadPopup()" class="flex-1 py-2 bg-zinc-700 rounded-xl text-xs">ยกเลิก</button>
                <button onclick="submitUploadVideo()" class="flex-1 py-2 bg-red-600 rounded-xl text-xs font-bold">อัปโหลด</button>
            </div>
        </div>
    </div>

    <!-- ป๊อปอัปสร้าง Playlist -->
    <div id="playlistPopup" class="fixed inset-0 bg-black/60 hidden flex justify-center items-center z-50 p-4">
        <div class="bg-zinc-800 p-6 rounded-3xl w-full max-w-xs border border-zinc-700 shadow-2xl animate-pop">
            <h3 class="text-sm font-bold mb-4 text-center">📂 สร้างเพลย์ลิสต์ใหม่</h3>
            <div class="space-y-3 mb-4">
                <input type="text" id="playlistNameInput" placeholder="ชื่อเพลย์ลิสต์..." class="w-full px-3 py-2 bg-zinc-950 rounded-xl text-xs border border-zinc-700 outline-none focus:border-red-500 text-white">
            </div>
            <div class="flex gap-2">
                <button onclick="closePlaylistPopup()" class="flex-1 py-2 bg-zinc-700 rounded-xl text-xs">ยกเลิก</button>
                <button onclick="submitCreatePlaylist()" class="flex-1 py-2 bg-red-600 rounded-xl text-xs font-bold">สร้าง</button>
            </div>
        </div>
    </div>

    <!-- Cute Custom Modal -->
    <div id="cuteModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex justify-center items-center z-[100] p-4">
        <div class="bg-zinc-900 border border-zinc-700 w-full max-w-xs rounded-[2rem] p-6 text-center shadow-2xl animate-pop relative">
            <div id="modalIcon" class="text-4xl mb-3">✨</div>
            <h3 id="modalTitle" class="text-sm font-bold text-white mb-1">หัวข้อแจ้งเตือน</h3>
            <p id="modalDesc" class="text-xs text-zinc-300 mb-5 leading-relaxed">รายละเอียด...</p>
            <button id="modalBtnOk" onclick="closeCuteModal()" class="w-full py-2.5 bg-red-600 hover:bg-red-500 rounded-xl text-xs font-bold transition shadow-lg shadow-red-900/30">ตกลง</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://pjapezytmawescgcbyxd.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_bAQw8ZRxU7djRR3w11vsfQ__ig0uUuX';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const CLOUD_NAME = 'bnz9fyns'; 
        const UPLOAD_PRESET = 'V-link';

        const email = localStorage.getItem('userEmail') || localStorage.getItem('user') || 'user@simulator.com';
        
        const urlParams = new URLSearchParams(window.location.search);
        let profileTargetEmail = urlParams.get('channel') || email;
        let isMyProfile = (profileTargetEmail === email);

        let allVideos = [];
        let userData = { channelName: profileTargetEmail.split('@')[0], followers_u: [], lastClaimedViews: 0, playlists: [], balance: 0 };
        let currentView = 'feed';
        let profileSubTab = 'overview';
        let currentPlayingVideo = null;

        window.addEventListener('DOMContentLoaded', async () => {
            await initSupabase();
        });

        function showCuteModal(title, desc, icon = '✨', onOk = null) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalDesc').innerText = desc;
            document.getElementById('modalIcon').innerText = icon;
            document.getElementById('modalBtnOk').onclick = () => {
                closeCuteModal();
                if(onOk) onOk();
            };
            document.getElementById('cuteModal').classList.remove('hidden');
        }

        function closeCuteModal() {
            document.getElementById('cuteModal').classList.add('hidden');
        }

        async function loadUserData(targetEmail) {
            let { data: userDoc, error } = await supabaseClient.from("users").select("*").eq("email", targetEmail).single();
            if (!userDoc) {
                let { data: userDocAlt } = await supabaseClient.from("users").select("*").eq("user", targetEmail).single();
                userDoc = userDocAlt;
            }

            if (!userDoc) {
                if (targetEmail === email) {
                    const newUserData = {
                        email: email,
                        user: email,
                        name: email.split('@')[0],
                        channelName: email.split('@')[0],
                        followers_u: [],
                        lastClaimedViews: 0,
                        playlists: [],
                        balance: 0
                    };
                    let { data: insertedData, error: insertError } = await supabaseClient.from("users").insert([newUserData]).select().single();
                    if(!insertError && insertedData) {
                        userData = insertedData;
                    }
                }
            } else {
                userData = userDoc;
                if(!userData.channelName) userData.channelName = targetEmail.split('@')[0];
                if(!userData.playlists) userData.playlists = [];
                if(userData.balance === undefined) userData.balance = 0;
            }
        }

        async function init() {
            await loadUserData(profileTargetEmail);
            fetchVideos();

            supabaseClient.channel('public:users-ulink')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'users', filter: `email=eq.${profileTargetEmail}` }, payload => {
                    if (payload.new) {
                        userData = payload.new;
                        if(currentView === 'myChannel') renderContent();
                    }
                })
                .subscribe();

            supabaseClient.channel('public:ulink_videos')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'ulink_videos' }, payload => {
                    fetchVideos();
                })
                .subscribe();
        }

        async function initSupabase() {
            await init();
        }

        async function fetchVideos() {
            let { data, error } = await supabaseClient.from("ulink_videos").select("*");
            if (!error && data) {
                allVideos = data;
                renderContent();
            }
        }

        window.playVideo = async (v) => {
            currentPlayingVideo = v;
            
            const currentViews = Number(v.views) || 0;
            const updatedViews = currentViews + 1;
            
            await supabaseClient.from("ulink_videos").update({ views: updatedViews }).eq('id', v.id);
            v.views = updatedViews;

            fetchComments(v.id);
            renderVideoView();
        };

        async function fetchComments(videoId) {
            let { data, error } = await supabaseClient.from("ulink_comments").select("*").eq("video_id", videoId).order("created_at", { ascending: false });
            if (!error) {
                renderCommentsList(data || []);
            }
        }

        function renderCommentsList(comments) {
            const listEl = document.getElementById('commentList');
            if(!listEl) return;
            listEl.innerHTML = comments.map(c => c.isSuperChat ? `
                <div class="bg-gradient-to-r from-amber-900 to-yellow-900 p-3 rounded-2xl border border-yellow-500 mb-2">
                    <div class="flex justify-between text-[10px] text-yellow-300 font-bold mb-1">
                        <span>${c.creatorName}</span>
                        <span>💰 ฿${c.amount}</span>
                    </div>
                    <p class="text-[11px] text-white">${c.text}</p>
                </div>` : `
                <div class="bg-zinc-800 p-3 rounded-2xl mb-2">
                    <p class="text-[9px] font-bold text-red-400">${c.creatorName}</p>
                    <p class="text-[10px] text-zinc-300">${c.text}</p>
                </div>`).join('');
        }

        window.renderVideoView = () => {
            const v = currentPlayingVideo;
            const likesArr = v.likes || [];
            const isLiked = likesArr.includes(email);
            const videoSource = v.videoId || '';
            const targetVideoId = v.id;
            const displayViews = Number(v.views) || 0;
            
            let playerHtml = `<video class="w-full h-full object-contain" controls autoplay src="${videoSource}"></video>`;

            document.getElementById('mainContent').innerHTML = `
                <button onclick="currentPlayingVideo=null; renderContent();" class="text-xs text-zinc-400 mb-2">← ย้อนกลับ</button>
                <div class="aspect-video w-full bg-black rounded-2xl overflow-hidden mb-4 relative">
                    ${playerHtml}
                </div>
                <h2 class="text-sm font-bold mb-1">${v.title}</h2>
                <p class="text-[10px] text-red-400 font-semibold mb-3">👁️ ${displayViews.toLocaleString()} วิว</p>
                <button onclick="toggleLike('${targetVideoId}')" class="w-full py-2 mb-4 rounded-xl text-xs font-bold ${isLiked ? 'bg-red-600' : 'bg-zinc-800'}">👍 Like (${likesArr.length})</button>
                
                <div class="bg-zinc-800 p-4 rounded-2xl mb-4 border border-zinc-700">
                    <p class="text-[10px] text-yellow-500 font-bold mb-2">🎁 ส่ง Super Chat</p>
                    <input type="number" id="amtInput" placeholder="ระบุจำนวนเงิน (฿)" class="w-full bg-zinc-950 p-2 rounded-xl text-[10px] mb-2 text-white">
                    <textarea id="msgInput" placeholder="ข้อความ..." class="w-full bg-zinc-950 p-2 rounded-xl text-[10px] mb-2 text-white"></textarea>
                    <button onclick="postSuperChat('${targetVideoId}')" class="w-full bg-yellow-600 py-2 rounded-xl text-[10px] font-bold">ส่ง Super Chat</button>
                </div>

                <div id="commentList" class="max-h-60 overflow-y-auto scrollbar-hide"></div>
                <div class="flex gap-2 mt-2">
                    <input id="commentInput" class="flex-1 bg-zinc-800 p-2 rounded-xl text-[10px] text-white" placeholder="แสดงความคิดเห็น...">
                    <button onclick="postComment('${targetVideoId}')" class="bg-red-600 px-4 rounded-xl text-[10px]">ส่ง</button>
                </div>`;
            fetchComments(targetVideoId);
        };

        window.postSuperChat = async (id) => {
            const amount = document.getElementById('amtInput').value;
            const text = document.getElementById('msgInput').value;
            if(!amount || !text) return;
            
            await supabaseClient.from("ulink_comments").insert([{
                video_id: id,
                text: text,
                amount: parseFloat(amount),
                creatorName: userData.channelName || email.split('@')[0],
                isSuperChat: true,
                created_at: new Date().toISOString()
            }]);
            document.getElementById('amtInput').value = '';
            document.getElementById('msgInput').value = '';
            fetchComments(id);
        };

        window.postComment = async (id) => {
            const text = document.getElementById('commentInput').value;
            if(!text) return;
            
            await supabaseClient.from("ulink_comments").insert([{
                video_id: id,
                text: text,
                amount: 0,
                creatorName: userData.channelName || email.split('@')[0],
                isSuperChat: false,
                created_at: new Date().toISOString()
            }]);
            document.getElementById('commentInput').value = '';
            fetchComments(id);
        };

        window.toggleLike = async (id) => {
            let targetVideo = allVideos.find(v => v.id === id);
            if(!targetVideo) return;
            let likes = targetVideo.likes || [];
            
            if(likes.includes(email)) {
                likes = likes.filter(e => e !== email);
            } else {
                likes.push(email);
            }

            await supabaseClient.from("ulink_videos").update({ likes: likes }).eq('id', targetVideo.id);
            fetchVideos();
        };

        window.claimEarnings = async () => {
            const myVideos = allVideos.filter(v => 
                v.creatorName === userData.channelName || 
                v.creatorName === profileTargetEmail ||
                v.creator === userData.channelName ||
                v.creator === profileTargetEmail
            );
            const totalViews = myVideos.reduce((sum, v) => sum + (Number(v.views) || 0), 0);
            const lastClaimed = userData.lastClaimedViews || 0;
            const unclaimedViews = Math.max(0, totalViews - lastClaimed);
            const earnedMoney = parseFloat((unclaimedViews / 1000).toFixed(2));

            if (earnedMoney <= 0) {
                showCuteModal('แจ้งเตือน', 'ยังไม่มีรายได้เพียงพอให้กดรับในขณะนี้', '⚠️');
                return;
            }

            const currentBalance = parseFloat(userData.balance || 0);
            const newBalance = currentBalance + earnedMoney;

            let { error } = await supabaseClient.from("users").update({ 
                lastClaimedViews: totalViews,
                balance: newBalance
            }).eq('email', profileTargetEmail);

            if (!error) {
                userData.lastClaimedViews = totalViews;
                userData.balance = newBalance;
                renderContent();
                
                showCuteModal('ยอดเงินเข้าธนาคารเรียบร้อยแล้ว! 🎉', `ยอดเงินจำนวน ฿${earnedMoney.toLocaleString()} เข้าบัญชีธนาคารของคุณสำเร็จ`, '💸');
            } else {
                showCuteModal('เกิดข้อผิดพลาด', error.message, '❌');
            }
        };

        window.switchView = async (v) => { 
            currentView = v; 
            if(v === 'myChannel') {
                profileTargetEmail = email;
                isMyProfile = true;
                await loadUserData(profileTargetEmail);
            }
            currentPlayingVideo = null;
            renderContent(); 
        };

        window.viewOtherChannel = async (targetEmail) => {
            currentView = 'myChannel';
            profileTargetEmail = targetEmail;
            isMyProfile = (profileTargetEmail === email);
            currentPlayingVideo = null;
            await loadUserData(profileTargetEmail);
            renderContent();
        };

        window.switchProfileTab = (tab) => {
            if (!isMyProfile && (tab === 'overview' || tab === 'like')) {
                showCuteModal('พื้นที่ส่วนตัว', 'หมวดหมู่นี้เป็นข้อมูลส่วนตัวของเจ้าของช่องครับ', '🔒');
                return;
            }
            profileSubTab = tab;
            renderContent();
        };

        window.openPopup = () => document.getElementById('namePopup').classList.remove('hidden');
        window.closePopup = () => document.getElementById('namePopup').classList.add('hidden');
        
        window.openUploadPopup = () => document.getElementById('uploadPopup').classList.remove('hidden');
        window.closeUploadPopup = () => document.getElementById('uploadPopup').classList.add('hidden');

        window.openPlaylistPopup = () => document.getElementById('playlistPopup').classList.remove('hidden');
        window.closePlaylistPopup = () => document.getElementById('playlistPopup').classList.add('hidden');

        function convertFileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        window.submitUploadVideo = async () => {
            const title = document.getElementById('uploadTitle').value.trim();
            const videoFileInput = document.getElementById('videoFileInput');
            const thumbnailFileInput = document.getElementById('thumbnailFileInput');
            
            if(!title || videoFileInput.files.length === 0 || thumbnailFileInput.files.length === 0) {
                showCuteModal('แจ้งเตือน', 'กรุณากรอกชื่อวิดีโอ เลือกรูปภาพปก และเลือกไฟล์วิดีโอให้ครบถ้วน', '⚠️');
                return;
            }

            const videoFile = videoFileInput.files[0];
            const thumbnailFile = thumbnailFileInput.files[0];
            
            showCuteModal('กำลังอัปโหลด', 'กำลังอัปโหลดวิดีโอขึ้นระบบ กรุณารอสักครู่...', '⏳');

            try {
                const formData = new FormData();
                formData.append('file', videoFile);
                formData.append('upload_preset', UPLOAD_PRESET);

                const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`, {
                    method: 'POST',
                    body: formData
                });
                const cloudinaryData = await response.json();

                if (!response.ok) {
                    throw new Error(cloudinaryData.error?.message || 'อัปโหลดวิดีโอไม่สำเร็จ');
                }

                const videoUrl = cloudinaryData.secure_url;
                const thumbnailBase64 = await convertFileToBase64(thumbnailFile);

                const generatedId = crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
                    let r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                    return v.toString(16);
                });

                let { error } = await supabaseClient.from("ulink_videos").insert([{
                    id: generatedId,
                    title: title,
                    videoId: videoUrl,
                    thumbnail: thumbnailBase64,
                    creator: email,
                    creatorName: userData.channelName || email.split('@')[0],
                    likes: [],
                    views: 0
                }]);

                closeCuteModal();

                if(!error) {
                    closeUploadPopup();
                    document.getElementById('uploadTitle').value = '';
                    videoFileInput.value = '';
                    thumbnailFileInput.value = '';
                    showCuteModal('สำเร็จ! 🎉', 'อัปโหลดวิดีโอและรูปปกเรียบร้อยแล้ว', '📹');
                    fetchVideos();
                } else {
                    showCuteModal('เกิดข้อผิดพลาด', error.message, '❌');
                }
            } catch (err) {
                closeCuteModal();
                showCuteModal('เกิดข้อผิดพลาด', err.message || 'ไม่สามารถเชื่อมต่อระบบอัปโหลดได้', '❌');
            }
        };

        window.deleteVideo = async (videoId) => {
            showCuteModal('ยืนยันการลบ', 'คุณต้องการลบวิดีโอนี้ใช่หรือไม่?', '🗑️', async () => {
                let { error } = await supabaseClient.from("ulink_videos").delete().eq('id', videoId);
                if(!error) {
                    fetchVideos();
                    showCuteModal('สำเร็จ', 'ลบวิดีโอเรียบร้อยแล้ว', '✅');
                } else {
                    showCuteModal('ผิดพลาด', error.message, '❌');
                }
            });
        };

        window.submitCreatePlaylist = async () => {
            const name = document.getElementById('playlistNameInput').value.trim();
            if(!name) return;
            
            let currentPlaylists = userData.playlists || [];
            currentPlaylists.push({ id: Date.now().toString(), name: name, videos: [] });

            await supabaseClient.from("users").update({ playlists: currentPlaylists }).eq('email', email);
            userData.playlists = currentPlaylists;
            closePlaylistPopup();
            document.getElementById('playlistNameInput').value = '';
            renderContent();
            showCuteModal('สำเร็จ', 'สร้างเพลย์ลิสต์ใหม่เรียบร้อยแล้ว', '📂');
        };
        
        window.saveChannelName = async () => {
            const val = document.getElementById('newNameInput').value.trim();
            if(val) { 
                await supabaseClient.from("users").update({ channelName: val, name: val }).eq('email', email);
                userData.channelName = val; 
                closePopup(); 
                renderContent(); 
            }
        };

        window.renderContent = () => {
            if (currentPlayingVideo) { renderVideoView(); return; }
            const container = document.getElementById('mainContent');
            const keyword = document.getElementById('searchInput') ? document.getElementById('searchInput').value.toLowerCase() : '';

            const tabFeedEl = document.getElementById('tabFeed');
            const tabMyEl = document.getElementById('tabMy');
            if(tabFeedEl && tabMyEl) {
                if(currentView === 'feed') {
                    tabFeedEl.className = 'flex-1 py-2.5 rounded-xl text-xs font-bold bg-red-600 text-white shadow-lg shadow-red-900/40';
                    tabMyEl.className = 'flex-1 py-2.5 rounded-xl text-xs font-bold bg-zinc-800 text-zinc-400 hover:bg-zinc-700';
                } else {
                    tabFeedEl.className = 'flex-1 py-2.5 rounded-xl text-xs font-bold bg-zinc-800 text-zinc-400 hover:bg-zinc-700';
                    tabMyEl.className = 'flex-1 py-2.5 rounded-xl text-xs font-bold bg-red-600 text-white shadow-lg shadow-red-900/40';
                }
            }

            if (currentView === 'feed') {
                const filtered = allVideos.filter(v => v.title.toLowerCase().includes(keyword) || (v.creatorName && v.creatorName.toLowerCase().includes(keyword)));
                
                container.innerHTML = filtered.length > 0 ? filtered.map(v => {
                    let thumbHtml = v.thumbnail ? `<img src="${v.thumbnail}" class="w-full h-full object-cover">` : `<div class="text-[10px] font-bold text-red-500">▶ VIDEO</div>`;
                    let displayViews = Number(v.views) || 0;
                    return `
                    <div onclick='playVideo(${JSON.stringify(v)})' class="bg-zinc-800/50 p-3 rounded-2xl flex gap-3 border border-zinc-700 cursor-pointer hover:bg-zinc-800 transition items-center">
                        <div class="w-24 h-16 rounded-lg bg-zinc-900 overflow-hidden flex items-center justify-center border border-zinc-700 flex-shrink-0">
                            ${thumbHtml}
                        </div>
                        <div class="flex-1">
                            <p class="text-xs font-bold line-clamp-2">${v.title}</p>
                            <p class="text-[10px] text-zinc-400 mt-1 cursor-pointer hover:underline" onclick="event.stopPropagation(); viewOtherChannel('${v.creator}')">${v.creatorName || 'ช่องทั่วไป'}</p>
                            <p class="text-[9px] text-red-400 font-semibold mt-0.5">👁️ ${displayViews.toLocaleString()} วิว</p>
                        </div>
                    </div>`;
                }).join('') : '<div class="text-xs text-zinc-500 text-center py-10">ไม่พบวิดีโอที่ค้นหา</div>';
            } else {
                const followers = Array.isArray(userData.followers_u) ? userData.followers_u : [];
                
                // แก้ไขเงื่อนไขการดึงข้อมูลวิดีโอช่องให้ครอบคลุมทั้งชื่อช่องและอีเมล
                const myVideos = allVideos.filter(v => 
                    v.creatorName === userData.channelName || 
                    v.creatorName === profileTargetEmail ||
                    v.creator === userData.channelName ||
                    v.creator === profileTargetEmail
                );

                let subTabsHtml = `
                    <div class="grid grid-cols-4 gap-1 bg-zinc-800/80 p-1 rounded-2xl border border-zinc-700 mb-4 text-center">
                        <button onclick="switchProfileTab('overview')" class="py-2 rounded-xl text-[10px] font-bold ${profileSubTab === 'overview' ? 'bg-red-600 text-white' : 'text-zinc-400'} ${!isMyProfile ? 'opacity-40' : ''}">ภาพรวม</button>
                        <button onclick="switchProfileTab('videos')" class="py-2 rounded-xl text-[10px] font-bold ${profileSubTab === 'videos' ? 'bg-red-600 text-white' : 'text-zinc-400'}">วีดีโอ</button>
                        <button onclick="switchProfileTab('playlist')" class="py-2 rounded-xl text-[10px] font-bold ${profileSubTab === 'playlist' ? 'bg-red-600 text-white' : 'text-zinc-400'}">Playlist</button>
                        <button onclick="switchProfileTab('like')" class="py-2 rounded-xl text-[10px] font-bold ${profileSubTab === 'like' ? 'bg-red-600 text-white' : 'text-zinc-400'} ${!isMyProfile ? 'opacity-40' : ''}">Like</button>
                    </div>
                `;

                let subContentHtml = '';

                if (profileSubTab === 'overview') {
                    if (!isMyProfile) {
                        subContentHtml = `<div class="text-xs text-zinc-500 text-center py-10">หมวดหมู่นี้เป็นข้อมูลส่วนตัวของเจ้าของช่อง</div>`;
                    } else {
                        const totalViews = myVideos.reduce((sum, v) => sum + (Number(v.views) || 0), 0);
                        const lastClaimed = userData.lastClaimedViews || 0;
                        const unclaimedViews = Math.max(0, totalViews - lastClaimed);
                        const earnedMoney = (unclaimedViews / 1000).toFixed(2);

                        subContentHtml = `
                            <button onclick="openUploadPopup()" class="w-full py-3 bg-red-600 hover:bg-red-500 rounded-2xl text-xs font-bold transition shadow-lg shadow-red-900/30 flex justify-center items-center gap-2 mb-4">
                                📹 อัปโหลดวิดีโอและรูปปก
                            </button>

                            <div class="bg-gradient-to-br from-zinc-800 to-zinc-900 p-5 rounded-3xl border border-zinc-700 shadow-xl space-y-3">
                                <div class="flex justify-between items-center">
                                    <span class="text-xs font-bold text-zinc-300">📊 สถิติและรายได้ช่อง</span>
                                    <span class="text-[10px] bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded-full border border-emerald-500/20">1,000 วิว = 1 ฿</span>
                                </div>
                                <div class="flex justify-between text-xs py-2 border-y border-zinc-700/50">
                                    <span class="text-zinc-400">ยอดวิวที่ยังไม่เคลียร์</span>
                                    <span class="font-bold text-white">${unclaimedViews.toLocaleString()} วิว</span>
                                </div>
                                <div class="flex justify-between items-center">
                                    <span class="text-xs text-zinc-400">รายได้สะสม</span>
                                    <span class="text-base font-extrabold text-emerald-400">฿${earnedMoney}</span>
                                </div>
                                <button onclick="claimEarnings()" class="w-full mt-2 py-2.5 bg-emerald-600 hover:bg-emerald-500 rounded-xl text-xs font-bold transition shadow-lg shadow-emerald-900/20">
                                    💸 กดรับเงินเข้าธนาคาร
                                </button>
                            </div>`;
                    }
                } 
                else if (profileSubTab === 'videos') {
                    subContentHtml = myVideos.length > 0 ? myVideos.map(v => {
                        let thumbHtml = v.thumbnail ? `<img src="${v.thumbnail}" class="w-full h-full object-cover">` : `<div class="text-[10px] font-bold text-red-500">▶</div>`;
                        let displayViews = Number(v.views) || 0;
                        return `
                        <div class="bg-zinc-800/50 p-3 rounded-2xl flex gap-3 border border-zinc-700 items-center">
                            <div onclick='playVideo(${JSON.stringify(v)})' class="w-24 h-16 rounded-lg bg-zinc-900 overflow-hidden flex items-center justify-center border border-zinc-700 cursor-pointer flex-shrink-0">
                                ${thumbHtml}
                            </div>
                            <div class="flex-1 cursor-pointer" onclick='playVideo(${JSON.stringify(v)})'>
                                <p class="text-xs font-bold line-clamp-2">${v.title}</p>
                                <p class="text-[10px] text-zinc-400 mt-1">${displayViews.toLocaleString()} วิว</p>
                            </div>
                            ${isMyProfile ? `<button onclick="deleteVideo('${v.id}')" class="p-2 bg-red-900/40 text-red-400 rounded-xl text-xs hover:bg-red-800">🗑️</button>` : ''}
                        </div>`;
                    }).join('') : '<div class="text-xs text-zinc-500 text-center py-10">ยังไม่มีวิดีโอในช่องนี้</div>';
                }
                else if (profileSubTab === 'playlist') {
                    const playlists = userData.playlists || [];
                    subContentHtml = `
                        ${isMyProfile ? `<button onclick="openPlaylistPopup()" class="w-full py-2.5 bg-zinc-800 hover:bg-zinc-700 rounded-xl text-xs font-bold border border-zinc-700 mb-3">➕ สร้างเพลย์ลิสต์ใหม่</button>` : ''}
                        ${playlists.length > 0 ? playlists.map(pl => `
                            <div class="bg-zinc-800 p-4 rounded-2xl border border-zinc-700 mb-3">
                                <div class="flex justify-between items-center mb-2">
                                    <h4 class="text-xs font-bold text-red-400">📂 ${pl.name}</h4>
                                    <span class="text-[10px] text-zinc-400">${pl.videos ? pl.videos.length : 0} วิดีโอ</span>
                                </div>
                                <p class="text-[10px] text-zinc-400">รวมคลิปวิดีโอหมวดหมู่เดียวกันเพื่อให้รับชมต่อเนื่อง</p>
                            </div>`).join('') : '<div class="text-xs text-zinc-500 text-center py-10">ยังไม่มีเพลย์ลิสต์</div>'}
                    `;
                }
                else if (profileSubTab === 'like') {
                    if (!isMyProfile) {
                        subContentHtml = `<div class="text-xs text-zinc-500 text-center py-10">หมวดหมู่นี้เป็นข้อมูลส่วนตัวของเจ้าของช่อง</div>`;
                    } else {
                        const likedVideos = allVideos.filter(v => v.likes && v.likes.includes(email));
                        subContentHtml = `
                            <h4 class="text-xs font-bold text-zinc-300 mb-2">❤️ วิดีโอที่คุณถูกใจ</h4>
                            <div class="space-y-2">
                                ${likedVideos.length > 0 ? likedVideos.map(v => {
                                    let thumbHtml = v.thumbnail ? `<img src="${v.thumbnail}" class="w-full h-full object-cover">` : `<div class="text-[9px] text-red-500">▶</div>`;
                                    return `
                                    <div onclick='playVideo(${JSON.stringify(v)})' class="bg-zinc-800/50 p-2.5 rounded-2xl flex gap-3 border border-zinc-700 cursor-pointer items-center">
                                        <div class="w-16 h-12 rounded-lg bg-zinc-900 overflow-hidden flex items-center justify-center border border-zinc-700 flex-shrink-0">${thumbHtml}</div>
                                        <div class="flex-1"><p class="text-xs font-bold line-clamp-1">${v.title}</p><p class="text-[9px] text-zinc-400">${v.creatorName || 'ช่องทั่วไป'}</p></div>
                                    </div>`;
                                }).join('') : '<div class="text-[11px] text-zinc-500 text-center py-4">ยังไม่มีวิดีโอที่กดถูกใจ</div>'}
                            </div>
                        `;
                    }
                }

                container.innerHTML = `
                    <div class="text-center bg-zinc-800 p-5 rounded-3xl mb-4 border border-zinc-700">
                        <h2 class="text-xl font-bold">${userData.channelName || profileTargetEmail.split('@')[0]}</h2>
                        <div class="flex justify-center items-center gap-2 mt-1">
                            <p class="text-[11px] text-red-400 font-bold">${followers.length.toLocaleString()} ผู้ติดตาม</p>
                        </div>
                        ${isMyProfile ? `<button onclick="openPopup()" class="mt-3 text-[9px] bg-zinc-700 px-4 py-1 rounded-full text-zinc-300">✏️ แก้ไขชื่อช่อง</button>` : ''}
                    </div>

                    ${subTabsHtml}
                    ${subContentHtml}
                `;
            }
        };
    </script>
</body>
</html>
