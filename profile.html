<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Virtual Idol Ecosystem</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Prompt', sans-serif; } </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-zinc-900 to-indigo-950 text-white min-h-screen flex justify-center items-center p-4">

    <div class="w-full max-w-md bg-slate-900/95 backdrop-blur-2xl border border-purple-500/30 rounded-[2.5rem] shadow-2xl overflow-hidden p-6 flex flex-col">
        
        <!-- Top Bar -->
        <div class="flex justify-between items-center mb-6">
            <button onclick="window.location.href='home.html'" class="bg-slate-800/80 hover:bg-slate-700 px-4 py-2 rounded-2xl text-xs transition text-slate-300">← หน้าหลัก</button>
            <span class="text-[10px] font-bold text-purple-400 bg-purple-500/20 px-3 py-1 rounded-full border border-purple-500/30">MY PROFILE</span>
        </div>

        <!-- Profile Header & Avatar Picker -->
        <div class="text-center relative mb-6">
            <div class="w-24 h-24 mx-auto bg-slate-800 rounded-full mb-3 border-4 border-purple-500/80 flex items-center justify-center overflow-hidden cursor-pointer hover:opacity-85 transition shadow-lg relative group"
                 onclick="document.getElementById('fileInput').click()" title="เปลี่ยนรูปโปรไฟล์">
                <img id="profileImg" src="https://via.placeholder.com/150" class="w-full h-full object-cover">
                <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
                    <span id="uploadText" class="text-[10px] font-bold text-white bg-black/60 px-2 py-1 rounded-full">เปลี่ยนรูป</span>
                </div>
            </div>
            <input type="file" id="fileInput" class="hidden" accept="image/*">
            
            <h2 id="displayName" class="text-xl font-bold text-white">กำลังโหลด...</h2>
            <!-- แสดง ID แอคเคาท์ 6 หลัก -->
            <p class="text-[11px] text-slate-400 mt-0.5">ID: <span id="userIdDisplay" class="font-mono text-purple-400 font-bold">------</span></p>
        </div>

        <!-- Bank Card -->
        <div class="bg-gradient-to-br from-slate-800 via-slate-900 to-indigo-950 p-5 rounded-3xl border border-purple-500/20 mb-6 shadow-xl">
            <p class="text-[10px] text-slate-400 uppercase tracking-widest mb-1">เลขบัญชีธนาคาร (10 หลัก)</p>
            <p id="accNum" class="font-mono text-lg font-bold text-white mb-3">----------</p>
            <p class="text-[10px] text-slate-400 uppercase tracking-widest mb-0.5">ยอดเงินคงเหลือ</p>
            <p id="balance" class="text-2xl font-bold text-emerald-400">0 ฿</p>
        </div>

        <!-- Edit Form -->
        <div class="space-y-3.5 bg-slate-800/40 border border-slate-700/50 p-5 rounded-3xl">
            <h3 class="text-xs font-bold text-amber-400 mb-2">📝 แก้ไขข้อมูลส่วนตัว</h3>
            
            <div>
                <label class="text-[10px] text-slate-400 mb-1 block">ชื่อจริง</label>
                <input type="text" id="realName" placeholder="ระบุชื่อจริง" class="w-full px-3 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-purple-500">
            </div>

            <div>
                <label class="text-[10px] text-slate-400 mb-1 block">ชื่อเล่น</label>
                <input type="text" id="nickName" placeholder="ระบุชื่อเล่น" class="w-full px-3 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-purple-500">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="text-[10px] text-slate-400 mb-1 block">อายุ</label>
                    <input type="number" id="age" placeholder="อายุ" class="w-full px-3 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-purple-500">
                </div>
                <div>
                    <label class="text-[10px] text-slate-400 mb-1 block">วันเกิด</label>
                    <input type="date" id="birthDate" class="w-full px-3 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-purple-500">
                </div>
            </div>

            <div>
                <label class="text-[10px] text-slate-400 mb-1 block">สังกัดค่าย</label>
                <select id="agencySelect" class="w-full px-3 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-slate-300 focus:outline-none focus:border-purple-500">
                    <option value="independent">อิสระ</option>
                    <option value="LumiStar Entertainment">LumiStar Entertainment</option>
                    <option value="SolNight Music">SolNight Music</option>
                </select>
            </div>

            <button onclick="saveProfile()" class="w-full mt-2 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 py-3 rounded-xl font-bold text-xs transition shadow-lg shadow-purple-900/40">
                บันทึกข้อมูล
            </button>
        </div>
    </div>

    <!-- Supabase Logic -->
    <script type="module">
        import { supabase } from './supabase-config.js';

        const email = localStorage.getItem('userEmail');
        if (!email) {
            alert("กรุณาเข้าสู่ระบบก่อนใช้งาน");
            window.location.href = 'index.html';
        }

        const CLOUD_NAME = "bnz9fyns";
        const UPLOAD_PRESET = "V-link";
        let uploadedProfileImgUrl = "";

        // จัดการอัปโหลดรูปภาพผ่าน Cloudinary
        document.getElementById('fileInput').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('uploadText').innerText = "กำลังอัปโหลด...";
            const formData = new FormData();
            formData.append("file", file);
            formData.append("upload_preset", UPLOAD_PRESET);

            try {
                const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
                    method: "POST",
                    body: formData
                });
                const data = await response.json();

                if (data.secure_url) {
                    uploadedProfileImgUrl = data.secure_url;
                    document.getElementById('profileImg').src = uploadedProfileImgUrl;
                    document.getElementById('uploadText').innerText = "เปลี่ยนรูป";
                } else {
                    alert("อัปโหลดรูปไม่สำเร็จ กรุณาลองใหม่อีกครั้ง");
                    document.getElementById('uploadText').innerText = "เปลี่ยนรูป";
                }
            } catch (error) {
                console.error("Cloudinary Error:", error);
                alert("เกิดข้อผิดพลาดในการเชื่อมต่อเพื่ออัปโหลดรูปภาพ");
                document.getElementById('uploadText').innerText = "เปลี่ยนรูป";
            }
        });

        async function initProfile() {
            // ดึงข้อมูลผู้ใช้จากตาราง users โดยใช้อีเมลเป็น ID
            let { data: d, error } = await supabase
                .from('users')
                .select('*')
                .eq('id', email)
                .single();

            if (!d) {
                const newAcc = Math.floor(1000000000 + Math.random() * 9000000000).toString();
                const newUserId = Math.floor(100000 + Math.random() * 900000).toString();
                const initialData = {
                    id: email,
                    userId: newUserId,
                    accountNumber: newAcc,
                    balance: 1000000,
                    email: email,
                    name: email.split('@')[0],
                    user: '@' + email.split('@')[0],
                    bio: 'สวัสดี ฉันเป็นสมาชิกใหม่ของ Virtual Idol Ecosystem',
                    realName: "",
                    nickName: "",
                    age: null,
                    birthDate: null,
                    agency: "independent",
                    profileImg: "https://via.placeholder.com/150",
                    contacts: []
                };
                await supabase.from('users').insert([initialData]);
                d = initialData;
            } else {
                let updates = {};
                if (!d.userId) updates.userId = Math.floor(100000 + Math.random() * 900000).toString();
                if (!d.accountNumber) updates.accountNumber = Math.floor(1000000000 + Math.random() * 9000000000).toString();
                if (d.balance === undefined) updates.balance = 1000000;

                if (Object.keys(updates).length > 0) {
                    await supabase.from('users').update(updates).eq('id', email);
                    Object.assign(d, updates);
                }
            }

            // แสดงผลข้อมูลลงในหน้า HTML
            document.getElementById('displayName').innerText = d.name || email.split('@')[0];
            document.getElementById('userIdDisplay').innerText = d.userId || "------";
            document.getElementById('accNum').innerText = d.accountNumber || "---------";
            document.getElementById('balance').innerText = (d.balance || 0).toLocaleString() + ' ฿';
            
            document.getElementById('realName').value = d.realName || "";
            document.getElementById('nickName').value = d.nickName || "";
            document.getElementById('age').value = d.age || "";
            document.getElementById('birthDate').value = d.birthDate || "";
            document.getElementById('agencySelect').value = d.agency || "independent";
            
            if(d.profileImg) {
                uploadedProfileImgUrl = d.profileImg;
                document.getElementById('profileImg').src = d.profileImg;
            }
        }

        window.saveProfile = async () => {
            const realName = document.getElementById('realName').value;
            const nickName = document.getElementById('nickName').value;
            const ageVal = document.getElementById('age').value;
            const age = ageVal ? parseInt(ageVal) : null;
            const birthDate = document.getElementById('birthDate').value || null;
            const agency = document.getElementById('agencySelect').value;

            try {
                const { error } = await supabase
                    .from('users')
                    .update({
                        realName,
                        nickName,
                        age,
                        birthDate,
                        agency,
                        profileImg: uploadedProfileImgUrl || "https://via.placeholder.com/150"
                    })
                    .eq('id', email);

                if (error) throw error;
                alert("บันทึกข้อมูลส่วนตัวเรียบร้อยแล้ว!");
            } catch (error) {
                console.error("Error saving profile: ", error);
                alert("เกิดข้อผิดพลาดในการบันทึกข้อมูล: " + error.message);
            }
        };

        initProfile();
    </script>
</body>
</html>
